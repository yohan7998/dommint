@layer tools {
/* ==== stage.css ==== */
/* stage.css — 슬라이드 표시 계약. 도구 계층(@layer tools)에 산다.
 *
 * "어느 장을 보여줄지"는 언제나 도구가 정한다. 이 규칙이 deck.css 안에만 있으면
 * 덱 CSS 를 갈아끼우는 순간(=흡수) 사라진다 — 실제로 그랬다: 고객 A 덱을
 * 흡수했더니 슬라이드 14장이 DOM 에 다 있고 카운터도 1/14 인데 화면이 하얗게 비었다.
 * 남의 덱은 자기 방식(.slide{display:none} + .slide.on{display:block})으로 감춰 두고
 * 그것을 켜 주던 JS 는 따라오지 않기 때문이다.
 *
 * display 를 명시하는 것이 핵심이다. @layer 는 양쪽이 선언한 속성만 이긴다 —
 * 도구가 display 를 말하지 않으면 흡수 CSS 의 display:none 이 그대로 이긴다
 * (Task 1 에서 #deck-menu-toggle 이 사라졌던 것과 같은 실패).
 *
 * 전환(transform·transition)은 여기서 정하지 않는다. 그건 덱의 취향이라
 * deck.css 가 계속 쥔다. 인쇄(print.css)와 오버뷰(ui.css)는 !important 로
 * 이 규칙을 덮어 모든 장을 드러낸다 — 그쪽이 의도된 예외다.
 */
/* 무대와 캔버스의 기하. fit() 이 #deck 을 1280×720 로 가정하고 배율을 잰다 —
 * 이 크기가 없으면 슬라이드가 inset:0 으로 높이 0이 된다(실측: 1264×0). */
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #050b18; }
#deck { position: relative; width: 1280px; height: 720px; transform-origin: center center; overflow: hidden;
        zoom: 1; scale: none; translate: none; rotate: none; }
/* zoom·scale·translate·rotate 를 **명시**하는 이유: 흡수 CSS 의 `body{...}` 는 `:scope`(=#deck)로
 * 치환된다(문서 기본값인 색·글꼴을 살리려는 표적 치환이다). 그런데 배율은 상속 속성이 아니라
 * **요소 자신의 기하**라, 도구가 그 속성을 선언하지 않으면 그대로 무대에 걸린다 —
 * 이 파일 머리의 *"@layer 는 양쪽이 선언한 속성만 이긴다"* 가 정확히 이 자리에서 다시 났다.
 * 실측: `body{zoom:.2}` 하나로 1280×720 무대가 256×144 가 됐다. */
/* #deck 의 배경은 여기서 정하지 않는다 — 캔버스 색은 덱의 취향이라 deck.css 나
 * 흡수한 CSS 가 칠한다. #stage 는 슬라이드 바깥이라 도구 크롬이므로 여기서 정한다. */

#deck > section.slide { position: absolute; inset: 0; display: block; opacity: 0; visibility: hidden; }
#deck > section.slide.active { opacity: 1; visibility: visible; z-index: 2; }


/* 내비게이션·진행바·힌트 = 도구 크롬. 마크업은 template.html 에 있고 납품 덱에도 실린다.
 * 스타일이 deck.css 에 있으면 덱 CSS 를 갈아끼우는 순간(=흡수) 통째로 사라진다 —
 * 실측: 흡수 후 .nav 가 position:static 으로 문서 맨 위에 맨 버튼으로 떴다.
 * 색 변수는 덱의 :root 에서 오므로 흡수한 덱을 대비해 폴백을 둔다. */
#bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--cyan, #00B3FF),var(--mint, #00E6BD));z-index:50;transition:width .4s ease;}
/* --nav-a = 네비 투명도. **기본값(.92)은 여기 한 곳**이다 — 흐리면 발표자가 네비를 못 찾는다.
 * 메뉴의 '보통·흐리게'는 20-nav.js NAV_ALPHA 가 이 변수를 덮고, '뚜렷'은 변수를 지워 이 값으로 돌아온다. */
.nav{position:fixed;top:50%;right:14px;left:auto;bottom:auto;transform:translateY(-50%);z-index:40;opacity:var(--nav-a, .92);transition:opacity .2s ease;
  display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(10,23,48,.62);backdrop-filter:blur(8px);
  padding:14px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.12);}
.nav:hover{opacity:1;}
.nav button{background:none;border:none;color:#cfe0f7;cursor:pointer;font-size:16px;width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;}
.nav button:hover{background:rgba(255,255,255,.14);color:#fff;}
.nav #prev{transform:rotate(90deg);}
.nav #next{transform:rotate(90deg);}
.dots{display:flex;flex-direction:column;gap:6px;align-items:center;}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.25s;}
.dots i.on{background:var(--cyan, #00B3FF);height:20px;border-radius:4px;}
/* 숫자만 가로로 읽힌다(사용자 요청 2026-09-11). 화살표의 세로 배치는 그대로 —
 * 세로였던 이유는 `writing-mode:vertical-rl`(+180° 회전)이고 transform 이 아니었다.
 * 역회전으로 되돌리면 클릭 영역·정렬이 어긋나므로 writing-mode 를 되돌린다. */
.counter{color:#cfe0f7;font-size:12px;font-weight:700;text-align:center;letter-spacing:.03em;
  writing-mode:horizontal-tb;white-space:nowrap;min-height:0;padding:1px 0;}
/* ⚠ `.nav>span` 은 **구분선 두 개와 카운터를 함께** 잡는다(셋 다 .nav 의 직계 span 이다).
 * 구분선만 되돌리려던 규칙인데(흡수한 덱 CSS 가 덮을 때를 대비) 카운터까지 20×1px 로
 * 눌러 버린다 — 세로일 때는 min-height 가 이겨 안 드러났지만 가로로 바꾸면 줄바꿈된다. */
.nav>span:not(.counter){width:20px!important;height:1px!important;}
.hint{position:fixed;right:18px;bottom:14px;color:#8da4c9;font-size:11.5px;z-index:40;}


/* ==== ui.css ==== */
/* ===== Deck tooling UI (v2) — menu, panels, dialogs, text edit, agenda, review, pen, media, toast ===== */
#stage:focus{outline:none}
[data-ui]{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;box-sizing:border-box}
[data-ui] *{box-sizing:border-box}
[data-ui] button{font-family:inherit}

/* ---- menu ---- */
/* 글자 '메뉴' 는 마크업에 남는다 — font-size:0 으로 감추기만 한다(스크린리더·테스트가 읽는 이름). */
#deck-menu-toggle{display:inline-block;position:fixed;top:14px;right:16px;z-index:1000001;border:0;border-radius:12px;width:104px;height:44px;padding:0;background:#fff url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACwAAAAsCAYAAAAehFoBAAAA10lEQVR42mNgGAWjYBSMglEwCkbBKBgFo2BoA3EFi3ggnj8kHPv////4y1dv/lfVdfk/6B0Ncux/KBj0jgYlg7zipv/IYNA6GppmQQ77j83RGobu54Fy/IPOsTgcfR6IB69j0Rw9NBwLxYM7GYw6dtSxo44ddeyoY6nqWH0gfj/qWBo4lh/qIGwOXQ9NJoPasSB+PhDLD7oGuJCkznwOHtH/orIm94EO7AcljUHbteEWkJnPyMT8H9TLAeLzQMzPMApG8BhCPZ2xPKUO/k9nbD+yQngUUAgApK14A1oerSEAAAAASUVORK5CYII=) center/auto 22px no-repeat;color:#111;font-size:0;cursor:pointer;box-shadow:0 5px 18px #0004}
#deck-menu-toggle:hover{transform:translateY(-1px)}
#deck-menu-toggle[aria-expanded="true"]{background-color:#00b3ff;color:#071a38}
:fullscreen #deck-menu-toggle{opacity:.25}:fullscreen #deck-menu-toggle:hover{opacity:1}
/* max-height/overflow 는 필수다 — 항목이 늘면 메뉴가 화면 밖으로 넘쳐 아래쪽 항목을 누를 수 없다(실제 회귀). */
#deck-menu{position:fixed;top:62px;right:16px;z-index:1000003;display:none;flex-direction:column;gap:3px;width:264px;padding:8px;border-radius:14px;background:rgba(10,23,48,.97);box-shadow:0 18px 50px #0007;border:1px solid #ffffff1c;max-height:calc(100vh - 78px);overflow-y:auto;overscroll-behavior:contain}
#deck-menu.open{display:flex}
#deck-menu .menu-group{color:#7fa8e0;font:800 10px Pretendard,Arial;letter-spacing:.08em;text-transform:uppercase;margin:8px 4px 3px}
#deck-menu .menu-group:first-child{margin-top:2px}
#deck-menu .menu-item{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:9px;padding:9px 12px;background:#10254e;color:#fff;font:700 13px Pretendard,Arial;cursor:pointer;text-align:left}
#deck-menu .menu-item:hover,#deck-menu .menu-item.on{background:#00b3ff;color:#071a38}
#deck-menu .menu-item kbd{font:700 10px Pretendard,Arial;color:#9fc8ee;background:#ffffff14;border-radius:5px;padding:2px 6px}
#deck-menu .menu-item.on kbd,#deck-menu .menu-item:hover kbd{color:#071a38;background:#ffffff66}
#deck-menu .menu-item.has-badge::after{content:attr(data-badge);position:absolute;right:8px;top:6px;min-width:8px;height:8px;border-radius:999px;background:#FFCC48;color:#3a2b00;font:800 9px/14px Pretendard,Arial;padding:0 4px;box-shadow:0 0 0 2px #10254e}
#deck-menu .menu-item.has-badge[data-badge]::after{height:14px;top:4px}
#deck-menu .menu-item.has-badge kbd{margin-right:12px}

/* ---- panels ---- */
.dpanel{position:fixed;z-index:1000002;right:16px;top:112px;width:400px;max-height:calc(100vh - 130px);display:none;flex-direction:column;background:#fff;border:1px solid #cfd9e8;border-radius:15px;box-shadow:0 24px 70px #0006;overflow:hidden;color:#10254e}
.dpanel.open{display:flex}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 14px 10px;background:#0A1B3D;color:#fff}
.panel-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.panel-title b{font:900 15px Pretendard,Arial;color:#fff}
.panel-title small{font:600 11px Pretendard,Arial;color:#9fc8ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-title small:empty{display:none}
.panel-close{flex:0 0 auto;border:0;background:#ffffff1f;color:#fff;width:30px;height:30px;border-radius:8px;font:900 18px/1 Pretendard,Arial;cursor:pointer}
.panel-close:hover{background:#00b3ff;color:#071a38}
.panel-body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid #e6ecf5;background:#f7f9fc}
.panel-foot:empty{display:none}
.panel-foot button,.panel-body button.btn{border:0;border-radius:9px;padding:9px 12px;font:800 12px Pretendard,Arial;cursor:pointer;background:#e7eefb;color:#10254e}
.panel-foot button.primary,.panel-body button.btn.primary{background:#2c6fe4;color:#fff}
.panel-foot button.danger,.panel-body button.btn.danger{background:#ffe9e5;color:#c0392b}
.panel-foot button.success,.panel-body button.btn.success{background:#0A9E6C;color:#fff}
.panel-foot button.accent,.panel-body button.btn.accent{background:#7C3AED;color:#fff}
.panel-foot button:hover,.panel-body button.btn:hover{filter:brightness(1.06)}
.panel-body .sec-h{display:flex;align-items:center;justify-content:space-between;gap:6px;font:800 12px Pretendard,Arial;color:#334963;margin-top:4px}
.panel-body .sec-h .cnt{font:800 11px Pretendard,Arial;color:#fff;background:#00A9D9;border-radius:999px;padding:1px 7px}
.panel-body .muted{font:12px/1.5 Pretendard,Arial;color:#8a93a6}
.panel-body textarea,.panel-body input[type=text]{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px;font:14px/1.55 Pretendard,Arial;color:#10254e;background:#fff}
.panel-body textarea:focus,.panel-body input[type=text]:focus{outline:2px solid #00b3ff;border-color:transparent}
.status-line{font:12px/1.5 Pretendard,Arial;color:#5b6b85;background:#f2f6fb;border-radius:8px;padding:6px 8px}
:fullscreen .dpanel{max-height:calc(100vh - 60px)}

/* ---- dialogs ---- */
dialog.ddialog{border:0;border-radius:17px;padding:0;width:min(560px,calc(100vw - 40px));background:#fff;color:#10254e;box-shadow:0 24px 70px #0007;font-family:Pretendard,Arial}
dialog.ddialog.wide{width:min(760px,calc(100vw - 40px))}
dialog.ddialog::backdrop{background:#071226aa}
dialog.ddialog .dlg-title{font:900 17px Pretendard,Arial;padding:18px 22px 6px}
dialog.ddialog .dlg-body{padding:6px 22px 14px;font:14px/1.6 Pretendard,Arial;color:#334963;max-height:60vh;overflow:auto}
dialog.ddialog .dlg-body p{margin:0 0 8px}
dialog.ddialog .dlg-body textarea{width:100%;min-height:170px;border:2px solid #cbd5e1;border-radius:11px;padding:12px;font:16px/1.55 Pretendard,Arial;resize:vertical;color:#10254e}
dialog.ddialog .dlg-body textarea:focus{outline:2px solid #00b3ff;border-color:transparent}
dialog.ddialog .dlg-body label.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font:600 14px Pretendard,Arial;cursor:pointer}
dialog.ddialog .dlg-body table.help{border-collapse:collapse;width:100%}
dialog.ddialog .dlg-body table.help td{padding:6px 8px;border-bottom:1px solid #eef2f7;font:13px Pretendard,Arial}
dialog.ddialog .dlg-body table.help td:first-child{font-weight:800;color:#10254e;white-space:nowrap}
dialog.ddialog .dlg-buttons{display:flex;justify-content:flex-end;gap:8px;padding:10px 22px 18px}
dialog.ddialog .dlg-buttons button{border:0;border-radius:9px;padding:10px 18px;font:800 13px Pretendard,Arial;cursor:pointer;background:#e7eefb;color:#10254e}
dialog.ddialog .dlg-buttons button.primary{background:#2c6fe4;color:#fff}
dialog.ddialog .dlg-buttons button.danger{background:#c0392b;color:#fff}

/* ---- toast ---- */
#deck-toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:1000010;background:#0A1B3D;color:#fff;padding:10px 16px;border-radius:10px;font:700 13px Pretendard,Arial;box-shadow:0 10px 30px #0006;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw}
#deck-toast.on{opacity:1}

/* ---- text edit mode ---- */
body.mode-edit #deck [data-key]{cursor:text}
body.mode-edit #deck [data-key].edit-hover{outline:3px solid #00b3ff!important;outline-offset:2px;background-color:#00b3ff18!important}
#edit-help{position:fixed;top:62px;right:16px;z-index:999998;background:#fff;color:#10254e;padding:9px 13px;border-radius:9px;box-shadow:0 4px 18px #0005;font:700 13px Pretendard,Arial}

/* ---- agenda ---- */
.ag-tools{display:flex;flex-wrap:wrap;gap:6px}
.ag-tools button{border:0;border-radius:8px;padding:8px 10px;font:800 12px Pretendard,Arial;cursor:pointer;background:#e7eefb;color:#10254e}
.ag-tools button.pri{background:#2c6fe4;color:#fff}.ag-tools button.warn{background:#ffe9e5;color:#c0392b}.ag-tools button.merge{background:#ede9fe;color:#5b21b6}
.ag-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ag-item{display:grid;grid-template-columns:18px 18px 26px 1fr auto;align-items:center;gap:6px;padding:7px 8px;border:1px solid #e3e9f2;border-radius:10px;background:#fff}
.ag-item.act{border-color:#00b3ff;background:#f0faff}
.ag-item.dragging{opacity:.45}.ag-item.dragover{outline:2px dashed #00b3ff}
.ag-item.mergeon{background:#f5f0ff;border-color:#c4b5fd}
.ag-item .grip{cursor:grab;color:#9fb0c9;font-size:15px;text-align:center;user-select:none}
.ag-item .no{font:900 12px Pretendard,Arial;color:#fff;background:#10254e;border-radius:6px;text-align:center;padding:3px 0}
.ag-item .ti{cursor:pointer;min-width:0}
.ag-item .ti b{display:flex;align-items:center;gap:4px;font:800 13px Pretendard,Arial;color:#10254e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item .ti span{display:block;font:11px Pretendard,Arial;color:#8a93a6}
.ag-item .mv{display:flex;gap:2px}
.ag-item .mv button{border:0;background:#eef2f8;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:11px;color:#334963}
.ag-flag{display:inline-block;border-radius:5px;padding:1px 5px;font:800 10px Pretendard,Arial}
.ag-flag.new{background:#dcfce7;color:#166534}.ag-flag.mrg{background:#ede9fe;color:#5b21b6}.ag-flag.pen{background:#f3e8ff;color:#7C3AED}.ag-flag.note{background:#fef3c7;color:#92400e}
.ag-summary{white-space:pre-wrap;font:11.5px/1.55 Pretendard,Arial;color:#334963;background:#f4f7fb;border-radius:9px;padding:8px 10px;max-height:150px;overflow:auto}

/* ---- review (memo) ---- */
/* 프리셋 39개 — 접기·검색이 없으면 메모창이 스크롤 저 아래로 밀린다 */
.rv-presets{display:flex;flex-direction:column;gap:6px}
.rv-presets [hidden]{display:none!important}
#rv-search{width:100%;border:1px solid #d7e0ee;border-radius:9px;padding:6px 9px;font:600 11.5px Pretendard,Arial;color:#10254e;background:#fff}
#rv-search:focus{outline:0;border-color:#00b3ff}
/* 좌: 카테고리 · 우: 그 카테고리의 칩만. 접었다 펴던 때는 전부 펼치면 581px 로 패널
 * body(454px)를 넘겼다 — 2열은 헤더가 쓰던 세로를 칩과 나눠 써 ≈196px 이고, 오른쪽이
 * 언제나 하나뿐이라 **무엇을 눌러도 넘치지 않는다**(사용자 요청 2026-09-11). */
.pz-2col{display:grid;grid-template-columns:132px 1fr;gap:8px;align-items:start}
.pz-cats{display:flex;flex-direction:column;gap:2px;min-width:0}
.pz-panel{min-width:0}
.rv-presets button.cat{display:flex;align-items:center;gap:5px;width:100%;border:0;border-radius:7px;background:transparent;padding:5px 7px;font:800 10.5px/1.35 Pretendard,Arial;color:#7fa8e0;cursor:pointer;text-align:left;word-break:keep-all}
.rv-presets button.cat:hover{background:#eef3fb;color:#10254e}
.rv-presets button.cat.on{background:#10254e;color:#fff}
.rv-presets button.cat .cnt{margin-left:auto}
.rv-presets button.cat.on .cnt{background:#00b3ff;color:#071a38}
.rv-presets button.cat .cnt{background:#e7eefb;color:#5b7ba8;border-radius:999px;padding:0 5px;font:800 9.5px Pretendard,Arial}
.pz-items{display:flex;flex-wrap:wrap;gap:5px}
.rv-presets button.pz{border:0;border-radius:999px;padding:5px 9px;font:700 11px Pretendard,Arial;cursor:pointer;background:#e7eefb;color:#10254e}
.rv-presets button.pz:hover{background:#00b3ff;color:#071a38}
.pz-blank{display:flex;gap:5px;margin-top:1px}
#pz-blank-in{flex:1;min-width:0;border:1px solid #00b3ff;border-radius:8px;padding:5px 8px;font:600 11.5px Pretendard,Arial;color:#10254e}
#pz-blank-in:focus{outline:0}

/* ---- 오버뷰 그리드 (백로그 #8) ---- */
body.mode-overview #stage { overflow: auto; align-items: flex-start; justify-content: flex-start; padding: 18px; }
body.mode-overview #deck {
  /* flex 자식이라 auto 면 shrink-to-fit → 한 열만 생긴다. 무대 폭을 다 쓰게 못박는다. */
  width: 100% !important; flex: 1 1 auto; height: auto !important; transform: none !important;
  overflow: visible !important; background: transparent !important;
  /* 칸 너비와 아래 zoom 은 짝이다(1280 × .23 = 294 ≈ 296) — 한쪽만 바꾸면 칸 안에서 슬라이드만 논다. */
  display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--ov-col, 296px), 1fr)); gap: 16px; align-content: start;
}
body.mode-overview #deck > section.slide {
  position: relative !important; inset: auto !important;
  width: 1280px; height: 720px;              /* absolute 를 풀면 높이가 0이 된다 — 명시 필요 */
  zoom: var(--ov-zoom, .23);                  /* transform 과 달리 레이아웃까지 줄여 그리드 칸에 맞는다 */
  opacity: 1 !important; visibility: visible !important;
  transform: none !important; transition: none !important;
  overflow: hidden; cursor: pointer;
  outline: 2px solid transparent; outline-offset: 3px; border-radius: 4px;
}
body.mode-overview #deck > section.slide:hover { outline-color: #3A8DFD; }
body.mode-overview #deck > section.slide.ov-cur { outline-color: #00E6BD; }
/* 고른 장. 한 번 누르면 여기까지고, 두 번 눌러야 그 장으로 간다. */
body.mode-overview #deck > section.slide.ov-sel { outline-color: #F5A623; outline-width: 3px; }
body.mode-overview .nav, body.mode-overview .hint { display: none; }

/* ---- 스포트라이트 (백로그 #9) ---- */
.spot-layer {
  position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden;
  opacity: var(--spot-a, 0); transition: opacity .12s ease;
}
/* 둥근 모서리 사각형 구멍. radial-gradient 로는 모서리 반경을 못 주므로
   '작은 상자 + 아주 큰 box-shadow'로 바깥을 덮는다. */
.spot-hole {
  position: absolute;
  width: var(--spot-w, 570px); height: var(--spot-h, 300px);
  left: var(--spot-x, 50%); top: var(--spot-y, 50%);
  transform: translate(-50%, -50%);
  border-radius: 18px;
  box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .62);
}
body.mode-spotlight { cursor: crosshair; }

/* ---- 버전 타임라인 (백로그 #10) ---- */
#ver-name { width: 100%; margin-bottom: 8px; }
.ver-i { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 6px; border-radius: 6px; }
.ver-i:hover { background: rgba(44,111,228,.07); }
.ver-i b { display: block; font-size: 13px; }
.ver-i small { color: #8895a8; font-size: 11px; }
.vbtns { display: flex; gap: 4px; flex: 0 0 auto; }
.vbtns button { border: 1px solid var(--line, #E4EAF2); background: #fff; border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 700; cursor: pointer; }
.vbtns .vpick.on { background: #2C6FE4; color: #fff; border-color: #2C6FE4; }
.ver-diff { max-height: 260px; overflow: auto; margin-top: 6px; }
.vd-i { display: grid; grid-template-columns: 42px 88px 1fr; gap: 6px; align-items: center; padding: 3px 4px; font-size: 11px; }
.vd-i .op { font-weight: 800; border-radius: 4px; text-align: center; padding: 1px 0; }
.vd-i.op-add .op { background: #DBFBF3; color: #068C74; }
.vd-i.op-remove .op { background: #FFE4EA; color: #D6355A; }
.vd-i.op-replace .op { background: #FFF2DA; color: #B9781A; }
.vd-i .sec { color: #64748B; font-weight: 700; }
.vd-i code { color: #8895a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- 마감·접근성 (백로그 #17 · #19) ---- */
/* 키보드 포커스가 보이지 않던 것을 고친다 — 마우스 클릭에는 테를 두르지 않는다(:focus-visible). */
#deck-menu .menu-item:focus-visible,
.dpanel button:focus-visible, .dpanel input:focus-visible, .dpanel textarea:focus-visible,
.ddialog button:focus-visible, .ddialog input:focus-visible, .ddialog textarea:focus-visible,
.nav button:focus-visible, #deck-menu-toggle:focus-visible, .anc-i:focus-visible, .ver-i:focus-visible {
  outline: 3px solid #3A8DFD; outline-offset: 2px; border-radius: 8px;
}
#stage:focus-visible { outline: none; }          /* 무대는 포커스 받이라 테를 두르지 않는다 */

/* 움직임을 줄이라는 설정을 존중한다. 전환은 장식이지 정보가 아니다. */
@media (prefers-reduced-motion: reduce) {
  .slide, .spot-layer, #deck-menu, .dpanel, .ddialog {
    transition: none !important;
    animation: none !important;
  }
  html { scroll-behavior: auto; }
}

/* ---- 오버뷰: 섹션 띠 · 드래그 정렬 (사용자 요청 2026-09-07) ---- */
body.mode-overview #deck > .ov-band {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
  margin: 12px 2px 2px; padding: 7px 12px;
  font: 800 11px/1.4 Pretendard, Arial; letter-spacing: .12em; text-transform: uppercase;
  color: #9fd0ff; background: rgba(58,141,253,.12); border-left: 3px solid #3A8DFD; border-radius: 6px;
}
body.mode-overview #deck > .ov-band:first-child { margin-top: 0; }
#ov-bar .ov-del { background: #4a1d2a; color: #ffb3c0; }
#ov-bar .ov-del:hover:not(:disabled) { background: #6b2537; }
/* 그리드 밖의 fixed 막대다 — #deck 안에 두면 칸을 하나 잡아먹는다(띠와 같은 이유).
 * 위에 둔다: 섹션을 만들고 지우는 자리라 눈에 먼저 들어와야 한다(사용자 요청).
 * right 를 비워 두는 것은 #deck-menu-toggle(fixed · top:14 right:16 · 104px)을 피하기 위해서다. */
#ov-bar { position: fixed; left: 16px; top: 14px; right: 136px; z-index: 1000001; display: none; gap: 6px; align-items: center;
  flex-wrap: wrap; padding: 7px 10px; border-radius: 11px; background: rgba(10,23,48,.96); box-shadow: 0 10px 30px #0006; border: 1px solid #ffffff1c; }
#ov-bar .ovs-sep { width: 1px; align-self: stretch; background: #ffffff26; margin: 0 4px; }
#ov-bar .ovs-of { font: 700 11px Pretendard,Arial; color: #7f9dc4; min-width: 96px; }
#ov-bar .ovs { padding: 5px 10px; font-size: 11px; }
/* 오버뷰 띠가 막대 밑으로 들어가지 않게 무대 위쪽을 비운다. */
body.mode-overview #stage { padding-top: 48px; }
body.mode-overview #ov-bar { display: flex; }
#ov-bar .ovz-l { font: 800 11px Pretendard,Arial; color: #9fc8ee; }
#ov-bar .ovz-n { font: 900 12px Pretendard,Arial; color: #fff; min-width: 38px; text-align: center; }
#ov-bar button { border: 0; border-radius: 7px; padding: 4px 9px; background: #16294a; color: #cfe2ff; font: 900 13px Pretendard,Arial; cursor: pointer; }
#ov-bar button:hover:not(:disabled) { background: #1e3055; }
#ov-bar button:disabled { opacity: .35; cursor: default; }
/* margin-left:auto 로 오른쪽 끝에 붙이면 #deck-menu-toggle 밑으로 들어간다(fixed · right:16px). 버튼 옆에 둔다. */
body.mode-overview #deck > .ov-band .ov-hint { margin-left: 18px; color: #5d7fae; font-weight: 600; letter-spacing: 0; text-transform: none; }
body.mode-overview #deck > .ov-band.ov-dropzone { background: rgba(245,166,35,.18); border-left-color: #F5A623; }
body.mode-overview #deck > section.slide { cursor: grab; }
body.mode-overview #deck > section.slide.ov-dragging { opacity: .45; cursor: grabbing; }
body.mode-overview #deck > section.slide.ov-dropzone { outline-color: #F5A623 !important; outline-width: 3px !important; }
#ov-sec-new { width: 100%; }

/* ---- 패널 분할 배치 (사용자 요청 2026-09-07) ----
   패널이 슬라이드를 덮지 않게, 무대를 왼쪽으로 좁히고 패널을 오른쪽에 나란히 둔다. */
body.split #stage { right: var(--panel-w, 432px); }
/* 패널을 왼쪽 슬라이드와 같은 윗선·같은 높이로 (사용자 요청) */
body.split .dpanel.open { top: var(--deck-top, 76px); height: var(--deck-h, auto); max-height: none; }
body.split .nav { right: calc(var(--panel-w, 432px) + 14px) !important; }
@media (prefers-reduced-motion: no-preference) {
  #stage { transition: right .22s ease; }
}

/* ==== 흡수 미리보기 (셸) ==== */

/* ==== print.css — PDF 인쇄 레이어 (백로그 #1 / P0-1) ====
 *
 * CEO 보고는 결국 PDF로 돈다. 화면 모델은 "19장을 겹쳐 두고 한 장만 보여 주는" 구조라
 * (`.slide{position:absolute;inset:0;opacity:0;visibility:hidden}`) 그대로 인쇄하면
 * 활성 슬라이드 1장만 나온다. 인쇄에서는 겹침을 풀어 19장을 세로로 쌓고 장마다 끊는다.
 *
 * 화면 규칙은 건드리지 않는다 — 전부 `@media print` 안에서만 뒤집는다.
 * Chromium 보증(리서치 #8). 다른 엔진은 @page size 지원이 들쭉날쭉하다.
 */

@media print {
  /* 1280×720 을 그대로 한 페이지로. 여백 0이라 슬라이드가 지면에 꽉 찬다. */
  @page {
    size: 1280px 720px;
    margin: 0;
  }

  /* 배경·그라데이션·배지 색을 인쇄에서 살린다. 이게 없으면 다크 표지가 흰 종이로 나온다.
     전환·애니메이션도 전부 끈다 — 인쇄엔 시간축이 없다. .uc-pg 의 color .18s 같은 것이 남아 있으면
     인쇄 매체로 바뀌는 순간을 찍어 중간색이 PDF 에 박힌다(실제 발견). */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    transition: none !important;
    animation: none !important;
  }

  /* margin 0 이 없으면 UA 기본 `body{margin:8px}` 이 살아남아 문서가 **16px 더 길어진다**.
   * 14장이면 10080px 이어야 할 것이 10096px 이 되어 그 16px 이 **빈 쪽 한 장**으로 넘어간다(실측).
   * 빌드한 덱은 자기 CSS 가 body 를 0 으로 두어 안 걸리지만, **흡수한 덱은 못 두른다** —
   * `@scope (#deck)` 는 html·body 를 조상으로 두므로 덱 CSS 의 body 규칙이 body 에 안 닿는다
   * (`src/shell/import.js:76` 이 같은 사실을 적어 두었다). 그래서 여기서 두른다. */
  html, body {
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 흡수가 표시해 둔 블록을 흐름으로 되돌린다 (47번 · import.js 의 markPrintFlow).
   * 슬라이드보다 키가 크고 덱이 transform 으로 줄여 맞춘 절대배치 래퍼는, 인쇄에서 내용이
   * 지면 밖으로 떨어져 통째로 안 그려진다(제목만 남는다). 표시된 것만 편다 —
   * 자식 전부에 걸면 다른 덱이 깨진다(고객 B 18장 중 7쪽 붕괴, 실측). */
  [data-print-flow] {
    position: static !important;
  }

  /* 도구 계층은 인쇄물에 남지 않는다 (ui.css 의 [data-ui]·.pen-layer 규칙에 더한다) */
  #bar, .nav, .hint {
    display: none !important;
  }

  /* 화면용 고정·중앙정렬 무대를 평범한 흐름으로 되돌린다 */
  #stage {
    position: static !important;
    inset: auto !important;
    display: block !important;
    overflow: visible !important;
    background: #fff !important;
  }

  /* JS 가 창 크기에 맞춰 #deck 에 inline transform:scale 을 건다 — 인쇄에서는 원본 배율 */
  #deck {
    position: static !important;
    width: 1280px !important;
    height: auto !important;
    transform: none !important;
    overflow: visible !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    background: #fff !important;
  }

  /* 겹쳐 있던 19장을 세로로 쌓고 장마다 페이지를 끊는다 */
  .slide {
    position: relative !important;
    inset: auto !important;
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    transition: none !important;
    animation: none !important;
    width: 1280px !important;
    height: 720px !important;
    overflow: hidden !important;
    break-after: page;
    page-break-after: always;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* 페이지 표시: 화면은 '지금 보는 장'(.on)을 모든 슬라이드에 같은 값으로 켠다.
     인쇄는 19쪽이 다 나오므로 장마다 자기 번호(.self, 20-nav.js)를 켜야 한다 — .on 을 끄고 .self 를 켠다. */
  .uc-pg.on {
    background: #E7ECF3 !important;
    color: #8895a8 !important;
    min-width: 19px !important;
  }
  .slide[data-chapter='CLOSING'] .uc-pg.on {
    background: #ffffff26 !important;
    color: #cfe0f7 !important;
  }
  .uc-pg.self {
    background: linear-gradient(135deg, #00A9D9, #185FD0) !important;
    color: #fff !important;
    min-width: 24px !important;
  }
  .slide[data-chapter='CLOSING'] .uc-pg.self {
    background: #00A9D9 !important;
    color: #fff !important;
  }

  /* 마지막 장 뒤에 빈 페이지가 붙지 않게 */
  .slide:last-of-type,
  .slide:last-child {
    break-after: auto;
    page-break-after: auto;
  }
}

}

<script id="deck-js">
/* ==== 00-util.js ==== */
/* 00-util.js — Deck namespace + DOM helpers, toast, IndexedDB blob store. Loaded first. */
window.Deck = window.Deck || {};
Deck.util = (() => {
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  const el = (tag, attrs, children) => {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'dataset') Object.assign(n.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
    }
    (children || []).forEach(c => { if (c == null) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return n;
  };
  // 파일명·경로에서 온 한글은 전부 이걸 통과시킨다. macOS 는 NFD(자모 분리)로 넘겨주는데
  // 소스에 적힌 문자열은 NFC 라, 맞추지 않으면 정규식·비교·정렬이 통째로 빗나간다
  // (실제로 내보내기 파일명의 꼬리표가 겹쳐 붙었다 — 결함 2-3). normalize 가 없어도 죽지 않는다.
  const nfc = s => { try { return String(s).normalize('NFC'); } catch (e) { return String(s); } };
  const on = (t, type, fn, opts) => { t.addEventListener(type, fn, opts); return () => t.removeEventListener(type, fn, opts); };
  const emit = (name, detail) => document.dispatchEvent(new CustomEvent(name, { detail }));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const uid = p => (p || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const nowIso = () => new Date().toISOString();
  const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fileToDataUrl = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(f); });
  const dataUrlToBlob = url => {
    const comma = url.indexOf(','); const head = url.slice(0, comma); const body = url.slice(comma + 1);
    const mime = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
    const bin = atob(body); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime });
  };
  let toastEl, toastT;
  const toast = (msg, ms) => {
    if (!toastEl) { toastEl = el('div', { id: 'deck-toast', 'data-ui': '' }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms || 1900);
  };

  /* ---- IndexedDB blob store (falls back to an in-memory Map when IDB is unavailable) ----
   * DB 이름도 제품명으로 옮겼다(2026-09-08, localStorage 와 같은 이유).
   * 옛 DB(legacy-deck)에 첨부가 남아 있을 수 있어 처음 열 때 한 번 복사해 온다.
   * 옛 DB 는 지우지 않는다 — 복사가 어긋나도 되돌릴 여지를 남긴다. */
  const DB = 'dommint', OLD_DB = 'legacy-deck', STORE = 'blobs';
  let dbp = null, mem = null;
  const rawOpen = name => new Promise((ok, no) => {
    if (!window.indexedDB) return no(new Error('no indexedDB'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE, { keyPath: 'id' }); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
    r.onblocked = () => no(new Error('indexedDB blocked'));
  });
  const readAllFrom = db => new Promise((ok) => {
    try {
      const t = db.transaction(STORE, 'readonly'); const rq = t.objectStore(STORE).getAll();
      t.oncomplete = () => ok(rq.result || []); t.onerror = () => ok([]); t.onabort = () => ok([]);
    } catch (e) { ok([]); }
  });
  /** 옛 DB 에 있던 레코드를 새 DB 로 한 번 복사한다(같은 id 가 있으면 건너뛴다). */
  async function migrateOldDb(db) {
    try {
      if (localStorage.getItem('dommint:idb-migrated')) return;
      const old = await rawOpen(OLD_DB).catch(() => null);
      if (!old) { localStorage.setItem('dommint:idb-migrated', '1'); return; }
      const rows = await readAllFrom(old);
      const have = new Set((await readAllFrom(db)).map(r => r.id));
      let n = 0;
      if (rows.length) {
        await new Promise(ok => {
          const t = db.transaction(STORE, 'readwrite'); const st = t.objectStore(STORE);
          rows.forEach(r => { if (r && r.id && !have.has(r.id)) { st.put(r); n++; } });
          t.oncomplete = ok; t.onerror = ok; t.onabort = ok;
        });
      }
      old.close();
      localStorage.setItem('dommint:idb-migrated', '1');
      if (n) console.info('IndexedDB migrated %d record(s) from %s', n, OLD_DB);
    } catch (e) { console.warn('IndexedDB migration skipped', e); }
  }
  const openDb = () => dbp || (dbp = rawOpen(DB)
    .then(async db => { await migrateOldDb(db); return db; })
    .catch(e => { console.warn('IndexedDB unavailable, using memory store', e); mem = new Map(); return null; }));
  const tx = async (mode, fn, memFn) => {
    const d = await openDb();
    if (!d) return memFn(mem);
    return new Promise((ok, no) => {
      const t = d.transaction(STORE, mode); const req = fn(t.objectStore(STORE));
      t.oncomplete = () => ok(req ? req.result : undefined);
      t.onerror = () => no(t.error); t.onabort = () => no(t.error);
    });
  };
  /* 이 글꼴로 실제로 그려지는가.
   *
   * document.fonts.check() 는 쓸 수 없다 — 실측(2026-09-08): 존재하지 않는 이름에도
   * true 를 돌려준다(폴백으로 그릴 수 있으면 '가능'이라고 답한다). 실제로 그 글꼴이
   * 쓰이는지는 **폭을 재는 수밖에 없다**: 후보 글꼴을 지정한 폭과 폴백만 지정한 폭이
   * 다르면 후보가 실제로 쓰인 것이다. 한글·라틴을 섞어 차이가 확실히 나게 한다. */
  const fontAvailable = fam => {
    if (!fam || /^(serif|sans-serif|monospace|cursive|fantasy|system-ui)$/i.test(fam.trim())) return false;
    const measure = stack => {
      const el = document.createElement('span');
      el.setAttribute('data-ui', '');
      el.style.cssText = 'position:fixed;left:-99999px;top:0;font-size:120px;white-space:nowrap;font-family:' + stack;
      el.textContent = '고객 B 가나다 ABCabc 0123';
      document.body.append(el);
      const w = el.getBoundingClientRect().width;
      el.remove();
      return w;
    };
    // 폴백을 둘 두고 양쪽 다 달라야 확실하다 — 하나만 보면 metric 우연 일치에 속는다.
    return ['monospace', 'serif'].every(fb => Math.abs(measure('"' + fam + '",' + fb) - measure(fb)) > 1);
  };

  /* 온라인 전제다(2026-09-08 결정). 웹폰트를 못 받으면 글꼴이 조용히 달라지는데,
   * 겉보기 증상이 'CSS 가 안 먹었다'와 구분되지 않아 원인을 찾기 어렵다 — 그래서 알린다. */
  const checkWebfont = async fam => {
    try { await document.fonts.ready; } catch (e) { /* 지원 안 하면 그냥 잰다 */ }
    if (fontAvailable(fam)) return true;
    toast('웹폰트(' + fam + ')를 불러오지 못했습니다 · 인터넷 연결을 확인하세요 — 글꼴이 원본과 달라 보일 수 있습니다', 6000);
    return false;
  };

  const idb = {
    put: rec => tx('readwrite', s => s.put(rec), m => { m.set(rec.id, rec); return rec.id; }),
    get: id => tx('readonly', s => s.get(id), m => m.get(id)),
    del: id => tx('readwrite', s => s.delete(id), m => m.delete(id)),
    all: () => tx('readonly', s => s.getAll(), m => [...m.values()]),
    clear: () => tx('readwrite', s => s.clear(), m => m.clear()),
  };
  /* ---- 이미지 압축 (P0-4, 백로그 #4) ----
   * 붙여넣은 스크린샷은 1280×720 덱에 비해 과하게 크다(레티나 캡처 = 2560px·수 MB).
   * 긴 변 MAX_EDGE 로 줄이고 WebP 로 재인코딩한다. 원본보다 커지면 원본을 쓴다.
   * createImageBitmap → OffscreenCanvas(없으면 <canvas>) → toBlob. 실패하면 원본 그대로 넘긴다
   * — 압축은 편의지 계약이 아니다. 첨부를 잃는 것보다 큰 파일이 낫다.
   */
  const MAX_EDGE = 1280, WEBP_Q = 0.85;
  async function compressImage(file, opts) {
    const o = Object.assign({ maxEdge: MAX_EDGE, quality: WEBP_Q, type: 'image/webp' }, opts || {});
    if (!file || !/^image\//.test(file.type || '')) return { blob: file, name: file && file.name, changed: false, reason: 'not-image' };
    if (/^image\/(gif|svg\+xml)$/.test(file.type)) return { blob: file, name: file.name, changed: false, reason: 'animated-or-vector' };
    let bmp = null;
    try {
      bmp = await createImageBitmap(file);
      const scale = Math.min(1, o.maxEdge / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = typeof OffscreenCanvas === 'function' ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h });
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bmp, 0, 0, w, h);
      const out = canvas.convertToBlob
        ? await canvas.convertToBlob({ type: o.type, quality: o.quality })
        : await new Promise(ok => canvas.toBlob(ok, o.type, o.quality));
      if (!out) throw new Error('encode returned null');
      if (out.size >= file.size && scale === 1) return { blob: file, name: file.name, changed: false, reason: 'no-gain', w: bmp.width, h: bmp.height };

/* 10-state.js — DeckState v2: the ONLY persistence layer.

 * IndexedDB     dommint / blobs                    attachments and transition images
 * <script id="deck-state" type="application/json"> the same JSON embedded in the file (source of truth on disk)
 *
 * 네임스페이스(2026-09-08): `legacy-deck:` → `dommint:`.
 * 고객사명이 제품 저장소 키에 남아 있으면 다음 고객 덱에도 따라붙는다. 더 중요한 것은 **충돌**이다 —
 * `file://` 에서는 모든 HTML 이 같은 localStorage 를 공유하므로, 같은 도구로 만든 다른 덱을 열면
 * 상태가 섞인다. 실제로 v45 검토본에 다른 보고서의 메모 17장이 들어와 있었다.
 * 그래서 ①이름을 제품명으로 옮기고 ②deckId 를 하드코딩하지 않고 **파일에 심긴 값**에서 읽으며
 * ③옛 키에서 옮겨올 때 **이 덱의 슬라이드가 아닌 항목을 버린다**.
 */
Deck.state = (() => {
  const U = Deck.util;
  const FALLBACK_ID = 'deck';
  const OLD_NS = 'legacy-deck:';
  const NS = 'dommint:';
  let DECK_ID = FALLBACK_ID, KEY = NS + FALLBACK_ID;
  const blank = () => ({ schema: 2, deckId: DECK_ID, name: '', build: '', updatedAt: '', lineage: [], order: [], deleted: [], created: {}, merges: [], edits: {}, notes: {}, pen: {}, media: {}, anchors: {}, speaker: {}, speakerMarks: {}, chapters: {}, fragments: {}, materials: {}, memoStyle: {}, styles: {}, log: [], undo: [] });
  const S = { DECK_ID, KEY, data: blank(), embedded: null, archived: null, migrated: null };

  const readEmbedded = () => { try { return JSON.parse(document.getElementById('deck-state').textContent || 'null'); } catch (e) { return null; } };
  const readLocal = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const normalize = d => {
    const b = blank();
    for (const k of Object.keys(b)) if (d[k] === undefined || d[k] === null) d[k] = b[k];
    return d;
  };

  /* 이 덱에 실제로 있는 슬라이드 id 집합. 마크업 + 삭제 목록 + 신규 생성분까지 친다
   * (삭제한 슬라이드의 메모는 남아 있어야 되살릴 수 있다). */

      for (const k of Object.keys(v)) if (!ids.has(k)) { delete v[k]; dropped++; }

  S.load = async () => {
