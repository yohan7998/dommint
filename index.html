            '<span class="lbl">🎤 발표 메모 · 대본</span>' +
            '<span class="tb">' +
              '<button type="button" id="mMinus" title="글자 축소 (' + U.hotkey('⌘') + '−)">A−</button>' +
              '<span class="size" id="mSize" title="클릭하면 기본 크기로">18px</span>' +
              '<button type="button" id="mPlus" title="글자 확대 (' + U.hotkey('⌘') + '+)">A+</button>' +
            '</span>' +
            '<span class="tb"><button type="button" id="mBold" title="볼드 (' + U.hotkey('⌘') + 'B)" style="font-style:normal">B</button></span>' +
            '<span class="tb" id="mColors">' + swatches + '</span>' +
            '<span class="tb"><button type="button" id="mErase" title="선택한 구간의 색 지우기">색 지우기</button></span>' +
            '<span class="tb">' +
              '<button type="button" id="xlOut" title="모든 슬라이드의 메모·대본을 엑셀 파일로 내보냅니다">⬇ 내보내기</button>' +
              '<button type="button" id="xlIn" title="엑셀 파일에서 모든 슬라이드의 메모·대본을 한꺼번에 가져옵니다">⬆ 가져오기</button>' +
            '</span>' +
          '</div>' +
          '<div class="wrap">' +
            '<div id="spk" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false" ' +
              'data-ph="이 슬라이드에서 할 말 · 강조할 숫자 · 예상 질문"></div>' +
          '</div>' +
          '<div class="stale" id="spkStale"></div>' +
          '<div class="saved" id="spkSaved"></div>' +
        '</div>' +
      '</div>';
    // 발표 메모는 발표자 뷰에서 바로 쓴다. 검토 요청(notes)과 다른 필드라 에이전트 입력에 섞이지 않는다.
    const spk = d.getElementById('spk');
    spkEl = spk;
    /* 조합 중에는 다시 그리지 않는다. 한글 IME 가 조합 중인 글자를 DOM 에 물고 있어서
     * 그 사이에 innerHTML 을 갈아 끼우면 조합이 끊기고 캐럿이 튄다 — 11번이 textarea 를
     * 고른 이유가 바로 이 위험이었다. 조합이 끝나면 그때 한 번 그린다. */
    spk.addEventListener('compositionstart', () => { composing = true; });
    spk.addEventListener('compositionend', () => { composing = false; onEdit(); });
    // 붙여넣기는 평문으로만 받는다 — 서식이 끌려오면 대본이 평문이라는 계약이 깨진다
    spk.addEventListener('paste', e => {
      e.preventDefault();
      const t = (e.clipboardData || w.clipboardData).getData('text/plain');
      d.execCommand('insertText', false, t);
    });
    function save() {
      clearTimeout(saveT);
      saveT = setTimeout(writeSpeaker, 450);
    }
    /* 조합 중에는 **옮기지도 그리지도** 않는다 — 오프셋이 흔들리는 중이다.
     * 조합이 끝나면 그때 한 번에 옮긴다(`prevText` 가 조합 전이라 차이가 통째로 잡힌다). */
    function onEdit() {
      const cur = Deck.nav.current();
      if (!composing) shiftMarks(cur && cur.dataset.slideId, readText(spk));
      renderMarks();
      save();
    }
    spk.addEventListener('input', onEdit);
    spk.addEventListener('keydown', e => {                        // 메모 입력 중 화살표가 슬라이드를 넘기지 않게
      if ((e.metaKey || e.ctrlKey) && e.key === 'Escape') return;  // 단 ⌘Esc(닫기)는 통과시킨다
      if (e.metaKey || e.ctrlKey) return;                          // 서식 단축키도 문서 핸들러가 받아야 한다
      e.stopPropagation();
    });
    d.getElementById('toggle').onclick = toggleTimer;
    d.getElementById('reset').onclick = resetTimer;
    d.getElementById('prev').onclick = () => Deck.nav.prev();
    d.getElementById('next').onclick = () => Deck.nav.next();
    // 현재 미리보기 구역을 누르면 다음 장으로. 미리보기는 슬라이드를 복제한 것이라 안에
    // 링크·버튼이 있을 수 있어 기본 동작을 막고 넘긴다. 글자를 끌어 선택하는 중이면 넘기지 않는다.
    /* 사용자 요청(2026-09-10): 오른쪽을 누르면 다음, 왼쪽을 누르면 이전.
     * 종전에는 **누르면 무조건 다음**이었다. 판정은 본 창과 한 벌이다(20-nav.clickZone). */
    d.getElementById('curBox').addEventListener('click', e => {
      const sel = d.getSelection && d.getSelection();
      if (sel && !sel.isCollapsed) return;                        // 글자를 끌어 선택 중이면 넘기지 않는다
      e.preventDefault();
      const r = e.currentTarget.getBoundingClientRect();
      const z = Deck.nav.clickZone(e.clientX - r.left, r.width);
      if (z === 'next') Deck.nav.next(); else if (z === 'prev') Deck.nav.prev();
    });
    wireSplit(d);
    d.getElementById('mMinus').onclick = () => bumpSize(-SIZE_STEP);
    d.getElementById('mPlus').onclick = () => bumpSize(+SIZE_STEP);
    d.getElementById('mSize').onclick = () => { pref.size = SIZE_DEF; savePref(); applyMemoStyle(); };
    d.getElementById('mBold').onclick = toggleBold;
    d.getElementById('mColors').addEventListener('click', e => {
      const b = e.target.closest('.sw'); if (!b) return;
      // 사용자 요청(2026-09-10): 전체가 아니라 **지정한 부분만**. 선택이 없을 때만 종전대로
      // 패널 전체를 바꾼다 — 기존 기능(시력 보정)을 뺏지 않는다.
      if (paint(b.dataset.color)) return;
      pref.color = b.dataset.color; savePref(); applyMemoStyle();
    });
    d.getElementById('mErase').onclick = () => { if (!unpaint()) U.toast('색을 지울 구간을 선택하세요'); };
    d.getElementById('xlOut').onclick = () => Deck.sheetio && Deck.sheetio.exportXlsx();
    d.getElementById('xlIn').onclick = () => Deck.sheetio && Deck.sheetio.importXlsx(d);
    d.addEventListener('keydown', e => {                       // 별창에서도 덱을 넘긴다 (메모 입력 중에는 아니다)
      // ⌘/Ctrl + Esc 로 발표자 뷰를 닫는다. 메모를 쓰는 중에도 먹어야 하므로 TEXTAREA 검사보다 먼저.
      if ((e.metaKey || e.ctrlKey) && e.key === 'Escape') { e.preventDefault(); close(); return; }
      // 서식 단축키도 메모를 쓰는 중에 쓰는 것이라 TEXTAREA 검사보다 먼저 둔다.
      if (e.metaKey || e.ctrlKey) {
        if (e.key === '=' || e.key === '+') { e.preventDefault(); return bumpSize(+SIZE_STEP); }
        if (e.key === '-' || e.key === '_') { e.preventDefault(); return bumpSize(-SIZE_STEP); }
        if (e.key.toLowerCase() === 'b') { e.preventDefault(); return toggleBold(); }
        if (e.key === '0') { e.preventDefault(); pref.size = SIZE_DEF; savePref(); return applyMemoStyle(); }
      }
      if (e.target && e.target.tagName === 'TEXTAREA') return;
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); Deck.nav.next(); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); Deck.nav.prev(); }
    });
    w.addEventListener('resize', U.debounce(() => { applySplit(); render(true); }, 150));   // 창을 늘리면 미리보기도 다시 맞춘다
    w.addEventListener('pagehide', close);
  }

  /* 사용자 요청(2026-09-11): *«폰트 글씨 변경이 전체 글자가 변경돼. 내가 지정한 곳만»*.
   * 색과 **같은 규칙**으로 맞춘다 — 고른 구간이 있으면 그 구간만, 없으면 종전대로 패널 전체
   * (그쪽은 시력 보정용이라 뺏지 않는다). */
  function bumpSize(delta) {
    if (bumpMarkSize(delta > 0 ? 1 : -1)) return;
    pref.size = Math.min(SIZE_MAX, Math.max(SIZE_MIN, pref.size + delta));
    savePref(); applyMemoStyle();
  }
  function toggleBold() { pref.bold = !pref.bold; savePref(); applyMemoStyle(); }

  /* ---------- 구간 색칠 (후보 11번) ----------
   * speaker 는 평문 그대로 두고 색은 speakerMarks 에 문자 오프셋으로 산다.
   * 오프셋은 textarea 의 selectionStart/End 가 공짜로 준다 — Range 계산도 한글 IME
   * 조합 중 좌표 흔들림도 없다. **입력 경로를 안 건드리는 것이 이 설계의 값이다.**
   *
   * `text`(칠할 때의 그 문자열)는 **지문**이다. 그릴 때 대조해 어긋나면 적용하지 않는다.
   * 길이만 보는 clamp 로는 «밀림»을 못 잡는다 — 본문 앞에 낱말을 끼우면 길이가 오히려
   * 늘어 통과하고 색이 엉뚱한 글자에 붙는다(별도 실측: '고객 B' → '신규 핀').
   * 어긋난 구간을 **지우지는 않는다**: 글자를 되돌리면 다시 맞는다. */
  let stale = 0, composing = false;

  /* ---------- 대본 저장 ----------
   * 🔴 칸의 글자는 **칸이 들고 있는 장(`spk.dataset.slide`)** 에 쓴다. 종전에는 친 순간의
   * `Deck.nav.current()` 를 잡고 450ms 뒤에 칸을 읽었다 — 그 사이 장을 넘기면 `render()` 가
   * 칸을 다음 장 대본으로 갈아 끼워, **앞 장 대본이 다음 장 대본으로 덮였다**(감사 2026-09-15 재현).
   * 그래서 칸을 갈아 끼우기 전에 미뤄 둔 저장을 먼저 비운다 — `70-review.js` 의 «장이 바뀌면
   * 먼저 저장» 과 같은 규칙이다. 별창을 닫아도 타이머는 본창에 살고 요소를 붙잡아 두므로
   * 따로 비우지 않는다(되돌려 재기 2026-09-15: 닫을 때 비우기를 빼도 닫기 시험이 통과). */
  let saveT = null, spkEl = null;
  function writeSpeaker() {
    clearTimeout(saveT); saveT = null;
    const id = spkEl && spkEl.dataset.slide;
    if (!id) return;
    S.setSpeaker(id, readText(spkEl));
    S.commit();
    const el = isOpen() && w.document.getElementById('spkSaved');
    if (el) el.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
    if (Deck.review) Deck.review.render();
  }
  const staleCount = () => stale;

  /* ---------- 평문 ↔ DOM ----------
   * 쓸 때 줄바꿈은 **`<br>` 로만** 넣는다(문서에 literal \n 을 두지 않는다).
   * 읽을 때는 DOM 을 직접 걸어 `<br>` 과 블록 경계를 \n 으로 센다.
   *
   * 🔴 `innerText` 를 쓰지 않는다 — **빈 줄을 겹쳐 센다.** 실측 2026-09-11:
   * 사람이 Enter 를 두 번 치면 `<div><br></div>` 가 되는데 `white-space:pre-wrap` 과
   * 맞물려 `innerText` 가 `\n\n\n` 을 냈다(기대는 `\n\n`). `textContent` 는 반대로
   * 줄바꿈을 **통째로 잃는다**(`<div>` 에 글자가 없다). 걷는 판독기만 8건 전수 왕복했다. */
  const BLOCKISH = /^(DIV|P|LI|TR|SECTION|ARTICLE|H[1-6]|BLOCKQUOTE|PRE)$/;
  function readText(el) {
    let out = '';
    (function walk(node) {
      for (const n of node.childNodes) {
        if (n.nodeType === 3) out += n.nodeValue;
        else if (n.nodeName === 'BR') out += '\n';
        else if (n.nodeType === 1) {
          if (BLOCKISH.test(n.nodeName) && out && !out.endsWith('\n')) out += '\n';
          walk(n);
        }
      }
    })(el);
    return out;
  }
  /* 🔴 줄바꿈을 `<br>` 로 넣지 **않는다.** `white-space:pre-wrap` 이 literal \n 을 그대로 줄로
   * 그려 주는데, `<br>` 로 넣으면 **텍스트 노드 걷기에서 0 글자**라 다시 그린 뒤 캐럿을 문자
   * 오프셋으로 되돌릴 때 그만큼 밀린다(실측 2026-09-11: 타이핑한 줄바꿈이 전부 글 끝으로 몰렸다 —
   * `'첫 줄둘째  줄빈 줄 뒤\n\n\n\n'`). literal \n 이면 오프셋 축이 한 벌이다.
   * 사람이 Enter 를 쳐서 생긴 `<div>`·`<br>` 은 `readText` 가 세고, 다음 그리기에서 이 모양으로 돌아온다. */
  const asHtml = t => U.escapeHtml(t);

  /* ---------- 선택 구간 ↔ 문자 오프셋 ----------
   * `52-textstyle.js:176 rangeIn()` 과 같은 관용구다. 그쪽 것을 부르지 않는 이유는 하나뿐 —
   * 그 함수가 **본 창의** `window.getSelection()` 을 읽어서 별창 선택을 못 본다. 계산은 같다. */
  function rangeIn(el) {
    const sel = w.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount || !el) return null;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.commonAncestorContainer)) return null;
    const pre = w.document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    const from = readText(fragmentOf(pre)).length;
    const to = from + readText(fragmentOf(r)).length;
    return to > from ? { from, to } : null;
  }
  // 구간의 글자 수도 **같은 판독기로** 센다 — `toString()` 은 <br> 을 0 자로 세어 오프셋이 밀린다
  const fragmentOf = r => r.cloneContents();

  /* 다시 그리면 캐럿을 잃는다 — 문자 오프셋으로 되돌려 놓는다. */
  function caretTo(el, from, to) {
    const sel = w.getSelection();
    if (!sel) return;
    const pick = target => {
      let seen = 0, node = null, off = 0;
      const walk = w.document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      while (walk.nextNode()) {
        const n = walk.currentNode, len = n.nodeValue.length;
        if (seen + len >= target) { node = n; off = target - seen; break; }
        seen += len; node = n; off = len;
      }
      return node ? { node, off } : null;
    };
    const a = pick(from), b = pick(to == null ? from : to);
    if (!a || !b) return;
    const r = w.document.createRange();
    r.setStart(a.node, a.off); r.setEnd(b.node, b.off);
    sel.removeAllRanges(); sel.addRange(r);
  }

  /* 마크를 그린다. 겹침은 `Deck.textstyle.segments()` 에 맡긴다 — **속성별로** 나중 것이 이겨야
   * «크게 한 뒤 색을 주니 크기가 사라진다»(10번 함정 ①)가 안 난다. 종전 이 자리는 마크 통째로
   * «앞선 것이 이긴다» 였다 — 겹침 규칙이 정반대라 옮기면서 바뀐다. */
  function marksHtml(text, marks) {
    const T = Deck.textstyle;
    const ok = [], bad = [];
    for (const m of marks) ((!m.text || text.slice(m.from, m.to) === m.text) ? ok : bad).push(m);
    let out = '';
    for (const seg of T.segments(text.length, ok)) {
      const body = asHtml(text.slice(seg.from, seg.to));
      const r = seg.r;
      if (!r || (!r.color && r.size == null)) { out += body; continue; }
      let css = '';
      if (r.color) css += 'color:' + r.color + ';';
      if (r.size != null) css += 'font-size:' + r.size + 'em;';
      out += '<span data-mark style="' + css + '">' + body + '</span>';
    }
    return { html: out, stale: bad.length };
  }

  /* ---------- 타이핑하면 마크도 함께 옮긴다 ----------
   * 🔴 **오프셋 이동과 지문 대조는 서로를 대신하지 못한다.** 지문(`text`)은 *밖에서* 값이 바뀐 것을
   * 잡는 그물이고(엑셀 가져오기·본 창 편집), 이 자리는 *이 칸에서 사람이 치는* 것이다. 안 옮기면
   * 지문이 어긋나 «적용 안 함» 으로 떨어진다 — 그게 결함으로 보인 증상이다.
   *
   * 실측 2026-09-11(마크 둘: 0~5 · 20~28 · 두 글자 삽입):
   *   맨 뒤(40)   → 둘 다 삶   · 구간 사이(10) → 앞만 삶
   *   구간 안(2)  → **둘 다 죽음** · **구간 앞(0) → 둘 다 죽음**
   * 즉 «구간 안이라서» 가 아니라 ***삽입 지점 뒤의 마크가 전부*** 죽는다.
   * **11번(textarea+미러) 에서도 같았다** — 같은 조건에서 stale 2. 27번이 만든 것이 아니라
   * 처음부터 없던 축이고, 27번으로 눈에 띄게 된 것이다(크기는 색보다 잃은 것이 확연하다). */
  let prevText = '';
  /* 두 문자열의 차이를 **한 번의 splice** 로 본다 — 앞뒤 공통 부분을 깎으면 남는 가운데가 그것이다.
   * 타건 하나든 선택 구간을 갈아끼운 것이든 같은 모양으로 떨어진다. */
  function spliceOf(a, b) {
    if (a === b) return null;
    let head = 0;
    const max = Math.min(a.length, b.length);
    while (head < max && a[head] === b[head]) head++;
    let tail = 0;
    while (tail < max - head && a[a.length - 1 - tail] === b[b.length - 1 - tail]) tail++;
    return { at: head, removed: a.length - head - tail, added: b.length - head - tail };
  }
  function shiftMarks(id, next) {
    const sp = spliceOf(prevText, next);
    if (!sp || !id) return;
    const list = S.marks(id);
    if (!list.length) return;
    const at = sp.at, end = at + sp.removed, out = [];
    for (const m of list) {
      // ① 지운 만큼 당긴다(지워진 자리에 걸친 끝은 삽입 지점으로 모인다)
      let f = m.from <= at ? m.from : Math.max(at, m.from - sp.removed);
      let t2 = m.to <= at ? m.to : Math.max(at, m.to - sp.removed);
      // ② 끼운 만큼 민다. 경계(`at === from` · `at === to`)에서는 **늘리지 않는다** —
      //    구간 바로 앞이나 바로 뒤에 친 글자는 그 구간의 것이 아니다.
      if (at <= f) f += sp.added;
      if (at < t2) t2 += sp.added;
      out.push(Object.assign({}, m, { from: f, to: t2, text: next.slice(f, t2) }));
      // 통째로 지워져 빈 구간이 된 것은 `S.putMarks` 의 `to > from` 이 한 자리에서 버린다
    }
    S.putMarks(id, out);        // 저장은 대본 저장 디바운스가 같이 한다 — 타건마다 커밋하지 않는다
  }

  function renderMarks() {
    if (!isOpen() || composing) return;
    const d = w.document, t = d.getElementById('spk');
    if (!t) return;
    const cur = Deck.nav.current();
    const id = cur && cur.dataset.slideId;
    const text = readText(t);
    prevText = text;
    const r = marksHtml(text, id ? S.marks(id) : []);
    const keep = rangeIn(t) || (d.activeElement === t ? { from: caretOffset(t), to: null } : null);
    if (t.innerHTML !== r.html) {
      t.innerHTML = r.html;
      if (keep) caretTo(t, keep.from, keep.to);
    }
    stale = r.stale;
    const note = d.getElementById('spkStale');
    // 조용히 버리지 않는다 — 몇 건인지 말한다.
    if (note) note.textContent = stale ? ('서식 ' + stale + '건은 본문이 바뀌어 적용하지 않았습니다 — 글자를 되돌리면 다시 붙습니다.') : '';
  }

  function caretOffset(el) {
    const sel = w.getSelection();
    if (!sel || !sel.rangeCount) return 0;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.startContainer)) return 0;
    const pre = w.document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    return readText(fragmentOf(pre)).length;
  }

  /* 선택 구간에 **속성 하나만** 얹는다. 겹침 정리는 그리는 쪽(`segments`)이 속성별로 하므로
   * 여기서는 «같은 범위를 다시 손대면 그 마크를 갱신한다» 만 본다 — `52-textstyle.js:196` 과 같은 규칙.
   * 매번 덧붙이면 한 곳을 세 번 만졌을 때 마크가 셋이 되어 상태가 부푼다.
   *
   * 🔴 **통째로 물러나게 하지 않는다.** 종전에는 겹치는 옛 마크를 통으로 버렸는데, 그러면
   * «크게 한 뒤 색을 주니 크기가 사라진다» 가 난다(10번이 `runs` 에서 밟은 함정 ①).
   * 선택이 없으면 아무 일도 안 한다 — 그때는 부르는 쪽이 패널 전체에 적용한다. */
  function mark(patch) {
    if (!isOpen()) return false;
    const t = w.document.getElementById('spk'), cur = Deck.nav.current();
    if (!t || !cur) return false;
    const r = rangeIn(t);
    if (!r) return false;
    const id = cur.dataset.slideId, text = readText(t);
    const list = [...S.marks(id)];
    const i = list.findIndex(m => m.from === r.from && m.to === r.to);
    const base = i >= 0 ? list[i] : { from: r.from, to: r.to };
    const next = Object.assign({}, base, patch, { text: text.slice(r.from, r.to) });
    if (i >= 0) list[i] = next; else list.push(next);
    S.setMarks(id, list.sort((x, y) => x.from - y.from));
    renderMarks();
    caretTo(t, r.from, r.to);                       // 다시 그린 뒤에도 고른 구간을 쥐고 있게 한다
    return true;
  }

  const paint = color => mark({ color });
  /* 구간 크기는 **배수**다(0.6~2.0 · `52-textstyle.js:18` 과 같은 상수). 절대 px 로 박으면
   * 패널 전체 크기(시력 보정)를 키웠을 때 **표시한 구간만 상대적으로 작아진다.** */
  function bumpMarkSize(dir) {
    const t = w.document.getElementById('spk'), cur = Deck.nav.current();
    if (!isOpen() || !t || !cur) return false;
    const r = rangeIn(t);
    if (!r) return false;
    const now = (S.marks(cur.dataset.slideId).find(m => m.from === r.from && m.to === r.to) || {}).size;
    const next = Math.round((Math.min(MULT_MAX, Math.max(MULT_MIN, (now == null ? 1 : now) + dir * MULT_STEP))) * 100) / 100;
    return mark({ size: next });
  }

  /* «색 지우기» 는 **색만** 지운다 — 같은 구간에 준 크기는 남는다(둘 다 산다는 계약). */
  function unpaint() {
    if (!isOpen()) return false;
    const t = w.document.getElementById('spk'), cur = Deck.nav.current();
    if (!t || !cur) return false;
    const r = rangeIn(t);
    if (!r) return false;
    const id = cur.dataset.slideId;
    const out = [];
    for (const m of S.marks(id)) {
      if (m.to <= r.from || m.from >= r.to) { out.push(m); continue; }
      if (m.size != null) { const c = Object.assign({}, m); delete c.color; out.push(c); }
    }
    S.setMarks(id, out);
    renderMarks();
    return true;
  }

  /* 좌우 분할. 덱 상태에 산다 — 메모 서식을 «노트북↔발표장 PC» 때문에 옮긴 것과 같은 성질.
   * 최소 폭은 **px 로** 지킨다: 창이 좁아도 두 칸이 다 쓸 수 있어야 한다. */
  const MIN_LEFT = 340, MIN_RIGHT = 280;
  /* 비율은 **두 칸이 실제로 나눠 갖는 폭** 기준이다. `.pv` 의 전체 폭으로 재면 padding·gap·
   * 손잡이 몫만큼 어긋난다(실측: 메모 칸이 280 이어야 하는데 253 이 나왔다).
   * 그래서 두 열의 현재 폭을 더해 쓴다 — 브라우저가 이미 계산해 둔 값이라 틀릴 수 없다. */
  const usableOf = d => {
    const l = d.querySelector('.left'), r = d.querySelector('.spk');
    return (l && r) ? l.getBoundingClientRect().width + r.getBoundingClientRect().width : 0;
  };
  function applySplit() {
    if (!isOpen()) return;
    const d = w.document, root = d.querySelector('.pv');
    const usable = usableOf(d);
    if (!root || !usable) return;
    const px = Math.min(usable - MIN_RIGHT, Math.max(MIN_LEFT, pref.split * usable));
    root.style.setProperty('--pv-left', Math.round(px) + 'px');
    fitThumbs();                                  // 열이 바뀌면 미리보기도 그 폭에 다시 맞는다
  }
  function wireSplit(d) {
    const bar = d.getElementById('pvSplit'), root = d.querySelector('.pv');
    if (!bar || !root) return;
    let on = false, moved = false, lastUp = 0, grab = 0;
    /* `grab` 은 «잡은 지점과 왼쪽 열 오른쪽 끝의 거리»다. 이걸 안 빼면 포인터 자리를 곧바로
     * 열의 끝으로 삼는데, 손잡이 중앙은 이미 끝에서 gap(12) + 손잡이 절반(5) 만큼 오른쪽이라
     * **잡기만 해도 열이 그만큼 넓어진다.** 실측 2026-09-11: 제자리에서 잡았다 놓기를 다섯 번
     * 반복하니 520 → 538 → 556 → 574 → 592 → 610 (매번 +18px). 끌어당길 때도 같은 값이 상쇄돼
     * «늘어나기만 하고 줄어들지 않는다» 로 보인다. */
    const put = clientX => {
      const left = d.querySelector('.left');
      const usable = usableOf(d);
      if (!left || usable <= MIN_LEFT + MIN_RIGHT) return;        // 창이 너무 좁다 — 손대지 않는다
      const px = Math.min(usable - MIN_RIGHT, Math.max(MIN_LEFT, clientX - grab - left.getBoundingClientRect().left));
      pref.split = Math.min(SPLIT_MAX, Math.max(SPLIT_MIN, px / usable));
      moved = true;
      applySplit();
    };
    bar.addEventListener('pointerdown', e => {
      const left = d.querySelector('.left');
      grab = left ? e.clientX - left.getBoundingClientRect().right : 0;
      on = true; moved = false; bar.classList.add('on'); bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove', e => { if (on) put(e.clientX); });
    /* 더블클릭 = 기본값(글자 크기 표시를 눌러 되돌리는 기존 관용구와 같다).
     * **`dblclick` 이벤트를 쓰지 않는다** — 실측: `setPointerCapture` 를 건 손잡이에서는
     * 합성 click/dblclick 이 아예 오지 않았다(수신 0회). 그래서 pointerup 두 번을 직접 센다.
     * 끌었으면(moved) 세지 않는다 — 끌어서 맞춘 값이 두 번째 손짓에 날아가면 안 된다. */
    const end = () => {
      if (!on) return;
      on = false; bar.classList.remove('on');
      const now = Date.now();
      if (!moved && now - lastUp < 400) { pref.split = SPLIT_DEF; applySplit(); }
      lastUp = now;
      savePref();
    };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
  }

  function applyMemoStyle() {
    if (!isOpen()) return;
    const d = w.document, t = d.getElementById('spk');
    if (!t) return;
    t.style.fontSize = pref.size + 'px';
    t.style.fontWeight = pref.bold ? '700' : '400';
    t.style.color = pref.color;                     // 구간 색은 span 이 덮는다 — 이건 나머지 글자의 색이다
    const lab = d.getElementById('mSize'); if (lab) lab.textContent = pref.size + 'px';
    const b = d.getElementById('mBold'); if (b) b.classList.toggle('on', pref.bold);
    [...d.querySelectorAll('.sw')].forEach(x => x.classList.toggle('on', x.dataset.color === pref.color));
  }

  /* 슬라이드를 복제해 박스 폭에 맞춰 축소한다. 오버뷰와 같은 이유로 zoom 을 쓴다
   * (transform 은 레이아웃 크기를 안 바꿔 박스가 1280×720 을 차지한다). */
  function paintThumb(host, slide) {
    host.innerHTML = '';
    if (!slide) { host.style.width = ''; host.style.height = '0px'; return; }
    let node;
    try { node = w.document.importNode(slide, true); }
    catch (e) { host.textContent = '(미리보기를 만들 수 없습니다)'; return; }
    node.querySelectorAll('[data-ui]').forEach(x => x.remove());
    node.classList.remove('active', 'prev', 'ov-cur');
    node.removeAttribute('style');
    host.append(node);
  }

  /* 이미 붙어 있는 미리보기를 **지금의 열 폭**에 다시 맞춘다 — 복제는 하지 않는다.
   * 분할을 끄는 동안 프레임마다 불리는 자리라 싸야 한다.
   *
   * 🔴 `host.style.width` 를 **먼저 지운다.** 이 함수가 방금 박은 인라인 폭을 그대로 다시 읽으면
   * `clientWidth` 가 첫 값에 얼어붙어 **열을 넓혀도 좁혀도 미리보기가 안 변한다**
   * (실측 2026-09-11: 분할을 520↔1180 으로 끌어도 zoom 이 0.4008 로 고정 · 창을 줄여도 그대로).
   * 지우면 `.box` 폭까지 stretch 되므로 그때 재야 «지금 쓸 수 있는 폭»이 나온다. */
  function fitThumb(host, maxH) {
    const node = host.firstElementChild;
    if (!node) return;
    host.style.width = '';
    // 폭만 보고 맞추면 창이 세로로 길 때 왼쪽 열 아래가 통째로 비고, 세로로 짧을 때는 넘친다.
    const byW = (host.clientWidth || 420) / 1280;
    const z = Math.max(0.05, maxH > 0 ? Math.min(byW, maxH / 720) : byW);
    node.style.zoom = z;
    host.style.width = Math.round(1280 * z) + 'px';
    host.style.height = Math.round(720 * z) + 'px';
  }

  /* 왼쪽 열의 남는 세로를 현재:다음 = 62:38 로 나눠 준다. CHROME 은 박스 제목·슬라이드 제목·패딩 몫. */
  function fitThumbs() {
    if (!isOpen()) return;
    const d = w.document, leftEl = d.querySelector('.left'), CHROME = 62;
    const avail = Math.max(160, (leftEl ? leftEl.clientHeight : 600) - 10);
    fitThumb(d.getElementById('cur'), avail * 0.62 - CHROME);
    fitThumb(d.getElementById('nxt'), avail * 0.38 - CHROME);
  }

  function render(force) {
    if (!isOpen()) return;
    const d = w.document, list = Deck.nav.slides(), i = Deck.nav.index();
    const cur = list[i], nxt = list[i + 1] || null;
    d.getElementById('pos').textContent = (i + 1) + ' / ' + list.length;
    paintThumb(d.getElementById('cur'), cur);
    paintThumb(d.getElementById('nxt'), nxt);
    fitThumbs();
    const label = s => (s ? (Deck.structure && Deck.structure.title ? Deck.structure.title(s) : (s.dataset.slideId || '')) : '(마지막 슬라이드)');
    d.getElementById('curT').textContent = label(cur);
    d.getElementById('nxtT').textContent = label(nxt);
    const spk = d.getElementById('spk');
    const sid = cur && cur.dataset.slideId;
    // 슬라이드가 바뀔 때만 갈아 끼운다(타이핑 중 덮어쓰지 않게).
    // force 는 엑셀 가져오기처럼 밖에서 값이 바뀐 경우다 — 이때는 같은 슬라이드여도 다시 읽어야 한다.
    if (spk && sid) {
      if (saveT && spk.dataset.slide !== sid) writeSpeaker();   // 갈아 끼우기 전에 앞 장 것을 먼저 쓴다
      const sp = S.speaker(sid);
      if (force || spk.dataset.slide !== sid) {
        spk.dataset.slide = sid;
        spk.innerHTML = asHtml(sp);
        const sv = d.getElementById('spkSaved'); if (sv) sv.textContent = '';
      // 본 창에서 고친 메모도 여기 바로 비친다. 단 이 창에서 타이핑 중이면 손대지 않는다.
      } else if (d.activeElement !== spk && readText(spk) !== sp) spk.innerHTML = asHtml(sp);
    }
    applyMemoStyle();
    applySplit();
    renderMarks();
  }
  const refresh = () => render(true);
  /* 가져오기 결과를 별창에서 바로 보여 준다 — 본 창 토스트는 이 창을 보고 있으면 안 보인다. */
  let noticeT = null;
  function notice(msg) {
    if (!isOpen()) return;
    const el = w.document.getElementById('spkSaved');
    if (!el) return;
    el.textContent = '✅ ' + msg;
    el.style.color = '#7BE3A3';
    clearTimeout(noticeT);
    noticeT = setTimeout(() => { if (isOpen()) { el.textContent = ''; el.style.color = ''; } }, 6000);
  }

  function paintClock() {
    if (!isOpen()) return;
    const c = w.document.getElementById('clock');
    c.textContent = mmss(elapsed());
    c.classList.toggle('paused', !running);
    w.document.getElementById('toggle').textContent = running ? '일시정지' : '시작';
  }
  function startTimer() { if (!running) { t0 = Date.now(); running = true; } }
  function toggleTimer() { if (running) { acc += Date.now() - t0; running = false; } else startTimer(); paintClock(); }
  function resetTimer() { acc = 0; t0 = Date.now(); paintClock(); }

  function open() {
    UI.menu.close();
    if (isOpen()) { w.focus(); return w; }
    w = window.open('', 'dommint-presenter', 'width=1240,height=840');
    if (!w) { U.toast('별창이 차단되었습니다 · 팝업 허용 후 다시 시도하세요', 3200); w = null; return null; }
    loadPref();
    shell();
    acc = 0; startTimer();
    render(true); paintClock();
    tick = setInterval(() => { if (isOpen()) paintClock(); else close(); }, 500);
    U.toast('발표자 뷰를 열었습니다 · 노트북에만 두세요');
    return w;
  }
  function close() {
    if (tick) { clearInterval(tick); tick = null; }
    if (w && !w.closed) { try { w.close(); } catch (e) { /* 무시 */ } }
    w = null; running = false;
  }
  const toggle = () => (isOpen() ? close() : open());

  function init() {
    loadPref();
    UI.registerMenu('present', { id: 'menu-presenter', label: '발표자 뷰 + 타이머', hint: 'P', onClick: toggle });
    document.addEventListener('deck:change', () => render());
    document.addEventListener('deck:state', () => render());
    window.addEventListener('pagehide', close);               // 본창이 닫히면 별창도 정리
  }
  return { init, open, close, toggle, isOpen, render, refresh, notice, paint, unpaint, bumpSize, staleCount, elapsed, toggleTimer, resetTimer, isRunning: () => running };
})();

/* ==== 87-screenlock.js ==== */
/* 87-screenlock.js — 전체화면 동안 화면 꺼짐 방지 + Esc 오입력 방지 (백로그 #6).
 *
 * 착수 전 스파이크로 확인한 사실(2026-09-07, `file://` 에서 실측):
 *   - file:// 은 secure context 다 → 두 API 모두 노출된다.
 *   - Wake Lock: headed Chromium 은 granted, headless 는 NotAllowedError(화면이 없어서).
 *     즉 거부는 file:// 탓이 아니라 headless 탓 — 주 환경(Chrome)에서는 동작한다.
 *   - Keyboard Lock: 양쪽 다 granted. 단 실제 효력은 전체화면일 때만이다.
 *
 * 정책: 전체화면에 들어갈 때만 잠그고 나올 때 푼다. 발표 중이 아닐 때 화면을 붙잡아 두지 않는다.
 * 둘 다 실패해도 발표는 계속돼야 하므로 모든 실패를 삼킨다 — 잠금은 편의지 기능이 아니다.
 * Esc 를 잠그면 브라우저가 전체화면을 끄는 대신 우리 키 라우터로 온다(= Esc 스택이 정상 동작).
 * 사용자는 Esc 를 길게 눌러 전체화면을 빠져나갈 수 있다(브라우저 기본 동작).
 */
Deck.screenlock = (() => {
  const U = Deck.util;
  let sentinel = null, kbLocked = false, note = '';

  const isFs = () => !!document.fullscreenElement;
  const status = () => ({ wake: !!sentinel, keyboard: kbLocked, note });

  async function lockWake() {
    if (sentinel || !(navigator.wakeLock && navigator.wakeLock.request)) return;
    try {
      sentinel = await navigator.wakeLock.request('screen');
      // 탭이 가려지면 브라우저가 알아서 놓는다 — 우리 상태도 같이 비운다
      sentinel.addEventListener('release', () => { sentinel = null; });
      note = '';
    } catch (e) {
      sentinel = null;
      note = (e && e.name) || 'wake-lock-failed';
      console.warn('wake lock denied', e);
    }
  }
  async function unlockWake() {
    const s = sentinel; sentinel = null;
    if (s) { try { await s.release(); } catch (e) { /* 이미 풀림 */ } }
  }
  async function lockKeys() {
    if (kbLocked || !(navigator.keyboard && navigator.keyboard.lock)) return;
    try { await navigator.keyboard.lock(['Escape']); kbLocked = true; }
    catch (e) { kbLocked = false; console.warn('keyboard lock denied', e); }
  }
  function unlockKeys() {
    if (!kbLocked) return;
    try { navigator.keyboard.unlock(); } catch (e) { /* 무시 */ }
    kbLocked = false;
  }

  async function sync() {
    if (isFs()) { await lockWake(); await lockKeys(); }
    else { await unlockWake(); unlockKeys(); }
    U.emit('deck:screenlock', status());
  }

  function init() {
    document.addEventListener('fullscreenchange', sync);
    // 탭을 다시 보면 브라우저가 놓아 버린 wake lock 을 되잡는다 (전체화면일 때만)
    document.addEventListener('visibilitychange', () => { if (!document.hidden && isFs()) lockWake(); });
  }
  return { init, sync, status, lockWake, unlockWake, lockKeys, unlockKeys };
})();

/* ==== 88-overview.js ==== */
/* 88-overview.js — 오버뷰 그리드 (백로그 #8).
 * 전 슬라이드를 축소해 한 화면에 깔고, 클릭·Enter 로 그 장으로 간다.
 *
 * 구현 메모: 화면 모델은 19장을 겹쳐 두고(.slide{position:absolute;inset:0}) 한 장만 보인다.
 * 인쇄(print.css)와 같은 문제라 같은 방식으로 푼다 — 겹침을 풀고 그리드에 깐다.
 * 축소는 transform 이 아니라 zoom 을 쓴다: transform 은 레이아웃 크기를 안 바꿔서
 * 그리드 칸이 원본 1280×720 을 차지해 버린다. zoom 은 레이아웃까지 줄인다(Chromium·Safari·FF126+).
 * 단 .slide 가 absolute 라 relative 로 돌리면 높이가 0이 되므로 1280×720 을 명시한다(실측).
 *
 * 보기만 하는 화면이 아니라 **정리하는 화면**이다(사용자 요청, 2026-09-07):
 *  - 드래그로 순서를 바꾼다. 클릭(이동)과 드래그(정렬)는 HTML5 DnD 가 자연히 구분한다
 *    — 끌면 dragstart 가 나고 click 은 안 난다.
 *  - 섹션(챕터)별로 묶어 띠를 보여 주고, 슬라이드의 섹션을 바로 바꾼다.
 *    섹션은 마크업이 아니라 상태(`chapters`)에 남아 내보내기·재오픈에도 유지된다.
 */
Deck.overview = (() => {
  const U = Deck.util, UI = Deck.ui;
  let on = false;

  const isOn = () => on;

  function enter() {
    if (on) return;
    on = true;
    UI.menu.close();
    document.body.classList.add('mode-overview');
    UI.setMode('overview');
    UI.pushEsc(() => exit(), 'overview');
    buildZoomBar(); applyZoom();
    buildChrome();
    mark();
    // 현재 장이 화면 밖이면 끌어온다
    const cur = Deck.nav.current();
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
    U.emit('deck:overview', { open: true });
  }
  function exit(goTo) {
    if (!on) return;
    on = false;
    UI.popEsc('overview');
    if (zoomBar) { zoomBar.remove(); zoomBar = null; }
    selId = null;
    Deck.nav.slides().forEach(s => s.classList.remove('ov-sel'));
    clearChrome();
    document.body.classList.remove('mode-overview');
    UI.setMode('present');
    if (typeof goTo === 'number') Deck.nav.show(goTo);
    Deck.nav.fit();
    UI.focusStage();
    U.emit('deck:overview', { open: false });
  }
  const toggle = () => (on ? exit() : enter());

  /* 그리드에서 '지금 장'을 표시한다. 화면과 같은 .active 를 쓰면 겹침 해제 CSS 와 싸우므로 별도 클래스. */
  function mark() {
    const i = Deck.nav.index();
    Deck.nav.slides().forEach((s, n) => s.classList.toggle('ov-cur', n === i));
  }

  /* ---------- 섹션 띠 ----------
   * 슬라이드를 그리드 아이템으로 그대로 쓰므로, 띠는 슬라이드 '앞'에 끼우는 전체폭 요소다.
   * 슬라이드마다 도구막대를 따로 넣었더니 그것들이 각각 그리드 칸을 차지해 한 줄에 한 장씩
   * 밀렸다(실측). 그래서 칸을 잡아먹지 않는 띠만 두고, 섹션 변경은 드래그로 한다.
   * data-ui 라 내보내기·인쇄에서 빠진다.
   */
  function clearChrome() {
    document.querySelectorAll('#deck > .ov-band').forEach(x => x.remove());
    Deck.nav.slides().forEach(s => s.removeAttribute('draggable'));
  }
  function buildChrome() {
    clearChrome();
    const deck = document.getElementById('deck');
    let last = null;
    Deck.nav.slides().forEach((s, i) => {
      s.setAttribute('draggable', 'true');
      const ch = Deck.structure.chapterOf(s) || NONE;
      if (ch !== last) {
        // 버튼은 위 막대 한 곳에 있다 — 띠마다 셋씩 반복하면 섹션 4개에 버튼 12개가 된다(사용자 요청).
        // dataset.i = 이 런이 시작하는 위치. 같은 이름이 떨어져 두 번 나오면 띠도 둘이라,
        // 해제·삭제는 «이름» 이 아니라 **그 런** 에만 적용한다(이름 바꾸기는 종전대로 전부).
        const band = U.el('div', { class: 'ov-band', 'data-ui': '', dataset: { ch, i: String(i) } }, [
          U.el('span', { class: 'nm', text: ch }),
          // 클래스가 'hint' 면 ui.css:245 의 «오버뷰에서 .hint 를 감춘다» 에 같이 걸린다(무대 하단 안내를 감추려는 규칙).
          // 그래서 이 안내는 2026-09-07 부터 한 번도 보인 적이 없었다 — 이름을 달리해서 살렸다.
          // 동선이 바뀌면 이 줄도 같이 고친다. 살려 놓고 틀린 말을 하게 두지 않는다.
          U.el('span', { class: 'ov-hint', text: '끌어오면 이 섹션이 됩니다 · 한 번 눌러 고르고, 두 번 눌러 그 장으로 · 섹션은 위 막대에서' }),
        ]);
        deck.insertBefore(band, s);
        last = ch;
      }
    });
  }

  /** 한 런(연속으로 같은 섹션인 구간)의 슬라이드들. 띠의 dataset.i 에서 시작한다. */
  function runAt(start) {
    const list = Deck.nav.slides();
    const ch = Deck.structure.chapterOf(list[start]) || NONE;
    const out = [];
    for (let i = start; i < list.length && (Deck.structure.chapterOf(list[i]) || NONE) === ch; i++) out.push(list[i]);
    return out;
  }

  /** 섹션만 뗀다 — 슬라이드는 앞 섹션으로 들어간다(PPT 와 같다). 앞이 없으면 «섹션 없음». */
  function unsetSection(start) {
    const list = Deck.nav.slides();
    const prev = start > 0 ? (Deck.structure.chapterOf(list[start - 1]) || '') : '';
    runAt(start).forEach(s => {
      if (prev) Deck.structure.setChapter(s.dataset.slideId, prev);
      else Deck.structure.clearChapter(s.dataset.slideId);
    });
    buildChrome(); mark(); syncBar();
    U.toast(prev ? '앞 섹션 «' + prev + '» 으로 합쳤습니다' : '섹션을 뗐습니다');
    return true;
  }

  /** 섹션과 그 슬라이드를 함께 지운다 — 확인 대화도 되돌리기도 기존 경로 그대로다. */
  async function removeSection(start) {
    const ids = runAt(start).map(s => s.dataset.slideId);
    const ok = await Deck.structure.remove(ids);
    if (ok) { buildChrome(); mark(); }
    return ok;
  }

  /** «이 슬라이드부터 새 섹션» — 섹션은 객체가 아니라 슬라이드에 붙은 이름이라 빈 섹션은 만들 수 없다. */
  async function newSectionFrom(id) {
    const el = Deck.structure.byId(id); if (!el) return false;
    let name = '';
    const r = await UI.dialog({
      title: '이 슬라이드부터 새 섹션',
      body: b => {
        b.append(U.el('p', { class: 'muted', text: '«' + Deck.structure.title(el) + '» 부터 다음 섹션 전까지가 새 섹션이 됩니다.' }));
        const inp = U.el('input', { type: 'text', id: 'ov-sec-new', placeholder: '섹션 이름' });
        inp.addEventListener('input', () => { name = inp.value; });
        b.append(inp);
        setTimeout(() => inp.focus(), 30);
      },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '만들기', primary: true }],
    });
    if (r !== 'ok' || !(name || '').trim()) return false;
    // 뒤따르던 슬라이드들은 자동으로 이 섹션에 들어간다 — 자기 이름이 없으면 앞 띠를 따르기 때문이다.
    Deck.structure.setChapter(id, name.trim());
    buildChrome(); mark(); syncBar();
    return true;
  }

  /** 현재 순서에서 index 위치의 슬라이드가 속할 섹션 = 그 앞에 있는 가장 가까운 띠 */
  function sectionAt(index) {
    const list = Deck.nav.slides();
    for (let i = Math.min(index, list.length - 1); i >= 0; i--) {
      const ch = Deck.structure.chapterOf(list[i]);
      if (ch) return ch;
    }
    return Deck.structure.chapterOf(list[0]) || '';
  }

  async function renameSection(from) {
    let name = from;
    const r = await UI.dialog({
      title: '섹션 이름 바꾸기',
      body: b => {
        b.append(U.el('p', { class: 'muted', text: '«' + from + '» 에 속한 슬라이드 전부의 섹션 이름을 바꿉니다.' }));
        const inp = U.el('input', { type: 'text', id: 'ov-sec-new', value: from });
        inp.addEventListener('input', () => { name = inp.value; });
        b.append(inp);
        setTimeout(() => { inp.focus(); inp.select(); }, 30);
      },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '바꾸기', primary: true }],
    });
    if (r !== 'ok') return false;
    name = (name || '').trim();
    if (!name || name === from) return false;
    Deck.nav.slides().filter(s => Deck.structure.chapterOf(s) === from)
      .forEach(s => Deck.structure.setChapter(s.dataset.slideId, name));
    buildChrome();
    return true;
  }

  /* ---------- 선택 ----------
   * 한 번 누르면 고르고, 두 번 누르면 그 장으로 간다(PPT 와 같다 · 사용자 요청).
   * 위 막대의 섹션 버튼 넷은 «고른 슬라이드» 를 대상으로 한다 — 선택이 없으면 눌리지 않는다.
   * 끌기와는 안 부딪힌다: HTML5 DnD 는 끌기가 시작되면 click 을 아예 안 낸다.
   */
  let selId = null;
  function select(id) {
    selId = id;
    Deck.nav.slides().forEach(s => s.classList.toggle('ov-sel', s.dataset.slideId === id));
    syncBar();
  }
  const selIndex = () => (selId ? Deck.nav.slides().findIndex(s => s.dataset.slideId === selId) : -1);
  /** 고른 슬라이드가 속한 런의 시작 위치. 섹션 버튼 셋이 여기서 대상을 얻는다. */
  function selRunStart() {
    const i = selIndex(); if (i < 0) return -1;
    const list = Deck.nav.slides();
    const ch = Deck.structure.chapterOf(list[i]) || NONE;
    let k = i;
    while (k > 0 && (Deck.structure.chapterOf(list[k - 1]) || NONE) === ch) k--;
    return k;
  }

  /* ---------- 줌 ----------
   * 배율만 키우면 안 된다. 칸 너비(minmax)와 slide 의 zoom 이 **짝**이라(1280 × .23 = 294 ≈ 296),
   * zoom 만 올리면 296px 칸 안에서 슬라이드만 작아진다. 둘을 함께 움직이면 auto-fill 이 열 수를 알아서 바꾼다.
   * 배율은 산출물이 아니라 보는 사람의 것이라 localStorage 에 둔다(덱 상태에 넣으면 검토자에게 따라간다).
   */
  const ZOOMS = [0.15, 0.23, 0.34, 0.5];
  const ZOOM_KEY = 'dommint:ov-zoom';
  let zoom = (() => {
    try { const v = parseFloat(localStorage.getItem(ZOOM_KEY)); return ZOOMS.includes(v) ? v : 0.23; } catch (e) { return 0.23; }
  })();
  let zoomBar = null;

  function applyZoom() {
    const r = document.documentElement.style;
    r.setProperty('--ov-zoom', String(zoom));
    r.setProperty('--ov-col', Math.round(1280 * zoom) + 2 + 'px');
    if (zoomBar) {
      zoomBar.querySelector('.ovz-n').textContent = Math.round(zoom * 100) + '%';
      zoomBar.querySelector('.ovz-out').disabled = zoom === ZOOMS[0];
      zoomBar.querySelector('.ovz-in').disabled = zoom === ZOOMS[ZOOMS.length - 1];
    }
  }
  function setZoom(z) {
    if (!ZOOMS.includes(z) || z === zoom) return false;
    zoom = z;
    try { localStorage.setItem(ZOOM_KEY, String(z)); } catch (e) { /* 사파리 사생활 모드 등 — 이번 회차만 적용된다 */ }
    applyZoom();
    return true;
  }
  const step = d => setZoom(ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, ZOOMS.indexOf(zoom) + d))]);

  /** 선택 여부에 따라 섹션 버튼 넷을 켜고 끈다 — 눌러도 아무 일 없는 버튼을 두지 않는다(#22).
   * «＋ 새 섹션» 만은 섹션이 하나도 없는 덱에서도 눌려야 한다. 그것이 첫 섹션을 만드는 길이다. */
  function syncBar() {
    if (!zoomBar) return;
    const has = selIndex() >= 0;
    const start = has ? selRunStart() : -1;
    const named = has && (Deck.structure.chapterOf(Deck.nav.slides()[start]) || NONE) !== NONE;
    zoomBar.querySelectorAll('[data-act]').forEach(b => {
      b.disabled = !has || (b.dataset.act !== 'new' && !named);
    });
    const lbl = zoomBar.querySelector('.ovs-of');
    if (lbl) lbl.textContent = has ? (selIndex() + 1) + '장 선택됨' : '슬라이드를 눌러 고르세요';
  }

  function buildZoomBar() {
    if (zoomBar) return;
    const b = (cls, text, title, fn, act) => {
      const el = U.el('button', { type: 'button', class: cls, text, title });
      if (act) el.dataset.act = act;
      el.addEventListener('click', fn);
      return el;
    };
    // #deck 밖의 fixed 요소다 — 안에 두면 그리드 칸을 하나 잡아먹는다(띠와 같은 이유).
    // 29번에서 «칸 안은 zoom 에 줄고 칸 밖은 칸을 먹는다» 로 두 자리를 버렸는데, 세 번째 자리가 여기다.
    zoomBar = U.el('div', { id: 'ov-bar', 'data-ui': '' }, [
      U.el('span', { class: 'ovz-l', text: '크기' }),
      b('ovz-out', '－', '작게', () => step(-1)),
      U.el('span', { class: 'ovz-n', text: '' }),
      b('ovz-in', '＋', '크게', () => step(1)),
      U.el('span', { class: 'ovs-sep' }),
      U.el('span', { class: 'ovs-of', text: '' }),
      b('ovs', '＋ 새 섹션', '고른 슬라이드부터 새 섹션을 시작한다', () => newSectionFrom(selId), 'new'),
      b('ovs', '이름 바꾸기', '고른 슬라이드가 속한 섹션의 이름을 바꾼다', () => renameSection(Deck.structure.chapterOf(Deck.nav.slides()[selRunStart()])), 'ren'),
      b('ovs', '섹션 해제', '섹션만 뗀다 — 슬라이드는 앞 섹션으로 들어간다', () => unsetSection(selRunStart()), 'unset'),
      b('ovs ov-del', '슬라이드째 삭제', '고른 슬라이드가 속한 섹션을 슬라이드까지 지운다', () => removeSection(selRunStart()), 'del'),
    ]);
    document.body.append(zoomBar);
    syncBar();
  }

  /* ---------- 드래그: 순서와 섹션을 한 번에 ---------- */
  const NONE = '(섹션 없음)';
  let dragId = null;
  function wireDrag() {
    const deck = document.getElementById('deck');
    deck.addEventListener('dragstart', e => {
      if (!on) return;
      const s = e.target.closest && e.target.closest('#deck > section.slide');
      if (!s) return;
      dragId = s.dataset.slideId; s.classList.add('ov-dragging');
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* 무시 */ }
    });
    deck.addEventListener('dragend', () => {
      dragId = null;
      document.querySelectorAll('.ov-dragging,.ov-dropzone').forEach(x => x.classList.remove('ov-dragging', 'ov-dropzone'));
    });
    deck.addEventListener('dragover', e => {
      if (!on || !dragId) return;
      e.preventDefault();
      const t = e.target.closest && e.target.closest('#deck > section.slide, #deck > .ov-band');
      document.querySelectorAll('.ov-dropzone').forEach(x => x.classList.remove('ov-dropzone'));
      if (t && t.dataset.slideId !== dragId) t.classList.add('ov-dropzone');
    });
    deck.addEventListener('drop', e => {
      if (!on || !dragId) return;
      e.preventDefault(); e.stopPropagation();
      const t = e.target.closest && e.target.closest('#deck > section.slide, #deck > .ov-band');
      const id = dragId; dragId = null;
      document.querySelectorAll('.ov-dragging,.ov-dropzone').forEach(x => x.classList.remove('ov-dragging', 'ov-dropzone'));
      if (!t) return;
      drop(id, t);
    });
  }

  /** 띠 위에 놓으면 그 섹션의 맨 앞으로, 슬라이드 위에 놓으면 그 자리로. 어느 쪽이든 섹션이 따라온다. */
  function drop(id, target) {
    const list = Deck.nav.slides();
    let index, chapter;
    if (target.classList.contains('ov-band')) {
      chapter = target.dataset.ch;
      index = list.findIndex(s => Deck.structure.chapterOf(s) === chapter);
      if (index < 0) index = 0;
    } else {
      if (target.dataset.slideId === id) return false;
      index = list.findIndex(s => s.dataset.slideId === target.dataset.slideId);
      chapter = Deck.structure.chapterOf(target);
    }
    Deck.structure.moveTo(id, index);
    if (chapter && chapter !== NONE && Deck.structure.chapterOf(Deck.structure.byId(id)) !== chapter) {
      Deck.structure.setChapter(id, chapter);
    }
    buildChrome(); mark(); syncBar();
    return true;
  }

  function init() {
    UI.registerMenu('present', { id: 'menu-overview', label: '오버뷰 그리드', hint: 'O', onClick: toggle });
    document.addEventListener('deck:change', () => { if (on) mark(); });
    wireDrag();
    // 캡처 단계에서 받아 슬라이드 안의 다른 클릭 핸들러(전환이미지 등)보다 먼저 처리한다.
    // 한 번은 고르기, 두 번은 이동이다(사용자 요청) — 종전에는 한 번에 나갔다.
    const hit = e => (on && e.target.closest ? e.target.closest('#deck > section.slide') : null);
    document.addEventListener('click', e => {
      const s = hit(e); if (!s) return;
      e.preventDefault(); e.stopPropagation();
      select(s.dataset.slideId);
    }, true);
    document.addEventListener('dblclick', e => {
      const s = hit(e); if (!s) return;
      e.preventDefault(); e.stopPropagation();
      exit(Deck.nav.slides().indexOf(s));
    }, true);
  }
  return { init, enter, exit, toggle, isOn, buildChrome, drop, renameSection, sectionAt,
           unsetSection, removeSection, newSectionFrom, runAt, setZoom, zoomOf: () => zoom,
           select, selected: () => selId };
})();

/* ==== 89-spotlight.js ==== */
/* 89-spotlight.js — 스포트라이트/레이저 (백로그 #9).
 * 발표 중 '가리키기'. 펜과 분리돼 있다 — 상태를 한 글자도 쓰지 않고 흔적도 남기지 않는다.
 * 그래서 S.commit 도, 되돌리기도 없다. 끄면 사라진다.
 *
 * 커서 주변만 밝게 두고 나머지를 덮는다. 밝은 영역은 **둥근 모서리 사각형**이 기본이다 —
 * 슬라이드 내용이 카드·표·문단이라 원보다 사각형이 가릴 것을 덜 가린다. 휠로 크기 조절.
 * 구멍은 radial-gradient 가 아니라 '작은 상자 + 아주 큰 box-shadow'로 판다(모서리 반경이 먹는다).
 * 슬라이드 이동 키는 삼키지 않는다 — 가리키면서 넘겨야 한다(펜 모드와 다른 점).
 */
Deck.spotlight = (() => {
  const U = Deck.util, UI = Deck.ui;
  const MIN = 60, MAX = 420;
  let on = false, layer = null, r = 150, x = null, y = null;

  const isOn = () => on;
  const radius = () => r;

  let hole = null;
  function ensure() {
    if (layer) return layer;
    layer = U.el('div', { class: 'spot-layer', 'data-ui': '', 'aria-hidden': 'true' });
    hole = U.el('div', { class: 'spot-hole' });
    layer.append(hole);
    document.body.append(layer);
    return layer;
  }
  /* 사각형 비율: 슬라이드 카드가 대체로 가로로 길다. r 을 '반높이'로 보고 가로를 1.9배 준다. */
  const W = () => Math.round(r * 1.9 * 2), H = () => Math.round(r * 2);
  function paint() {
    if (!layer) return;
    if (x === null) { layer.style.setProperty('--spot-a', '0'); return; }
    layer.style.setProperty('--spot-a', '1');
    layer.style.setProperty('--spot-x', x + 'px');
    layer.style.setProperty('--spot-y', y + 'px');
    layer.style.setProperty('--spot-r', r + 'px');
    layer.style.setProperty('--spot-w', W() + 'px');
    layer.style.setProperty('--spot-h', H() + 'px');
  }
  const onMove = e => { x = e.clientX; y = e.clientY; paint(); };
  const onWheel = e => {
    if (!on) return;
    e.preventDefault();
    // 델타에 비례해서 움직인다. 고정 폭이면 트랙패드(작은 델타가 잘게 쏟아짐)에서 과하게 튄다.
    const step = Math.sign(e.deltaY) * Math.min(60, Math.max(6, Math.abs(e.deltaY) * 0.2));
    r = Math.max(MIN, Math.min(MAX, r + step));
    paint();
  };

  function enter() {
    if (on) return;
    on = true;
    UI.menu.close();
    ensure();
    document.body.classList.add('mode-spotlight');
    UI.pushEsc(() => exit(), 'spotlight');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('wheel', onWheel, { passive: false });
    paint();
    U.toast('스포트라이트 · 휠로 크기 · Esc 로 끄기');
    U.emit('deck:spotlight', { on: true });
  }
  function exit() {
    if (!on) return;
    on = false;
    UI.popEsc('spotlight');
    document.body.classList.remove('mode-spotlight');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('wheel', onWheel);
    if (layer) { layer.remove(); layer = null; hole = null; }
    x = y = null;
    U.emit('deck:spotlight', { on: false });
  }
  const toggle = () => (on ? exit() : enter());

  function init() {
    UI.registerMenu('present', { id: 'menu-spotlight', label: '스포트라이트 (가리키기)', hint: 'L', onClick: toggle });
  }
  return { init, enter, exit, toggle, isOn, radius, size: () => ({ w: W(), h: H() }) };
})();

/* ==== 90-media.js ==== */
/* 90-media.js — transition images (파노라마): delivered images live in the slide markup (.pano-hold img),
 * user-registered images live in IndexedDB and are listed in state.media[slideId].pano.
 * Also owns the nz-display click controller, the overlay slideshow, the attachments panel and the image viewer. */
Deck.media = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  const DUR = 560, MAX = 10 * 1024 * 1024;
  const urlCache = new Map();
  let viewer = null, filesPanel = null, filesBody = null, filterMode = 'all';

  async function urlFor(bid) {
    if (urlCache.has(bid)) return urlCache.get(bid);
    const r = await U.idb.get(bid); if (!r || !r.blob) return null;
    const u = URL.createObjectURL(r.blob); urlCache.set(bid, u); return u;
  }
  const delivered = s => [...s.querySelectorAll(':scope > .pano-hold img')].map(i => i.src);
  async function userPano(id) { const out = []; for (const bid of S.media(id).pano) { const u = await urlFor(bid); const r = await U.idb.get(bid); if (u) out.push({ bid, url: u, name: r ? r.name : bid, size: r ? r.size : 0 }); } return out; }
  const listPano = id => S.media(id).pano.slice();

  async function register(id, files) {
    let k = 0;
    for (const f of files) {
      if (!/^image\//.test(f.type)) { U.toast(f.name + ': 이미지 파일만 등록할 수 있습니다'); continue; }
      if (f.size > MAX) { U.toast(f.name + ': 10MB 이하 이미지만 등록할 수 있습니다'); continue; }
      const c = await U.compressImage(f);                       // 전환이미지도 같은 규칙으로 줄인다 (P0-4)
      const bid = U.uid('pano');
      await U.idb.put({ id: bid, name: c.name || f.name, type: c.blob.type || f.type, size: c.blob.size, blob: c.blob });
      S.mediaFor(id).pano.push(bid); k++;
    }
    if (k) { S.commit('전환이미지 등록 ' + k + '건: ' + id); await renderSlide(Deck.structure.byId(id)); }
    return k;
  }
  async function remove(id, bid) {
    const m = S.mediaFor(id);
    m.pano = m.pano.filter(x => x !== bid); m.ref = m.ref.filter(x => x !== bid);
    await U.idb.del(bid);
    if (urlCache.has(bid)) { URL.revokeObjectURL(urlCache.get(bid)); urlCache.delete(bid); }
    S.commit('전환이미지 삭제: ' + id);
    await renderSlide(Deck.structure.byId(id));
    if (Deck.review) Deck.review.render();
    if (filesPanel && filesPanel.el.classList.contains('open')) renderFiles();

  /* ---------- nz-display (custom click-to-advance display) ---------- */
  const screens = disp => [...disp.querySelectorAll('.nz-screen')];
  function layout(disp) {
    const sc = screens(disp), di = +(disp.dataset.di || 0);
    sc.forEach((el, i) => { el.style.transition = 'none'; el.classList.toggle('cur', i === di); el.style.transform = i === di ? 'translateX(0)' : 'translateX(100%)'; });
    void disp.offsetWidth; sc.forEach(el => { el.style.transition = ''; });
  }
  function drawCount(disp) { const c = disp.querySelector('.nz-dcount'); if (c) c.textContent = (+(disp.dataset.di || 0) + 1) + ' / ' + (+(disp.dataset.n || 1)); }
  async function buildDisplay(disp, s) {
    const track = disp.querySelector('.nz-dtrack'); if (!track) return;
    [...track.querySelectorAll('.nz-screen:not([data-base="1"])')].forEach(x => x.remove());
    const srcs = delivered(s).concat((await userPano(s.dataset.slideId)).map(x => x.url));
    srcs.forEach(src => { const sc = U.el('div', { class: 'nz-screen' }); sc.append(U.el('img', { src, alt: '전환 화면' })); track.append(sc); });
    const n = screens(disp).length; disp.dataset.n = n;
    let di = +(disp.dataset.di || 0); if (di >= n) di = 0; disp.dataset.di = di;
    disp.classList.toggle('single', n <= 1);
    layout(disp); drawCount(disp);
  }
  function advance(disp) {
    if (disp._anim) return;
    const sc = screens(disp), n = sc.length; if (n <= 1) return;
    const di = +(disp.dataset.di || 0), ni = (di + 1) % n, out = sc[di], inc = sc[ni];
    inc.style.transition = 'none'; inc.style.transform = 'translateX(100%)'; void inc.offsetWidth; inc.style.transition = '';
    disp._anim = true;
    requestAnimationFrame(() => { out.style.transform = 'translateX(-100%)'; out.classList.remove('cur'); inc.style.transform = 'translateX(0)'; inc.classList.add('cur'); });
    disp.dataset.di = ni; drawCount(disp);
    setTimeout(() => { disp._anim = false; if (out !== screens(disp)[+disp.dataset.di]) { out.style.transition = 'none'; out.style.transform = 'translateX(100%)'; void out.offsetWidth; out.style.transition = ''; } }, DUR + 40);
  }

  /* ---------- overlay slideshow for slides without a custom display ---------- */
  async function buildOverlay(s) {
    const srcs = delivered(s).concat((await userPano(s.dataset.slideId)).map(x => x.url));
    let ov = s.querySelector(':scope > .pano-overlay');
    if (!srcs.length) { if (ov) ov.remove(); return; }
    if (!ov) {
      ov = U.el('div', { class: 'pano-overlay slideshow' });
      ov.append(U.el('div', { class: 'ss-track' }), U.el('div', { class: 'ss-dots' }), U.el('div', { class: 'ss-count' }), U.el('div', { class: 'pano-tag', text: '전환이미지' }));
      ov.addEventListener('click', e => { e.stopPropagation(); if (UI.mode !== 'present') return; if (e.target.closest('.ss-dots')) return; go(ov, ov._i + 1); });

      const d = U.el('i', { dataset: { i: String(i) } }); d.addEventListener('click', e => { e.stopPropagation(); go(ov, i); }); dots.append(d);

   * 방법이 없네"*. 실측: 등록 직후 `.pano-overlay` 가 슬라이드를 **100% 덮고**
   * (1280×720 · z-index 20) 닫기 버튼도 Esc 도 없었다. 원래 슬라이드로 돌아갈 길이 없었다.
   *
   * **빠져나오는 길을 발명하지 않는다** — 이 저장소의 정본은 `UI.pushEsc`/`popEsc` 스택이고
   * 펜·메모 상자·발표자 뷰가 전부 그 층을 쓴다. 여기도 같은 층에 얹는다.
   *
   * 닫는 것은 **취소가 아니다** — 등록한 이미지는 상태에 그대로 남고, 배지를 눌러 다시 연다.
   * 컨트롤에는 `data-ui` 를 단다(스포트라이트 선례) — `cleanClone()` 이 지우므로
   * 내보내기·인쇄에 안 실린다. 스타일을 인라인으로 둔 것은 `ui.css` 를 다른 작업이
   * 쥐고 있던 사정 때문이다(2026-09-11). */
  const BTN = 'position:absolute;z-index:30;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.28);'
            + 'background:rgba(10,23,48,.72);color:#e8eef7;font:700 15px/1 system-ui;cursor:pointer;display:flex;'
            + 'align-items:center;justify-content:center;padding:0;';

  function hideOverlay(s, ov) {
    if (ov.hidden) return;
    ov.hidden = true;
    showBadge(s, ov);
  }

  function closeBtn(s, ov) {
    const b = U.el('button', { type: 'button', 'data-ui': '', title: '닫기 (Esc) — 등록한 이미지는 그대로 남습니다',
                               text: '×', style: BTN + 'top:10px;left:10px;' });   // 우상단은 메뉴 버튼이 덮는다(실측)

  }

    if (!bg) {
      bg = U.el('button', { type: 'button', class: 'pano-badge', 'data-ui': '', title: '전환이미지 다시 보기',
                            style: BTN + 'top:10px;left:10px;width:auto;padding:0 10px;border-radius:999px;font-size:12px;' });
      bg.addEventListener('click', e => {
        e.stopPropagation(); ov.hidden = false; bg.remove();

  async function renderSlide(s) { if (!s) return; const disp = s.querySelector('.nz-display'); if (disp) await buildDisplay(disp, s); else await buildOverlay(s); }
  async function renderAll() { for (const s of Deck.nav.slides()) await renderSlide(s); }

  /* ---------- viewer ---------- */
  function view(src, name) {
    if (!viewer) {
      viewer = U.el('div', { id: 'media-viewer', 'data-ui': '' }, [U.el('button', { type: 'button', class: 'rv-close', text: '×', title: '닫기' }), U.el('img', { alt: '' }), U.el('div', { class: 'rv-cap' })]);

    viewer.classList.add('open'); UI.pushEsc(viewer._close, 'viewer');
  }

  /* ---------- attachments panel (all slides) ---------- */
  async function collect() {
    const items = []; const slides = Deck.nav.slides();
    for (let i = 0; i < slides.length; i++) {
      const s = slides[i], sid = s.dataset.slideId, page = i + 1, title = Deck.structure.title(s);
      for (const bid of (S.data.notes[sid] || {}).files || []) { const r = await U.idb.get(bid); items.push({ cat: 'attach', page, title, sid, bid, name: r ? r.name : bid, type: r ? r.type : '', size: r ? r.size : 0, url: r && /^image\//.test(r.type) ? await urlFor(bid) : null }); }
      for (const p of await userPano(sid)) items.push({ cat: 'pano', page, title, sid, bid: p.bid, name: p.name, type: 'image/*', size: p.size, url: p.url });
      for (const bid of S.media(sid).ref) { const r = await U.idb.get(bid); items.push({ cat: 'ref', page, title, sid, bid, name: r ? r.name : bid, type: 'image/*', size: r ? r.size : 0, url: await urlFor(bid) }); }

  }
  const TAG = { attach: ['t-a', '📝 메모첨부'], pano: ['t-p', '🖼 전환이미지'], ref: ['t-r', '🗂 참고이미지'] };
  /* 70-review 와 같은 이유로 순번을 둔다 — 겹친 실행이 오래된 결과로 최신 화면을 덮지 않게. */

    if (seq !== panelSeq) return;

    const grid = filesBody.querySelector('.ri-grid'); grid.innerHTML = '';
    filesBody.querySelector('.ri-status').textContent = all.length + '개 첨부(전체) · 표시 ' + items.length + '개';
    if (!items.length) { grid.append(U.el('div', { class: 'muted', text: all.length ? '해당 종류의 첨부가 없습니다.' : '첨부된 파일이 없습니다. 슬라이드 메모의 “파일 첨부 / 전환이미지 등록”으로 추가됩니다.' })); return; }

      del.addEventListener('click', async () => {

        U.el('div', {}, [U.el('div', {}, [U.el('span', { class: 'ri-page', text: 'P.' + it.page }), U.el('span', { class: 'ri-tag ' + TAG[it.cat][0], text: TAG[it.cat][1] })]), U.el('b', { text: it.name, title: it.name }), U.el('small', { text: it.title + ' · ' + (it.size ? Math.ceil(it.size / 1024) + ' KB' : '—') })]),
        del]));
    }
  }
  function buildFilesPanel(body) {
    filesBody = body;
    const filter = U.el('div', { class: 'ri-filter' });

    body.append(filter, U.el('div', { class: 'ri-grid' }), U.el('div', { class: 'status-line ri-status', text: '각 파일이 몇 번 슬라이드에 연결됐는지 함께 표시됩니다.' }));
  }
  function renderSection(host, id) {
    host.innerHTML = '';
    const base = delivered(Deck.structure.byId(id)).length;
    const list = U.el('div', { class: 'pano-list' });
    host.append(U.el('div', { class: 'sec-h' }, ['🖼 전환이미지(파노라마)', U.el('span', { class: 'cnt', text: String(S.media(id).pano.length) })]), list);
    userPano(id).then(arr => {
      if (base) list.append(U.el('div', { class: 'muted', text: '기본 화면 ' + base + '장은 파일에 포함되어 있습니다. 아래는 이 브라우저에서 추가한 전환이미지입니다.' }));
      if (!arr.length) { list.append(U.el('div', { class: 'muted', text: '등록된 전환이미지가 없습니다. “전환이미지 등록”으로 추가하면 본문에서 클릭 시 순차 전환됩니다.' })); return; }

        list.append(U.el('div', { class: 'pi' }, [img, U.el('div', { class: 'nm' }, [p.name, U.el('small', { text: '본문 순서 ' + (base + i + 2) + '번째 화면 · ' + Math.ceil(p.size / 1024) + ' KB' })]), del]));

      if (nb) { e.stopPropagation(); e.preventDefault(); advance(nb.closest('.nz-display')); return; }
      const disp = e.target.closest && e.target.closest('.nz-display');

    UI.registerMenu('compose', { order: 20, id: 'menu-files', label: '첨부 파일 목록', onClick: () => UI.panel.open('files') });
    if (Deck.review) Deck.review.addSection('pano', renderSection);
    document.addEventListener('deck:change', () => { if (filesPanel.el.classList.contains('open')) renderFiles(); });
  }
  return { init, register, remove, renderSlide, renderAll, listPano, view, advance };
})();

/* ==== 95-export.js ==== */
/* 95-export.js — 내부 산출 경로 (clean snapshot + full state), scoped reset, storage usage, archive import.
 *
 * 산출은 여기와 `96-handoff.js` 둘뿐이다. 걷어내기는 **누가 다시 그리는가**로 갈라 두 벌:
 * `stripToolChrome()`(20-nav 가 되살린다 — 둘 다 부른다) 과 `stripMediaArtifacts()`
 * (90-media 가 되살린다 — 이쪽만 부른다).
 * 96 은 여기서 갈라진다: 이쪽은 상태를 싣고 글자를 원문으로 되돌리며, 저쪽은 상태를 버리고
 * 화면에 보이는 글자를 그대로 굽는다.
 *
 * 저장 경로 (P0-2, 백로그 #2):
 *   ⌘S  saveInPlace  — File System Access 로 원본 파일을 제자리에서 덮어쓴다.
 *                      핸들은 메모리 + IndexedDB(blobs 스토어, id '__fs__:<deckId>') 에 보관해 재오픈 후에도 피커 없이 저장.
 *                      권한이 없거나 핸들이 죽었으면 피커를 다시 띄우고, API 가 없으면(Safari·Firefox) <a download> 로 폴백.
 *   ⌘⇧S saveAs       — 항상 피커. 새 핸들로 갈아탄다.
 *   취소(AbortError) 는 조용히 끝낸다 — 취소했는데 다운로드 폴더에 사본이 떨어지면 안 된다.
 */
Deck.exporter = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;

  /* 내보내기 버튼의 이름은 여기 한 곳에만 있다.
   * 종전에는 네 자리(메뉴·단축키 도움말·아젠다 패널·검토 패널)가 각자 문자열을 들고 있었고,
   * '검토본 → 수정본' 이라는 사용자 결정이 **메뉴 한 곳에만** 반영돼 검토자가 같은 동작을
   * 두 이름으로 만났다. 이름을 바꿀 일이 또 생기므로 참조가 갈리지 않게 소유자를 둔다.
   * `tests/test_export_label.py` 가 네 자리를 한꺼번에 잰다. */
  const LABEL = '수정본 HTML 내보내기';

  let usageText = '저장소 사용량 확인';

  // 꼬리표는 딱 하나만 붙는다. `_수정요청`(도구가 내보내는 요청본) / `_수정완료`(납품본).
  const TAGS = '수정요청|수정완료|검토본|검토요청|수정본|수정메모|수정요청메모|구조변경요청|외부전달';
  const yymmdd = () => { const d = new Date(); return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };

  function baseName(stem) {
    // 이름이 왕복할 때마다 한 겹씩 길어지던 것을 되돌린다 — 실제로
    // `…_v02_검토요청_v2_검토본_20260908_v2_검토본_20260908` 까지 자랐다.
    // 뒤에서부터: (꼬리표+날짜) · (꼬리표) · (앞에 다른 버전이 또 있는 경우의 버전) 을 걷어낸다.
    // 날짜는 **꼬리표 뒤에 있을 때만** 뗀다 — `보고서_20260908` 의 날짜는 이름의 일부다.
    let s = stem, prev = null;
    while (s !== prev) {
      prev = s;
      s = s.replace(new RegExp('_(?:' + TAGS + ')_\\d{6,8}$'), '')
           .replace(new RegExp('_(?:' + TAGS + ')$'), '');
      /* **버전 뒤에 붙은 6자리 날짜는 우리가 만든 것**이라 뗀다 — 다시 붙일 것이다(49번).
       * 안 떼면 `_v3_260910` 을 저장할 때 `_v3_260910_…_260911` 로 **날짜가 중첩된다**(실측).
       * 위 규칙이 «꼬리표 뒤의 날짜」만 떼기 때문에 이 꼴이 빠져나갔다 — 18번의 잔여다.
       * `보고서_20260908` 처럼 **버전 없이 날짜만** 있는 것은 이름의 일부라 그대로 둔다. */
      s = s.replace(/(_v[\d.]*\d)_\d{6}$/, '$1');
      const m = /^(.*)(_v\d+)$/.exec(s);            // 버전이 두 번 이상 박혔으면 마지막 것을 버린다
      if (m && /_v\d+/.test(m[1])) s = m[1];        // (앞에 원래 버전이 남아 있을 때만)
    }
    return s;
  }

  function bumpVersion(stem, create) {
    // 요청본은 **다음 버전에 대한 요청**이라 버전을 올린다. v09 → v10 처럼 자리수가 늘어나는
    // 경우를 빼고는 0 채움 폭을 지킨다 — 파일 목록에서 v10 이 v2 앞에 서지 않게.
    // **마지막 숫자 그룹만** 올린다. 종전 `/^(.*_v)(\d+)$/` 는 `_v` 다음이 곧바로 숫자열이고
    // 거기서 끝날 때만 걸려 **점 버전(`_v0.2`)이 통째로 빠져나갔다** — 검토본이 같은 번호로
    // 나갔고, 실사용에서 **배치가 깨진 v0.1 에 두 번 저장하는 사고**가 났다(0-A · 2026-09-10).
    // `[\d.]*?` 는 게으르므로 `_v42` 는 종전대로 빈 접두사 + `42` 로 갈린다 — 정수 규칙 불변.
    // 표본 전수(2026-09-10): 올라감 `_v42 _v20 _v1 _v0 _v9 _v07` · 안 올라감(의도)
    // `_고객C_260909`·`DomMint_작업장`·`거인화_6주_프로그램_2`(버전이 없다) · 결함 `_v0.1 _v0.2`.
    // `_vX.0` 형태는 실재 파일에 없어 **메이저 올림은 만들지 않는다**(마이너가 기본).
    const m = /^(.*_v[\d.]*?)(\d+)$/.exec(stem);
    /* 버전이 없을 때 **만들어 붙일지는 부르는 쪽이 정한다.** 기본값은 종전대로 «안 붙인다» —
     * `DomMint_작업장`·`거인화_6주_프로그램_2` 처럼 버전 개념이 없는 이름에 억지로 달지 않는다(18번).
     * 저장·내보내기는 `create` 로 켜서 **`_v01`** 을 붙인다(사용자 지시 49번 · 정정 09-11).
     * **두 자리 0 채움**이라 `_v01`→`_v09`→`_v10` 으로 자리수가 늘고, 지금 배포본
     * (`DomMint_작업장_v01`~`_v04`)의 규칙과도 맞는다. 기존 `_v42` 의 폭은 그대로 유지된다. */
    if (!m) return create ? stem + '_v01' : stem;
    const next = String(parseInt(m[2], 10) + 1);
    return m[1] + next.padStart(m[2].length, '0');
  }

  /* `opts.tag` 는 붙일 꼬리표, `opts.bump` 는 버전을 올릴지.
   *
   * 요청본만 버전을 올린다 — 요청은 **다음 판에 대한** 것이라서다. 외부 전달본은 같은 판을
   * 다르게 포장한 것이라 올리면 안 된다: 올려 버리면 v04 덱을 보낸 상대와 v05 를 들고 있는
   * 우리가 서로 다른 번호로 같은 자료를 부르게 된다. */
  /* 브라우저 탭 제목을 덱 이름에 맞춘다(48번).
   *
   * 종전에는 `build.py` 가 박은 문자열이 그대로 굳어 **무엇을 열어도 같은 제목**이었다 —
   * 셸은 「DomMint — 새 보고자료」, 덱은 빌드 당시의 사업명. 사용자 지적:
   * *«왜 브라우저 창에는 매번 「DomMint — 새 보고자료」지? 모든 브라우저에 타이틀이 동일하다»*.
   *
   * **`filename()` 과 같은 축을 쓴다**(이름 → 없으면 경로 유추) — 갈라지면 제목과 파일명이
   * 다른 것을 가리킨다. ***그리고 `document.title` 은 크롬 인쇄의 기본 PDF 파일명이다*** —
   * 49번의 「PDF 도 동일」이 여기서 절반 따라온다. */
  /* 버전의 출처는 **하나여야 한다**. 이름에는 어간이, 파일에는 판이 들어 있다 —
   * 이름만 보면 다시 연 v25 가 스스로를 v24 라 하고(탭 제목이 파일명과 갈라진 원인,
   * 2026-09-16 실측: v25 파일의 <title> 이 문자열 그대로 v24), 파일만 보면 셸에서
   * 흡수한 덱이 전부 'DomMint_작업장' 이 된다. 어느 한쪽만으로는 답이 안 나온다.
   *
   * 그래서 **여기 한 자리에서** 합치고 `retitle()` 과 `filename()` 은 이 함수만 본다.
   * 각자 해석하면 축이 또 갈라진다 — 지금 고치는 것이 바로 그 갈라짐이다(85번 주석).
   *
   * 파일의 판을 따르는 것은 **같은 덱의 파일일 때만**이다. 어간이 다르면 남의 파일이거나
   * 셸이라 판을 빌려올 근거가 없다 — `레드_테스트` 를 v43 덱 창에서 열었다고
   * `레드_테스트_v43` 이 되어서는 안 된다. */
  function deckStem() {
    const name = baseName(U.nfc((S.data.name || '').trim()));
    let path = '';
    try { path = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (e) { /* 경로를 못 읽으면 이름만 본다 */ }
    const file = baseName(U.nfc(path.replace(/\.html?$/i, '')));
    if (!name) return file;
    const VER = /_v[\d.]*\d$/;
    if (VER.test(file) && file.replace(VER, '') === name.replace(VER, '')) return file;
    return name;
  }

  function retitle() {
    document.title = deckStem() || 'DomMint';
    return document.title;
  }

  function filename(opts) {
    const o = Object.assign({ tag: '수정요청', bump: true }, opts || {});
    // base 이름은 작성자가 정한 덱 이름에서 온다. 흡수해서 만든 덱은 경로 이름이
    // 'DomMint_작업장' 이라 경로에서 유추할 수가 없다(작업장 Task 2).
    // 꼬리표·버전 규칙은 경로에서 오든 이름에서 오든 똑같이 적용한다 —
    // 두 규칙이 갈라지면 같은 덱이 저장 경로에 따라 다른 이름으로 나간다.
    // **NFC 정규화도 두 갈래 모두에 적용한다.** macOS 는 한글을 NFD(자모 분리)로 넘겨주는데
    // 소스의 `수정요청` 은 NFC 라 글자가 달라 정규식이 통째로 빗나간다(꼬리표가 겹쳐 붙은
    // 원인이었다). 경로만 정규화하면 이름 쪽으로 같은 결함이 되돌아온다 — 이름은 이제
    // 1순위이고 `mint.py --name` 은 셸에서 오므로 NFD 일 수 있다.
    // 이름·경로를 여기서 따로 풀지 않는다 — `deckStem()` 이 유일한 해석기다(위 주석).
    // 종전에는 이 자리에 이름→경로 순서가 한 벌 더 있어서 retitle() 과 축이 갈라졌다.
    const base = baseName(deckStem().replace(/[\\/:*?"<>|]/g, '_')) || 'deck';
    const ver = o.bump ? bumpVersion(base, true) : base;
    /* 꼬리표는 **검토본 왕복의 표식**이다. 「HTML 다른 이름으로 저장」은 원본을 새 이름으로
     * 쓰는 것이라 꼬리표가 붙을 이유가 없다 — 사용자 표기 `파일명_v1_yymmdd.html` 그대로(49번). */
    return ver + (o.tag ? '_' + o.tag : '') + '_' + yymmdd() + '.html';
  }



  /* 걷어내기는 **누가 다시 그리는가**로 갈린다. 지우고 나서 아무도 다시 그리지 않으면
   * 그건 내용을 버린 것이다 — 실제로 그렇게 났다(2026-09-09, 아래 stripMediaArtifacts 주석).
   *
   * 여기는 `20-nav.js` 가 다시 그리는 것까지다. 20-nav 는 **모든** 산출물에 실리므로
   * 어느 쪽으로 내보내든 도트·페이저는 로드 때 되살아난다. */
  function stripToolChrome(clone) {
    clone.querySelectorAll('[data-ui],dialog,.pen-layer').forEach(x => x.remove());
    clone.querySelectorAll('#deck > section.slide').forEach(s => { s.classList.remove('active', 'prev'); s.removeAttribute('style'); });
    ['#deck', '#bar'].forEach(sel => { const el = clone.querySelector(sel); if (el) el.removeAttribute('style'); });
    clone.querySelectorAll('.uc-nav').forEach(x => { x.innerHTML = ''; x.removeAttribute('data-pn'); });
    const dots = clone.querySelector('#dots'); if (dots) dots.innerHTML = '';
    clone.querySelectorAll('.edit-hover').forEach(x => x.classList.remove('edit-hover'));
    const body = clone.querySelector('body'); if (body) body.className = '';
    return clone;
  }

  /* 전환이미지는 마크업이 아니다. `90-media.js` 가 `.pano-hold` 와 상태에서 **그린다** —
   * nz-display 의 여벌 화면도, 슬라이드쇼 오버레이도 로드 때 만들어진다.
   * 그래서 90-media 를 싣는 산출물에서만 지운다.
   *
   * 한 벌로 묶어 두었다가 외부 전달본이 물렸다: 96 은 90-media 를 싣지 않는데 여기까지
   * 같이 돌아서, 14쪽의 전환화면 3장이 사라지고 남은 base 한 장은 `cur` 이 떨어져
   * CSS 기본값 `translateX(100%)` 로 화면 밖에 서서 **백지**가 됐다.
   * 96 은 이 함수를 부르지 않고 그려진 결과를 그대로 굽는다. */
  function stripMediaArtifacts(clone) {
    clone.querySelectorAll('.pano-overlay').forEach(x => x.remove());
    clone.querySelectorAll('.nz-display .nz-screen:not([data-base="1"])').forEach(x => x.remove());
    clone.querySelectorAll('.nz-screen').forEach(x => { x.removeAttribute('style'); x.classList.remove('cur'); });
    clone.querySelectorAll('.nz-display').forEach(d => { d.removeAttribute('data-n'); d.removeAttribute('data-di'); });
    return clone;
  }

  /* `asFile` 은 **이 산출물이 저장될 파일 이름**이다. 주면 굽는 `<title>` 을 그 이름에 맞춘다.
   *
   * 안 맞추면 굽는 제목은 «내보내기 순간의 document.title» = bump 안 된 판이고 파일 이름은
   * bump 된 판이라, 차이가 언제나 정확히 한 칸이다 — v44 파일 안에 v43 제목(2026-09-16 실측).
   * 다시 열면 `retitle()` 이 덮어써서 화면은 맞지만 **바이트는 틀린 채로 남는다**. JS 를 안 돌리는
   * 독자가 전부 틀린 판을 읽는다: Spotlight·파일 색인·grep·메일 첨부 미리보기.
   * 그래서 그물도 DOM 이 아니라 **파일의 <title> 문자열**을 재야 한다.
   *
   * 제자리 저장은 안 준다 — 같은 파일을 덮어쓰므로 지금 제목이 이미 그 파일의 것이다. */
  async function cleanClone(asFile) {
    /* 파일로 나가는 모든 산출(내보내기·⌘S·공유·mint)에 새 saveId 를 붙인다. 로컬도 같은 계보를 들고 있어야
     * 이 파일을 다시 열 때 «이어진 작업» 으로 판정된다(10-state.js load) — 부르는 쪽이 곧 commit 한다.
     * ponytail: 계보는 최근 50개만 — 그보다 오래된 사본을 열면 파일이 이긴다(진 로컬은 보관된다). */
    S.data.lineage = (S.data.lineage || []).concat(U.uid('save')).slice(-50);
    const json = await S.exportJson();
    const clone = stripMediaArtifacts(stripToolChrome(document.documentElement.cloneNode(true)));
    // keep slide markup pristine: text edits live in state, not in the file's slides
    // 원문 복원도 textContent 축으로. innerText 로 비교하면 안 보이는 슬라이드가 전부 '' 로 읽혀
    // 조건이 항상 참이 되고, 결국 슬라이드 글자를 지워 버린다(v43부터 있던 버그).
    /* 서식 span 을 걷어낸다. **위의 원문 복원으로는 안 지워진다** — span 을 넣어도 textContent 는
     * 그대로라 `el.textContent !== o` 가 거짓이 되어 그 줄을 그냥 지나친다(실측 2026-09-10).
     * 검토본은 상태(`styles.runs`)를 싣고 가므로 다시 열 때 재생성된다 — 파일에는 평문만 남는다.
     * 96-handoff 는 이 함수를 쓰지 않는다: 그쪽은 **상태를 버리고 보이는 대로 굽는** 경로라
     * span 이 남아야 받는 사람 화면에 서식이 보인다. 그 갈림이 의도된 차이다. */
    clone.querySelectorAll('#deck [data-fmt-run]').forEach(sp => sp.replaceWith(sp.textContent));
    // 요소 자체의 인라인도 같은 이유로 걷는다 — span 만 걷던 자리에 빠져 있었다(42번).
    if (Deck.textstyle) Deck.textstyle.strip(clone.querySelector('#deck'));
    if (Deck.textedit) clone.querySelectorAll('#deck [data-key]').forEach(el => { const o = Deck.textedit.originalOf(el.dataset.key); if (o !== null) Deck.textedit.putText(el, o); });   // 대입하면 원문의 <br>·span 이 날아간다
    const ttl = clone.querySelector('title');
    if (asFile && ttl) ttl.textContent = baseName(U.nfc(String(asFile).replace(/\.html?$/i, '')));
    const tag = clone.querySelector('#deck-state'); if (tag) tag.textContent = JSON.stringify(json).replace(/<\//g, '<\\/');
    return clone;
  }
  /* 수정요청은 deck-state JSON 안에만 있다 — 브라우저로 열어도 안 보이고, 텍스트로 읽으면
   * 한 줄짜리 덩어리라 잘린다. 그래서 받는 쪽(사람이든 AI든)이 «메모 없음» 으로 읽고 되돌려

   *

   * 주석이라 발표 화면에는 안 나오고, 상태가 원본이며 여기는 읽으라고 두는 사본이다.

     * 종전에는 order 만 돌아서, 메모를 달고 그 장을 지우면 «왜 지웠는지» 가 파일에서 사라졌다 —
     * 실측: 세 종류를 단 장을 지우니 헤더가 3건 → 1건이 되고 상태에는 셋 다 살아 있었다.
     * `edits` 는 원래부터 order 를 안 봤으니(아래) 두 축을 **«남아 있는 것은 센다»** 로 맞춘다.
     * 쪽번호는 못 붙인다 — 순서에 자리가 없는 장이라 신원으로 적는다. */
    const dead = new Set(d.deleted || []);
    for (const id of new Set([...Object.keys(d.notes || {}), ...Object.keys(d.pen || {})])) {

       * (50-textedit.js:89 는 값을 그대로 쓴다). 내보낼 때 마크업은 원문으로 되돌아가므로
       * (위 cleanClone) 이 줄이 없으면 «빼 달라» 는 요청이 **파일에서 흔적 없이 사라진다** —
       * 받는 쪽은 되살아난 원문을 보고 헤더에서 «0건 · 아래가 전부» 를 읽는다. 알 길이 없다.
       * 원문이 있었는지로 «지웠다» 와 «원래도 비어 있었다» 를 가른다. `originalOf` 는 부팅 때

  async function saveInPlace(opts) {

      // 00-util.js). 전부 덱으로 세면 유령 항목이 뜨고, 사용자가 그것을 '삭제'하면
      // 표시가 지워져 다음 로드에서 IDB 마이그레이션이 다시 돈다. 덱처럼 생긴 것만 센다.
      let d = null;

      buttons: [{ id: 'ok', label: '닫기', primary: true }],
    });
  }

  async function refreshUsage() {
    try {
      const u = await S.usage();

  function init() {

    UI.registerMenu('save', { order: 15, id: 'menu-deckname', label: () => { const n = S.data.name || ''; return 'HTML 다른 이름으로 저장… · ' + (n ? (n.length > 16 ? n.slice(0, 15) + '…' : n) : '(이름 없음)'); }, hint: '⌘⇧S', onClick: renameAndSave });
    UI.registerMenu('save', { order: 20, id: 'menu-save', label: () => (savedName() ? '저장 (제자리) · ' + savedName() : '저장 (원본 파일 선택)'), hint: '⌘S', when: fsSupported, onClick: () => saveInPlace() });
    UI.registerMenu('save', { order: 10, id: 'menu-export', label: LABEL, hint: fsSupported() ? '' : '⌘S', onClick: exportHtml });   // 사용자 요청: 저장 그룹 맨 위
    UI.registerMenu('save', { order: 40, id: 'menu-share', label: '수정본 공유…', when: canShare, onClick: shareHtml });
    UI.registerMenu('save', { order: 60, id: 'menu-reset', label: '초기화 (범위 선택)', onClick: resetDialog });
    UI.registerMenu('save', { order: 70, id: 'menu-usage', label: () => usageText, onClick: usageDialog });
    UI.registerMenu('save', { order: 80, id: 'menu-import-archive', label: () => '이전 버전(' + (S.archived ? S.archived.build : '') + ') 로컬 데이터 가져오기', when: () => !!S.archived, onClick: async () => {

      /* 세 갈래로 말한다. 종전에는 무엇이 일어났든 «가져오기 완료: N건» 이었고, 0건일 때

      if (!r.found) U.toast('이전 버전 데이터를 찾지 못했습니다 · 저장 공간이 부족해 보관되지 못했을 수 있습니다', 6000);

    UI.registerMenu('save', { order: 90, id: 'menu-saved', label: () => (S.data.updatedAt ? '자동 저장됨 · ' + new Date(S.data.updatedAt).toLocaleTimeString('ko-KR') : '자동 저장 대기'), onClick: () => { S.commit(); U.toast('저장했습니다'); } });

/* 96-handoff.js — 외부 전달본. 덱 밖 사람에게 주는 파일 하나를 만든다.
 *
 * 지금까지 완성된 덱을 주는 상대는 **덱을 만들 사람과 검토자**뿐이었고 둘 다 도구가 필요했다.
 * 고객사처럼 덱 밖 사람에게 줄 자리가 생기면서, 그 파일에 같이 실려 나가는 것이 문제가 된다:
 * 발표 대본 · 검토 메모 · 작업 로그 · 삭제한 슬라이드 목록이 `#deck-state` 하나에 다 있다.
 *
 * **`Deck.exporter.cleanClone()` 을 쓰면 안 된다.** 저쪽은 "텍스트 수정은 마크업이 아니라
 * 상태에 산다"는 계약대로 슬라이드 글자를 **원문으로 되돌리고** 고친 글자를 상태에 담는다.
 * 외부본은 그 상태를 버리므로, 그 위에 세우면 **글자가 옛날로 돌아간 덱**이 나간다.
 * 여기는 방향이 반대다 — 부팅이 끝난 DOM 에는 `60-agenda.apply()` 가 순서·삭제를,
 * `50-textedit.apply()` 가 수정을 이미 반영해 두었으니 **보이는 그대로**를 굽고 상태를 버린다.
 *
 * 같은 이유로 `exporter.stripToolChrome()` 만 쓰고 `stripMediaArtifacts()` 는 부르지 않는다.
 * 걷어내기는 *누가 다시 그리는가*로 갈린다: 도트·페이저는 `20-nav.js` 가 되살리고(여기도 싣는다),
 * 전환화면은 `90-media.js` 가 되살린다(여기는 안 싣는다). 한 벌로 묶여 있을 때 물렸다 —
 * 14쪽 전환화면 3장이 사라지고 남은 base 는 `cur` 이 떨어져 화면 밖에 서서 백지가 됐다.
 *
 * 뷰어를 새로 쓰지 않는다. `#deck-js` 를 **모듈 표식으로 잘라** 셋만 남긴다 —
 * `build.py` 가 모듈마다 `/* ==== 20-nav.js ==== *\/` 를 넣어 두는 것이 그 이음매다.
 * 배율(`fit()`)·도트·진행바·좌우 클릭 영역을 다시 구현하면 두 벌이 되고, 두 벌은 갈린다.
 * `30-keys.js` 의 도구 분기는 전부 `Deck.review &&` 같은 가드라 모듈이 없으면 저절로 통과한다.
 *
 * 전환화면 넘기기만은 예외로 **다시 쓴다**(BOOT 의 20줄). `90-media.js` 를 통째로 실을 수가
 * 없어서다: 그 모듈은 `Deck.state`(첨부 목록)와 도구 패널에 묶여 있어 상태 없이 못 돈다.
 * 애니메이션 뒷정리는 빼고 '다음 화면으로' 만 남긴 축소판이다.
 */
Deck.handoff = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state, X = Deck.exporter;

  const LABEL = '외부전달 HTML 내보내기';
  const KEEP = ['00-util.js', '20-nav.js', '30-keys.js'];
  const HINT = '← → 또는 Space · 전체화면은 오른쪽 위 로고';

  /* 무엇이 빠지는지 모른 채 외부로 나가는 파일을 만들게 두지 않는다.
   * 확인창의 이 표가 곧 계약이다 — 스펙(docs/…/2026-09-09-handoff-export-design.md)과 같은 표다. */
  const KEPT = ['슬라이드 전량 (지금 순서 · 지금 글자)', '본문 전환화면 (클릭하면 다음 화면)',
                '하단 내비 ‹ › · 도트 · 전체화면', '오른쪽 위 메뉴 → 전체화면',
                '← → Space Home End · 화면 좌우 클릭', '인쇄 (브라우저에서 PDF 로 저장)'];
  const DROPPED = ['발표자 뷰 · 타이머 · <b>발표 대본 전량</b>', '검토 메모 · 영역지정 · 텍스트 수정 · 구성 변경',
                   '엑셀 내보내기 / 가져오기', '오버뷰 · 스포트라이트 · 화면잠금',
                   '저장 · 내보내기 · 작업 로그 · 이전 버전 데이터'];

  /* `#deck-js` 를 모듈 단위로 자른다.
   * 표식이 사라지면(빌드 규칙이 바뀌면) 조용히 빈 뷰어를 내보내는 대신 **여기서 멈춘다** —
   * 슬라이드가 안 뜨는 파일이 외부로 나가는 것이 가장 나쁘다. */
  function viewerJs() {
    const tag = document.getElementById('deck-js');
    const src = (tag && tag.textContent) || '';
    const parts = src.split(/^\/\* ==== (.+?\.js) ==== \*\/$/m);
    const out = [];
    for (let i = 1; i < parts.length; i += 2) {
      if (KEEP.includes(parts[i])) out.push('/* ==== ' + parts[i] + ' ==== */' + parts[i + 1]);
    }
    if (out.length !== KEEP.length) {
      throw new Error('외부 전달본을 만들지 못했습니다 · 모듈 표식을 찾지 못했습니다 ('
        + out.length + '/' + KEEP.length + ')');
    }
    return out.join('\n');
  }

  /* 그려진 전환화면을 **첫 화면 기준으로 정규화해서** 굽는다.
   *
   * ①발표자가 3번째 화면을 보고 있었다고 그 상태로 나가면 안 된다 — 받는 사람은 1번부터 본다.
   * ②`cur` 과 인라인 transform 을 여기서 확정한다. CSS 기본값이 `translateX(100%)` 라
   *   둘 중 하나만 빠져도 화면 밖에 서서 백지가 된다.
   * ③사용자가 붙인 전환이미지는 `blob:` URL 이다 — 바이트가 IndexedDB 에 살아서 파일에
   *   실을 수 없다. 설계대로 여기서 뗀다. 덱에 실려 배포된 `.pano-hold` 이미지는
   *   `data:` URL 이라 그대로 나간다. */
  function bakeMedia(clone) {
    const dead = el => [...el.querySelectorAll('img')].some(i => /^blob:/i.test(i.getAttribute('src') || ''));
    clone.querySelectorAll('.nz-screen,.ss-item').forEach(el => { if (dead(el)) el.remove(); });

    clone.querySelectorAll('.nz-display').forEach(d => {
      const sc = [...d.querySelectorAll('.nz-screen')];
      d.dataset.n = sc.length;
      d.dataset.di = '0';
      d.classList.toggle('single', sc.length <= 1);
      sc.forEach((el, i) => {
        el.classList.toggle('cur', i === 0);
        el.style.transform = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      });
      const c = d.querySelector('.nz-dcount'); if (c) c.textContent = '1 / ' + sc.length;
    });

    clone.querySelectorAll('.pano-overlay').forEach(ov => {
      const items = [...ov.querySelectorAll('.ss-item')];
      if (!items.length) { ov.remove(); return; }          // 사용자 첨부뿐이었으면 오버레이째 뗀다
      ov.dataset.i = '0';
      const track = ov.querySelector('.ss-track'); if (track) track.style.transform = 'translateX(0)';
      const dots = ov.querySelector('.ss-dots');
      if (dots) {
        dots.innerHTML = '';
        items.forEach((_, i) => {
          const b = document.createElement('i');
          b.dataset.i = String(i);
          if (i === 0) b.className = 'on';
          dots.append(b);

   * 전환화면 넘기기는 `20-nav.js` 의 좌우 클릭과 부딪히지 않는다 — 그쪽이 `.nz-display`
   * 와 `.slideshow` 안의 클릭을 이미 비켜 준다. */
  const BOOT = [
    '(function () {',
    '  function nzGo(d, j) {',
    '    var sc = [].slice.call(d.querySelectorAll(".nz-screen")), n = sc.length;',
    '    if (n < 2) return;',
    '    j = ((j % n) + n) % n;',
    '    sc.forEach(function (el, k) {',
    '      el.classList.toggle("cur", k === j);',
    '      el.style.transform = k === j ? "translateX(0)" : "translateX(100%)";',

    '    d.dataset.di = j;',
    '    var c = d.querySelector(".nz-dcount"); if (c) c.textContent = (j + 1) + " / " + n;',
    '  }',
    '  function ovGo(ov, j) {',
    '    var n = ov.querySelectorAll(".ss-item").length; if (n < 2) return;',
    '    j = ((j % n) + n) % n;',
    '    var t = ov.querySelector(".ss-track"); if (t) t.style.transform = "translateX(" + (-j * 100) + "%)";',
    '    ov.querySelectorAll(".ss-dots i").forEach(function (b, k) { b.classList.toggle("on", k === j); });',
    '    ov.dataset.i = j;',
    '    var c = ov.querySelector(".ss-count"); if (c) c.textContent = (j + 1) + " / " + n;',
    '  }',
    '  document.addEventListener("click", function (e) {',
    '    var t = e.target;',
    '    if (!t || !t.closest) return;',
    '    var d = t.closest(".nz-display");',
    '    if (d) { e.stopPropagation(); nzGo(d, +(d.dataset.di || 0) + 1); return; }',
    '    var ov = t.closest(".pano-overlay");',
    '    if (ov) {',
    '      e.stopPropagation();',
    '      var dot = t.closest(".ss-dots i");',
    '      ovGo(ov, dot ? +dot.dataset.i : +(ov.dataset.i || 0) + 1);',
    '    }',
    '  }, true);',
    '  var logo = document.getElementById("deck-menu-toggle");',
    '  if (logo) logo.addEventListener("click", function () { Deck.nav.toggleFs(); });',
    '  Deck.ui.setMode("present");',
    '  Deck.nav.init();',
    '  Deck.nav.show(0);',
    '  window.__deckReady = true;',
    '})();',
  ].join('\n');

  function buildHtml() {

    logo.textContent = '메뉴';
