  function download(html) {
    const name = X.filename({ tag: '외부전달', bump: false });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return name;
  }

  const list = (items, color) => '<ul style="margin:4px 0 0;padding-left:18px;color:' + color + '">'
    + items.map(t => '<li style="margin:2px 0">' + t + '</li>').join('') + '</ul>';

  async function exportHandoff() {
    UI.menu.close();
    const ok = await UI.confirm(LABEL,
      '<p>덱 밖 사람에게 줄 파일을 만듭니다. <b>검토 도구가 없는 보기 전용</b>이라 받은 사람은 '
      + '고칠 수도, 다시 내보낼 수도 없습니다.</p>'
      + '<div style="display:flex;gap:16px;font-size:12px;line-height:1.5">'
      + '<div style="flex:1"><b>남습니다</b>' + list(KEPT, '#2f6b4f') + '</div>'
      + '<div style="flex:1"><b>빠집니다</b>' + list(DROPPED, '#8a3b3b') + '</div>'
      + '</div>'
      + '<p class="muted">단계 노출은 전부 펼친 상태로 고정됩니다. 본문에 실린 전환화면은 그대로 나가지만, '
      + '검토 중 <b>직접 첨부한</b> 전환이미지·참고이미지는 브라우저 안에만 있어 나가지 않습니다.</p>',
      '외부 전달본 만들기');
    if (!ok) return null;
    let name;
    try { name = download(buildHtml()); }
    catch (e) { U.toast((e && e.message) || '외부 전달본을 만들지 못했습니다', 6000); return null; }
    S.commit('외부 전달본 내보내기: ' + name);
    U.toast('외부 전달본을 저장했습니다 · ' + name, 4000);
    return name;
  }

  function init() {
    // '수정본 HTML 내보내기'(order 10) 바로 밑 (사용자 결정 2026-09-09)
    UI.registerMenu('save', { order: 15, id: 'menu-handoff', label: LABEL, onClick: exportHandoff });
  }

  return { init, buildHtml, exportHandoff, LABEL, KEEP };
})();

/* ==== 97-printhelp.js ==== */
/* 97-printhelp.js — PDF 로 저장하기 전 설정 안내 (후보 25번).
 *
 * 사용자 신고(2026-09-11): *"PDF 생성해도 하단에 여백이 존재한다. 이미지는 전체화면이야."*
 * 실측(사용자 산출물 `DomMint — 새 보고자료.pdf`): **MediaBox 842×595pt = A4 가로(비율 1.415)**.
 * 슬라이드는 16:9(1.778) 이므로 폭을 맞추면 **높이의 79.6% 만 쓰고 아래 20.4% 가 남는다** —
 * 잉크 실측 79% / 20% 와 일치했다. *"이미지는 전체화면"* 은 **폭이 꽉 찬** 것을 말한 것이다.
 *
 * **코드로 못 고친다.** `print.css` 의 `@page{size:1280px 720px; margin:0}` 은 이미 옳게 있고
 * 인쇄 대화상자가 그것을 덮는다. 브라우저는 스크립트로 용지를 정할 수 없다.
 * 그래서 **도구가 말해 준다** — #22 «눌러 보고 실패하는 항목을 두지 않는다» 의 반대편,
 * **성공하는 법을 알려 주는 자리**다.
 *
 * 문구는 **되는 척하지 않는다**: 이 맥에 맞춤 용지가 하나도 없는 것을 확인했고(실측),
 * 맞춤을 못 만드는 경우의 차선(A4 가로)과 **그때 남는 20%** 를 함께 적는다.
 * «용지 탓 20%» 와 «그보다 더 남는 것은 슬라이드 배분» 의 구분도 적는다 —
 * 그게 없으면 용지를 고치고도 다른 장에서 다시 «아직 남네» 가 된다.
 *
 * `95-export.js`·`99-boot.js` 를 건드리지 않으려고 **셸 모듈처럼 스스로 산다**
 * (같은 시각 다른 작업이 그 두 파일을 쥐고 있었다).
 */
Deck.printhelp = (() => {
  const U = Deck.util, UI = Deck.ui;

  /* 1280×720 CSS px = 960×540pt = 33.87×19.05 cm. 맞춤 용지를 만들 때 넣을 값이다. */
  const CM = '33.87 × 19.05 cm';

  async function open() {
    const r = await UI.dialog({
      title: 'PDF 로 저장',
      body: b => {
        b.append(U.el('p', { text: '이 덱은 16:9(1280×720)입니다. 인쇄 대화상자에서 아래를 맞추면 지면에 꽉 찹니다.' }));
        const ol = U.el('ol', { class: 'ph-steps' }, [
          U.el('li', { text: '대상 — PDF로 저장' }),
          U.el('li', {}, [U.el('b', { text: '용지 크기 — 맞춤 ' + CM }),
                          U.el('div', { class: 'muted', text: '목록에 없으면 시스템 인쇄 대화상자의 «사용자 설정 크기 관리…» 에서 만들 수 있습니다.' })]),
          U.el('li', {}, [U.el('b', { text: '여백 — 없음' })]),
          U.el('li', {}, [U.el('b', { text: '옵션 — 배경 그래픽 켜기' }),
                          U.el('div', { class: 'muted', text: '끄면 표지·배지 색이 흰 종이로 나옵니다.' })]),
        ]);
        b.append(ol);
        b.append(U.el('p', { class: 'muted',
          text: '맞춤 용지를 못 만들면 A4 가로가 차선입니다 — 폭은 꽉 차고 아래가 약 20% 남습니다(실측).' }));
        b.append(U.el('p', { class: 'muted',
          text: '그보다 더 남는 여백은 용지가 아니라 그 슬라이드의 세로 배분입니다. 용지를 고쳐도 남습니다.' }));
      },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '인쇄 창 열기', primary: true }],
    });
    if (r !== 'ok') return false;
    setTimeout(() => window.print(), 60);   // 다이얼로그가 닫힌 뒤에 연다
    return true;
  }

  const init = () => {
    if (!Deck.ui || !Deck.ui.registerMenu) return;
    Deck.ui.registerMenu('save', { id: 'menu-printhelp', order: 45, label: 'PDF 로 저장…', onClick: open });
  };

  if (window.__deckReady) init();
  else document.addEventListener('deck:ready', init, { once: true });

  return { init, open, CM };
})();

/* ==== 99-boot.js ==== */
/* 99-boot.js — boot sequence. Modules are optional so the deck stays usable while modules are added. */
(async () => {
  const D = window.Deck;
  try {
    await D.state.load();
    if (D.structure && D.structure.apply) D.structure.apply();
    if (D.textedit && D.textedit.apply) D.textedit.apply();
    if (D.textstyle && D.textstyle.apply) D.textstyle.apply();   // 텍스트가 자리를 잡은 뒤 서식을 입힌다
    if (D.nav && D.nav.init) D.nav.init();
    if (D.ui && D.ui.ensure) D.ui.ensure();
    for (const m of ['textedit', 'textstyle', 'structure', 'review', 'versions', 'deeplink', 'pen', 'media', 'exporter', 'handoff', 'presenter', 'screenlock', 'overview', 'spotlight']) if (D[m] && D[m].init) D[m].init();
    if (D.pen && D.pen.renderAll) D.pen.renderAll();
    if (D.media && D.media.renderAll) D.media.renderAll();
    // 딥링크(#/7)가 있으면 그 장으로 연다 — 새로고침 위치 복원(#20)
    if (D.nav && D.nav.show) D.nav.show(D.deeplink ? D.deeplink.initial() : 0);
    if (D.exporter && D.exporter.retitle) D.exporter.retitle();            // 상태 복원 후(48번)
    /* 무엇이 몇 건 보관됐는지 말한다. '메모·펜' 이라고만 알려서, 텍스트 수정이 사라진 것을
     * 사용자가 '내가 고친 게 원복됐다'로 겪었다(2026-09-08). 종류와 건수를 밝히고 오래 띄운다. */
    /* 보관 자체가 실패했으면 **그것부터** 말한다 — 아래 «보관되었습니다» 안내보다 먼저다.
     * 저장 공간이 없어 잃은 것을 «보관됐다» 고 알리면 정반대를 말하는 셈이다. */
    if (D.state.archiveDropped) {
      D.util.toast('저장 공간이 부족해 이전 버전 데이터를 보관하지 못했습니다 · 저장 메뉴 › 저장소 사용량에서 정리해 주세요', 8000);
    }
    /* 갈라진 작업은 **알리기만 한다** — 가져오기 경로는 두지 않는다(같은 빌드라 공유 메모가 중복된다, P2). */
    const F = D.state.forked;
    if (F) {
      D.util.toast(F.dropped
        ? '더 새로 저장된 파일을 엽니다 · 이 브라우저의 저장 안 된 작업 ' + F.n + '건은 저장 공간이 부족해 보관하지 못했습니다'
        : '더 새로 저장된 파일을 엽니다 · 이 브라우저의 저장 안 된 작업 ' + F.n + '건은 따로 보관했습니다', 8000);
    }
    const A = D.state.archived;
    if (A && A.total && !D.state.archiveDropped) {
      const parts = [];
      if (A.count.edits) parts.push('텍스트 수정 ' + A.count.edits + '건');
      if (A.count.notes) parts.push('메모 ' + A.count.notes + '건');
      if (A.count.pen) parts.push('영역지정 ' + A.count.pen + '건');
      D.util.toast('이전 버전(' + A.build + ')의 ' + parts.join(' · ') + '이 보관되었습니다 · 저장 메뉴 › 이전 버전 로컬 데이터 가져오기', 7000);
    }
  } catch (e) {
    console.error('deck boot failed', e);
  }
  window.__deckReady = true;
  D.util.emit('deck:ready');
  // 온라인 전제. 못 받았으면 알린다 — 조용히 다른 글꼴로 뜨면 원인을 찾을 수 없다.
  D.util.checkWebfont('Pretendard');
})();

</script>

/* ==== shell/import.js ==== */
/* shell/import.js — 흡수: 남의 HTML 을 이 덱의 슬라이드로 만든다.
 *
 * 셸 전용이다(설계 §9 앞문 분리). build.py 가 --shell 일 때만 싣고,
 * <script id="import-js" data-ui> 라서 cleanClone() 이 내보내기에서 지운다 —
 * 검토자가 받는 덱에는 이 코드가 없다.
 *
 * CSS 를 규칙 단위로 파싱해 가르지 않는다. v43 사고(deckmgr-css 블록 제외 →
 * 슬라이드 규칙 71개 누락 → "회귀 42건 green 인데 화면 깨짐")가 정확히 그 방식이었다.
 * 대신 @layer deck { @scope (#deck) { …원문 그대로… } } 로 감싼다. 실측(2026-09-08):
 * *·body·button 같은 광역 규칙이 도구 UI 로 새지 않는다. 읽지도 고치지도 않으니
 * 빠뜨릴 것이 없다. 유일한 변형은 :root → :scope 치환 1건이다(@scope 는 조상을 못 잡는다).
 */
Deck.importer = (() => {
  const U = Deck.util;
  const W = 1280, H = 720, TOL = 0.05;

  /* ---------- CSS ---------- */
  /* 이미 @layer deck { @scope (#deck) { … } } 로 감싼 CSS 를 벗긴다.
   * 다시 감싸면 @scope 안에 @scope 가 중첩되는데, 안쪽 스코프 루트는 바깥 스코프의
   * **자손**이어야 매치된다 — #deck 안에 #deck 은 없으므로 안쪽 블록이 통째로 죽는다.
   * 실측(2026-09-08): 3연쇄에서 초록 → 검정, deck-css 58B → 33KB → 66KB.
   * DomMint 파일 재흡수는 곁가지가 아니라 주경로다(kind === 'dommint'). */
  /* ⚠ 이 정규식은 아래 scopeCss 가 **찍는 모양과 반드시 짝**이어야 한다. 한 번 어긋나면
   * 껍질을 못 벗기고 그 위에 다시 감싸 @scope 안에 @scope 가 된다 = 치명2(안쪽이 통째로 죽는다).
   * `to (…)`(범위 제한)는 2026-09-10 에 더해졌고 **없는 옛 파일도 그대로 벗겨야** 하므로 선택이다. */
  const unwrapScoped = css => {
    const m = /^\s*@layer\s+deck\s*\{\s*@scope\s*\([^)]*\)(?:\s*to\s*\([^)]*\))?\s*\{([\s\S]*)\}\s*\}\s*$/.exec(css);
    return m ? m[1] : css;
  };

  /* 보이는 것을 정하는 속성에서 흡수 CSS 의 !important 를 걷어낸다.
   *
   * @layer 는 **normal 선언에서만** 뒤 레이어가 이긴다. !important 는 순서가 **역전**되어
   * 앞 레이어(deck)가 뒤 레이어(tools)를 이긴다 — 그래서 흡수한 `.slide{display:none!important}`
   * 가 표시 계약을 이기고 덱이 백지로 뜬다(실측 재현: display:none, 0×0).
   * Task 1 이 이것을 "알려진 한계"로 적고 *"실제 덱이 그럴 이유가 없다"* 고 넘겼는데
   * 손으로 만든 HTML 덱에서 흔한 패턴이었다.
   *
   * 원문을 파싱하지 않는다는 원칙은 지킨다 — :root → :scope 와 같은 **표적 치환**이고,
   * 대상은 도구가 소유한 속성뿐이다. 색·글꼴 같은 덱의 취향은 건드리지 않는다.
   *
   * zoom·scale·translate·rotate 도 목록에 있다 — `body{zoom:.2}` 가 `:scope`(=#deck)로
   * 치환되면 1280×720 무대가 256×144 로 줄었다(실측). 배율은 상속 속성이 아니라 요소 자신의
   * 기하라 '문서 기본값을 살린다'는 치환의 의도 밖이다. stage.css 가 넷을 명시해 normal
   * 선언을 이기고, 여기서 !important 를 걷어 그 승리를 지킨다 — 두 겹이 있어야 막힌다. */
  const CONTRACT_BANG = /(^|[;{])(\s*(?:display|visibility|position|inset|top|right|bottom|left|width|height|z-index|opacity|transform|zoom|scale|translate|rotate)\s*:[^;{}]*?)!\s*important/gi;
  const dropContractBang = css => css.replace(CONTRACT_BANG, '$1$2');

  /* 흡수 회차 마커. 상태 필드를 늘리지 않고 **파일 안에** 회차를 남긴다 —
   * 계약 4곳(schema·seed·blank·shell_seed)을 안 건드리고, 상태가 유실돼도 지우기가 동작한다.
   * CSS 조각은 주석 한 쌍으로 감싸고 슬라이드에는 data-import* 를 붙인다. */
  const MARK = id => '/* dommint:import ' + id + ' */';
  const MARK_END = id => '/* /dommint:import ' + id + ' */';
  // id 문자군은 MARK() 가 찍는 것과 반드시 같아야 한다. 한 번 어긋나 치명2 가 재현됐다:

  // 그러면 unwrapScoped 의 `^\s*@layer` 앵커가 빗나가 @scope 안에 @scope 가 된다.
  const MARK_ANY = /[ \t]*\/\*\s*\/?dommint:import\s+[A-Za-z0-9_-]+\s*\*\/[ \t]*\r?\n?/g;

  /* 실려 온 마커를 벗긴다. DomMint 덱 재흡수는 주경로이고(kind === 'dommint'),
   * 안 벗기면 **남의 파일의 회차**가 이 파일의 목록에 앉는다 — 이 파일에서는 지울 수 없는
   * 항목이라 «눌러 보고 실패하는 항목»이 된다(#22).
   *
   * ⚠ 반드시 unwrapScoped **앞**이다. 마커는 @layer 래퍼 **바깥**에 있는데
   * unwrapScoped 의 정규식은 `^\s*@layer` 로 시작을 앵커한다 — 주석이 앞에 남아 있으면
   * 매치가 실패해 껍질을 못 벗기고, 그 상태로 다시 감싸면 @scope 안에 @scope 가 되어
   * 안쪽이 통째로 죽는다(치명2 · 실측 초록→검정 33KB→66KB).
   *
   * ⚠ 새 마커로 감싸는 것은 여기가 아니라 commit() 이다. 미리보기(.ip-stage)에는 회차
   * 개념이 없고, 한 함수에 벗기기와 감싸기가 같이 있으면 순서가 뒤집힐 때 방금 붙인
   * 마커를 그 자리에서 지운다. */
  const stripMarks = css => String(css).replace(MARK_ANY, '');

  const scopeCss = (css, root) => {
    if (!css || !css.trim()) return '';
    css = dropContractBang(unwrapScoped(stripMarks(css)));
    // @scope (#deck) 는 #deck 과 그 아래만 잡는다. :root·html·body 는 전부 조상이라
    // 그대로 두면 **아무것도 매치하지 않는다** — 문서 수준 타이포·배경이 통째로 죽는다.
    // 실측(2026-09-08): 사업보고 v07 의 body{font-family:Pretendard…} 가 죽어
    // 흡수한 덱이 Times(브라우저 기본)로 렌더됐다. :root 만 고치고 body 를 빠뜨린 결함이었다.
    // :scope(=#deck)에 걸면 그 아래로 상속되므로 '문서 기본값'이라는 원래 의도가 보존된다.
    const fixed = css.replace(/(^|[\s,{}>+~])(?::root|html|body)(?=[\s,{:.\[>+~])/g, '$1:scope');
    // 뿌리를 바꿀 수 있어야 한다. 미리보기 썸네일은 다이얼로그 안이라 #deck 밖에 있는데,
    // 거기에 흡수 CSS 가 안 걸리면 미리보기가 '가져오면 이렇게 된다'를 못 보여 준다.
    /* **범위 제한 `to ([data-ui])`** — 도구 크롬이 #deck **안에** 사는 것이 있다(오버뷰의
     * 섹션 띠 `.ov-band` 는 `#deck > .ov-band` 다). @layer 만으로는 못 막는다: 덱이
     * `!important` 를 쓰면 **레이어 순서가 뒤집혀** 앞 레이어(deck)가 tools 를 이긴다.
     * 실측(2026-09-10): `button{padding:40px!important}` 을 가진 덱을 흡수하니 오버뷰의
     * «이름 바꾸기» 버튼이 `2px 10px` → **`40px`** 이 되고 글자·배경까지 덱 색으로 물들었다.
     * `dropContractBang` 은 기하·표시 속성만 걷어내므로 글꼴·색·padding 은 그대로 온다.
     * 3엔진 실측 확인(Chromium 148 · Firefox · WebKit): 덱 글자는 적용되고 [data-ui] 아래는 막힌다. */
    return '@layer deck {\n@scope (' + (root || '#deck') + ') to ([data-ui]) {\n' + fixed + '\n}\n}\n';
  };

  /* ---------- data-key (extract_v42.py assignKeys 와 같은 규칙) ---------- */
  const assignKeys = (sec, sid) => {
    let n = 0;
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_ELEMENT);
    const list = []; let node;
    while ((node = walker.nextNode())) list.push(node);
    for (const el of list) {
      if (el.closest('script,style,svg,.uc-nav')) continue;
      const own = [...el.childNodes].some(c => c.nodeType === 3 && c.nodeValue.trim());
      if (own) { n++; el.setAttribute('data-key', sid + ':t' + n); }
    }
    return n;
  };

  /* ---------- 감지 ---------- */
  const isSlideSized = el => {
    const w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
    if (!w || !h) return el.matches('.slide,[data-slide-id],[data-slide]');
    return Math.abs(w - W) / W <= TOL && Math.abs(h - H) / H <= TOL;
  };
  const findSlides = doc => {
    for (const sel of ['#deck > section.slide', '.slide', '[data-slide]', 'section', '#deck > *']) {
      const found = [...doc.querySelectorAll(sel)];
      if (found.length && found.some(isSlideSized)) return found;
    }
    return [];
  };

  /* ---------- slideId 정규화 ----------
   * 계약(schema.json:94)은 slideId 가 ^slide-[A-Za-z0-9-]+$ 여야 한다고 못박고 있다.
   * 남의 HTML 의 id 는 's1' 이나 '표지 1' 처럼 뭐든 될 수 있으므로 그대로 쓰면
   * unbuild 가 검토본을 거부한다 — 흡수한 덱이 파이프라인에 못 들어간다.
   * 이미 규격에 맞는 id(=DomMint 덱 재흡수)는 건드리지 않는다. 그래야 그 덱의
   * 메모·펜·텍스트수정이 붙어 있던 자리를 잃지 않는다. */
  const SLIDE_ID = /^slide-[A-Za-z0-9-]+$/;
  /* 원본에 id 가 없으면 자리 번호로 짓는다 — 난수가 아니라 결정적이어야 한다.
   * 같은 원본을 두 번 흡수하면 같은 id 가 나와야 ①메모·펜이 붙어 있던 자리를 찾고
   * ②mint.py 와 브라우저 경로의 산출을 바이트로 대조할 수 있다(Task 7). */
  const normalizeId = (raw, seen, i) => {
    let id = SLIDE_ID.test(raw || '') ? raw
      : 'slide-' + (String(raw || '').replace(/[^A-Za-z0-9-]+/g, '-').replace(/^-+|-+$/g, '')
                    || 'imp-' + String(i + 1).padStart(2, '0'));
    // 서로 다른 원본 id 가 같은 값으로 접히면(예: 'a b' 와 'a-b') order 에 중복이 생겨
    // 계약이 거부한다. 뒤에 번호를 붙여 가른다.
    let out = id, dup = 2;
    while (seen.has(out)) out = id + '-' + (dup++);
    seen.add(out);
    return out;
  };

  /* 흡수는 **CSS 와 정적 DOM 만** 가져온다. 원본이 로드 시점 JS 로 DOM 을 만들고 있으면
   * 그 요소는 따라오지 않는데 CSS 는 그대로 실려 **아무 에러 없이** 통과한다 —
   * 이 저장소가 세 번째 겪는 «green 인데 화면이 깨졌다» 다.
   * 실측(2026-09-10 고객 A v19): .slide 의 자식을 <div class="sheet"> 로 감싸는
   * 로드 스크립트가 따라오지 않아 14장 전부 패딩 0 · flex 아님이 됐다.
   *
   * **CSS 쪽을 보지 않는 이유**: «규칙은 있는데 매칭 0개인 클래스» 로 재 봤더니 같은 덱에서
   * 29개가 나왔고 그중 28개는 그냥 **죽은 CSS** 였다(실측). 신호가 잡음에 묻힌다 —
   * 그러면 아무도 경고를 안 본다. 스크립트가 붙이는 클래스만 보면 정확히 .sheet 하나다.
   * 헤드리스로 원본을 여는 것보다 싸다. */
  const scriptBuiltClasses = (html, slides) => {
    const used = new Set();
    const add = el => String(el.className || '').split(/\s+/).forEach(c => { if (c) used.add(c); });
    slides.forEach(s => { add(s); s.querySelectorAll('[class]').forEach(add); });

    const src = [...String(html || '').matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
      .map(m => m[1]).join('\n');
    // `.className = '…'` 만 본다. **만드는 것**과 **켜는 것**을 가르는 선이다 —
    // classList.add 는 이미 있는 요소의 상태 클래스라 잡음이 된다. 실측(덱 5종):
    //   .className= 만 → 1·1·2·2·7건(전부 진짜 JS 생성)
    //   + classList.add → 1·5·2·3·12건 · + 문자열 class= → 1·2·2·74·31건
    const cand = new Set();
    for (const m of src.matchAll(/\.className\s*=\s*['"`]([^'"`]*)['"`]/g))
      String(m[1]).split(/\s+/).forEach(c => { if (/^-?[_a-zA-Z][\w-]*$/.test(c)) cand.add(c); });

    return [...cand].filter(c => !used.has(c)).sort();
  };

  /* ---------- 일반 문서 분할 ---------- */
  const splitDocument = doc => {
    const body = doc.body;
    const out = []; let cur = null;
    for (const node of [...body.children]) {
      if (/^H[12]$/.test(node.tagName) || !cur) {
        cur = doc.createElement('section');
        cur.className = 'slide';
        out.push(cur);
      }
      cur.append(node.cloneNode(true));
    }
    return out.filter(s => s.textContent.trim());
  };

  /* 실어 오는 작성자 내용의 모양을 계약(schema.json)에 맞춰 거른다.
   *
   * carry 는 **남의 파일에서 온 상태**다. 아무거나 올 수 있는데 지금까지 검증 없이
   * S.data 로 들어갔고, 어긋나면 세 곳에서 각각 다르게 터진다:
   *   unbuild 가 검토본을 거부(파이프라인 진입 불가) · 85-sheetio 의 .match() TypeError ·
   *   발표자 뷰 메모가 [object Object].
   * 계약을 지키는 것은 **흡수 경계의 일**이다. 하나가 틀렸다고 전부 버리지 않고,
   * 버린 것은 경고에 남긴다 — 조용히 사라지는 것이 이 프로젝트가 반복해 온 실패다.
   *
   * 모양은 schema.json 과 짝이다. 스키마를 고치면 여기도 고친다. */
  const HEX = v => typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v);
  const MULT = v => typeof v === 'number' && v >= 0.6 && v <= 2.0;
  const SPAN = r => r && typeof r === 'object' && Number.isInteger(r.from) && Number.isInteger(r.to)
                 && r.to > r.from && r.from >= 0
                 && (r.text == null || typeof r.text === 'string')
                 && (r.size == null || MULT(r.size)) && (r.color == null || HEX(r.color));
  const CARRY_SHAPE = {
    edits: { label: '텍스트 수정', ok: v => typeof v === 'string' },
    chapters: { label: '섹션명', ok: v => typeof v === 'string' },
    speaker: { label: '발표 메모', ok: v => typeof v === 'string' },
    fragments: { label: '단계 노출', ok: v => Array.isArray(v) },
    /* 🔴 **서식은 글자와 같이 간다.** 종전에는 짝이 갈려 있었다 — `edits`(글자 고침)와
     * `speaker`(대본 글자)는 따라오는데 **그 글자의 서식**인 `styles`·`speakerMarks` 는 안 왔다.
     * 그래서 재흡수하면 «내가 쓴 것이 반만 온다»: 글자는 그대로인데 색·크기만 사라진다
     * (실측 2026-09-11: 파일에는 `"runs"` 가 멀쩡히 실려 있는데 흡수가 그 필드를 안 가져왔다.
     *  직접 열면 보이고 재흡수에서만 빠지는 이유가 이것이다).
     * `notes`·`pen`·`anchors`·`media` 는 **검토 흔적이라 계속 두고 온다** — 그건 의도다. */
    styles: { label: '글자 서식', ok: v => v && typeof v === 'object' && !Array.isArray(v)
                 && (v.size == null || MULT(v.size)) && (v.color == null || HEX(v.color))
                 && (v.align == null || ['left', 'center', 'right'].includes(v.align))
                 && (v.runs == null || (Array.isArray(v.runs) && v.runs.every(SPAN))) },
    speakerMarks: { label: '대본 서식', ok: v => Array.isArray(v)
                 && v.every(m => SPAN(m) && typeof m.text === 'string' && (m.color || m.size != null)) },
  };
  const sanitizeCarry = (E, warnings) => {
    const out = {};
    for (const [key, spec] of Object.entries(CARRY_SHAPE)) {
      const src = E[key];
      out[key] = {};
      if (!src || typeof src !== 'object' || Array.isArray(src)) continue;
      let dropped = 0;
      for (const [k, v] of Object.entries(src)) {
        if (spec.ok(v)) out[key][k] = v; else dropped++;
      }
      if (dropped) warnings.push(spec.label + ' ' + dropped + '건은 모양이 계약과 달라 가져오지 않았습니다(' + key + ').');
    }
    return out;
  };

  /* ---------- parse ---------- */
  const parse = html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const warnings = [];
    // 상태를 먼저 읽고 나서 스크립트를 지운다. 순서가 바뀌면 #deck-state 도 함께 지워져
    // kind==='dommint' 가 영영 성립하지 않는다 — 그러면 삭제·순서를 존중할 길이 없다.
    const stateText = (doc.getElementById('deck-state') || {}).textContent || null;
    // DOMParser 는 스크립트를 실행하지 않는다. 그래도 결과물에 남기지 않는다.
    doc.querySelectorAll('script').forEach(s => s.remove());

    // 도구 계층의 스타일시트는 흡수 대상이 아니다. DomMint 파일을 재흡수할 때
    // 모두 긁어오면 #ui-css·#layer-order 가 deck 레이어로 빨려 들어가 매 왕복마다
    // 33KB 씩 불어나고 계층 분리가 흡수 경계에서 새어 나간다(실측 재현).
    const TOOL_STYLES = new Set(['ui-css', 'layer-order', 'import-js']);
    /* 껍질은 **합치기 전에, 조각마다** 벗긴다.
     *
     * `unwrapScoped` 는 `^…$` 로 문자열 전체를 앵커한다(:26) — scopeCss 가 찍는 모양과
     * 짝이어야 하기 때문이다. 그런데 여기서 먼저 `join` 해 버리면 그 문자열은 더 이상
     * 한 덩어리의 껍질이 아니다. deck-css 뒤에 style 이 하나라도 더 있으면 끝이
     * `}\n}\n` 가 아니게 되어 **끝 앵커가 죽고**, 껍질을 못 벗긴 채 scopeCss 가 다시
     * 감싸 `@scope` 안에 `@scope` 가 된다 = 안쪽이 통째로 죽는다(치명2).
     *
     * 실측(2026-09-16 · 고객 A v25): style 넷 중 흡수 대상은 deck-css(36,901자)와
     * 손으로 덧댄 `#fix-260916`(643자·자간 패치) 둘. 단독이면 unwrapScoped YES,
     * 합치면 NO. 표지의 `.cover .cbg` 가 absolute → **static** 이 되어 배경이 제 고유
     * 크기(900×600)로 줄고 `.cin` 이 그 아래로 흘렀다(사용자 신고 «배치가 풀린다»).
     *
     * 화이트리스트를 늘려 막지 않는다 — 그건 이 파일만 막는다. 덱에 style 을 하나만
     * 더 붙이면 다음 파일에서 그대로 재발한다. 벗기는 단위를 맞추는 것이 답이다.
     *
     * scopeCss 가 합친 결과에 stripMarks·unwrapScoped 를 한 번 더 돌리는 것은 그대로
     * 둔다. 여기를 안 거치는 호출처(미리보기)가 있고, 이미 벗겨진 문자열에는 둘 다
     * 아무 일도 하지 않는다. */
    const css = [...doc.querySelectorAll('style')]
      .filter(el => !TOOL_STYLES.has(el.id))
      .map(el => unwrapScoped(stripMarks(el.textContent)))
      .join('\n\n');
    /* 링크된 CSS 는 흡수되지 않는다 — 우리가 받은 것은 HTML 텍스트뿐이고 DOMParser 는 하위 자원을
     * 가져오지 않는다. 브라우저가 못 읽어서가 아니다: 원본을 직접 열면 file:// 에서도 옆 파일이든
     * https 든 멀쩡히 적용된다(실측). 그러니 문구도 «읽을 수 없다» 가 아니라 «안 싣는다» 여야 한다.
     *
     * 그리고 **도구가 이미 들고 있는 링크는 빠지는 것이 아니다.** DomMint 로 만든 덱은 전부
     * Pretendard CDN 링크를 달고 있고 그것은 셸에도 같은 href 로 들어 있다 — 종전 조건은
     * `link[rel~=stylesheet]` 가 하나라도 있으면 경고했으므로 **우리 덱을 흡수할 때마다 오탐**이었다. */
    const ownHrefs = new Set([...document.querySelectorAll('link[rel~="stylesheet"]')].map(l => l.getAttribute('href')));
    const dropped = [...doc.querySelectorAll('link[rel~="stylesheet"]')]
      .map(l => (l.getAttribute('href') || '').trim())
      .filter(h => h && !ownHrefs.has(h));
    if (dropped.length) {
      // 무엇이 빠지는지 적는다 — 이름이 없으면 손쓸 수가 없다. 처방까지 적는다(25번 기준).
      warnings.push('링크된 스타일시트는 함께 흡수되지 않습니다(' + dropped.slice(0, 3).join(', ')
        + (dropped.length > 3 ? ' 외 ' + (dropped.length - 3) + '개' : '') + '). '
        + '그 CSS 를 원본 HTML 안에 <style> 로 넣고 저장한 뒤 다시 가져오면 그대로 반영됩니다.');
    }
    if (/@page\b/.test(css)) {
      warnings.push('흡수한 CSS 의 @page 규칙은 무시됩니다 — 인쇄 규격은 DomMint 의 print.css 가 정합니다.');
    }
    [...doc.querySelectorAll('img[src]')].forEach(img => {
      const src = img.getAttribute('src') || '';
      if (src && !/^(data:|https?:)/i.test(src)) warnings.push('외부 경로 이미지: ' + src);
    });

    let kind = 'document', found = findSlides(doc);
    if (stateText && found.length) kind = 'dommint';
    else if (found.length) kind = 'slides';
    else found = splitDocument(doc);

    // DomMint 덱을 흡수할 때는 '지금 화면에 보이는 것'을 가져와야 한다.
    // 삭제는 마크업이 아니라 상태(deleted)에 있고 순서도 상태(order)에 있다 —
    // 마크업만 읽으면 삭제한 장이 되살아나고 순서도 원본과 달라진다.
    // 실측(2026-09-08): 마크업 36장 · order 19장 · deleted 17장인 덱이 36장으로 흡수됐다.
    let carry = null;
    if (kind === 'dommint') {
      let E = null;
      try { E = JSON.parse(stateText); } catch (e) { /* 못 읽으면 마크업대로 간다 */ }
      if (E) {
        const byId = new Map(found.map(el => [el.dataset && el.dataset.slideId, el]));
        const dropped = new Set(E.deleted || []);
        const ordered = (E.order || []).filter(id => byId.has(id) && !dropped.has(id));
        // order 에 없는 장(뒤에 붙은 것)도 잃지 않는다 — 삭제된 것만 뺀다.
        const rest = found.filter(el => !dropped.has(el.dataset.slideId) && !(E.order || []).includes(el.dataset.slideId));
        if (ordered.length) found = ordered.map(id => byId.get(id)).concat(rest);
        else found = found.filter(el => !dropped.has(el.dataset.slideId));
        // 작성자가 쓴 내용은 가져온다. 검토 흔적(notes·pen·anchors·media)은 두고 온다 —
        // 흡수는 새 덱을 만드는 것이고 검토는 새로 시작한다.
        carry = sanitizeCarry(E, warnings);
        /* **두고 오는 것도 말한다.** 조용히 버리는 것과 일부러 두고 오는 것은 사용자 눈에
         * 똑같다 — 말하지 않으면 «내 메모가 사라졌다» 가 된다. 세는 것은 «있었다» 뿐이고
         * 가져오지는 않는다(그 결정은 그대로다). */
        const left = [['notes', '검토 메모'], ['pen', '영역지정·펜'], ['anchors', '앵커'], ['media', '첨부 미디어']]
          .filter(([k]) => E[k] && Object.keys(E[k]).length)
          .map(([, label]) => label);
        // 목록 끝 낱말에 조사를 붙이면 «펜는» 이 된다 — 앞에 세우면 그 문제가 없다
        if (left.length) warnings.push('함께 오지 않는 것: ' + left.join(' · ') + ' — 검토 흔적은 원본 파일에 남습니다.');
      }
    }

    const seen = new Set();
    const slides = found.map((el, i) => {
      const sec = document.createElement('section');
      // 원본 class 를 **대체하지 않는다** — 덱의 레이아웃 규칙이 거기 걸려 있다.
      // 실측(고객 A): <section class="slide cover on"> 이 'slide' 로 갈려
      // .cover .cin · .cover h1 · .cover .meta 등 표지 전용 규칙이 전멸했다.
      sec.className = 'slide';
      String((el.className || '')).split(/\s+/).forEach(c => { if (c) sec.classList.add(c); });
      const sid = normalizeId(el.dataset && el.dataset.slideId, seen, i);
      sec.dataset.slideId = sid;
      if (el.dataset && el.dataset.chapter) sec.dataset.chapter = el.dataset.chapter;
      // 제목은 개요·목차·발표자 뷰에 그대로 뜬다. 원문을 그대로 쓰면 부제·줄바꿈까지
      // 딸려 와 한 덩어리가 된다(실측: 고객 A 덱 표지 = 제목+부제+날짜 3줄).
      const head = ((el.querySelector('h1,h2,h3') || {}).textContent || '').replace(/\s+/g, ' ').trim();
      sec.dataset.slideTitle = head.slice(0, 60) || ('슬라이드 ' + (i + 1));
      sec.innerHTML = el.tagName === 'SECTION' ? el.innerHTML : el.outerHTML;
      // DomMint 덱의 키는 그대로 둔다. 다시 매기면 실려 온 수정문(edits)이 엉뚱한 요소에
      // 붙는다 — 검토자의 텍스트 수정이 붙어 있던 자리를 잃는 것과 같은 사고다.
      if (kind !== 'dommint' || !sec.querySelector('[data-key]')) {
        sec.querySelectorAll('[data-key]').forEach(x => x.removeAttribute('data-key'));
        assignKeys(sec, sid);
      }
      return sec;
    });

    // DomMint 덱을 다시 흡수할 때는 안 본다 — 그 파일에 남은 스크립트는 도구 자신의 것이라
    // 도구 UI 클래스가 통째로 잡힌다(덱 레이아웃과 무관하다).
    const jsMade = kind === 'dommint' ? [] : scriptBuiltClasses(html, slides);
    if (jsMade.length) warnings.push(
      '원본 스크립트가 만드는 요소 ' + jsMade.length + '건이 따라오지 않았습니다 — '
      + '그 클래스의 CSS 는 실려 있지만 걸릴 요소가 없어 레이아웃이 어긋납니다: '
      + jsMade.slice(0, 8).map(c => '.' + c).join(' ') + (jsMade.length > 8 ? ' …' : ''));

    return { slides, css, warnings, kind, carry, embedded: stateText };
  };

  /* 슬라이드 id 를 바꾼다. data-key 가 '<slideId>:tN' 이라 같이 고치지 않으면
   * 검토자의 텍스트 수정이 붙을 자리를 잃는다. */
  const renameSlide = (sec, id) => {
    const old = sec.dataset.slideId;
    sec.dataset.slideId = id;
    sec.querySelectorAll('[data-key]').forEach(el => {
      const k = el.dataset.key;
      if (k.startsWith(old + ':')) el.dataset.key = id + k.slice(old.length);
    });
  };

  /* ---------- commit ---------- */
  const slug = s => (s || 'deck').trim().toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'deck';

  /* deckId 접미사는 '난수'여야 한다. U.uid() 는 앞이 시간이라 그 앞부분을 잘라 쓰면
   * 같은 밀리초에 만든 두 덱이 같은 id 를 받는다 — 그러면 #23 사고가 그대로 재현된다. */
  const rand6 = () => Math.random().toString(36).slice(2, 8).padEnd(6, '0');

  const commit = async ({ slides, css, name, mode = 'replace', carry = null }) => {
    const deck = document.getElementById('deck');
    if (mode === 'replace') deck.innerHTML = '';
    else {
      // 이어붙일 때는 이미 있는 id 와 겹칠 수 있다. parse() 는 현재 덱을 모르기 때문이다
      // (자리 번호 slide-imp-01 은 결정적이라 같은 원본을 두 번 넣으면 반드시 겹친다).
      // order 중복은 계약 위반이고 data-key 도 같은 키로 덮인다.
      const taken = new Set([...deck.querySelectorAll(':scope > section.slide')].map(s => s.dataset.slideId));
      const moved = new Map();
      for (const s of slides) {
        if (!taken.has(s.dataset.slideId)) { taken.add(s.dataset.slideId); continue; }
        let n = 2, id;
        do { id = s.dataset.slideId + '-' + (n++); } while (taken.has(id));
        moved.set(s.dataset.slideId, id);
        renameSlide(s, id);
        taken.add(id);
      }
      /* carry 도 **같이 옮긴다.** 슬라이드만 이름을 바꾸면 carry 는 옛 id 로 extend 에 합쳐져
       * 기존 덱의 같은 id 슬라이드의 대본·수정문을 덮고, 옮긴 슬라이드는 제 것을 잃는다(감사 2026-09-15).
       * 키는 slideId 이거나 renameSlide 와 같은 '<slideId>:tN' 꼴이다. 한 번에 갈아 끼워야
       * 연쇄 이름(slide-a → slide-a-2, 원래 slide-a-2 → slide-a-2-2)이 서로를 덮지 않는다. */
      if (carry && moved.size) {
        const rekey = k => { const sid = k.split(':')[0]; return moved.has(sid) ? moved.get(sid) + k.slice(sid.length) : k; };
        carry = Object.fromEntries(Object.entries(carry).map(([f, v]) =>
          [f, v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [rekey(k), x])) : v]));
      }
    }
    /* 이 흡수를 한 회차로 도장 찍는다. 이름·시각을 **장마다 중복해서** 적는다 —
     * 첫 장에만 두면 그 장을 지운 뒤 회차 이름을 잃는다. 중복은 몇 백 바이트고
     * 잃는 쪽은 복구가 안 된다. 재흡수본이 실어 온 값은 여기서 덮인다(의도) —
     * data-key 와 달리 이 속성을 참조하는 상태가 없어서 덮어도 잃을 것이 없다. */
    const importId = nextImportId();
    const importAt = U.nowIso();
    const importName = U.nfc(name || (slides[0] && slides[0].dataset.slideTitle) || '');
    slides.forEach(s => {
      s.dataset.import = importId;
      s.dataset.importName = importName;
      s.dataset.importAt = importAt;
    });
    slides.forEach(s => deck.append(s));

    const styleEl = document.getElementById('deck-css');
    const scoped = scopeCss(css);
    // 감싸기는 scopeCss 가 끝난 뒤다(위 stripMarks 주석 참조). 빈 CSS 는 감싸지 않는다 —
    // 지울 조각이 없을 뿐이고 회차 자체는 슬라이드의 data-import 로 선다.
    const stamped = scoped.trim() ? (MARK(importId) + '\n' + scoped + MARK_END(importId) + '\n') : '';
    styleEl.textContent = mode === 'append' && styleEl.textContent.trim()
      ? styleEl.textContent + '\n' + stamped : stamped;

    // 이어붙이기에서 이름을 안 주면 기존 이름을 지킨다 — 덱 이름이 파일명이다.
    // **NFC 로 맞춰 넣는다.** 이름은 `mint.py --name`(셸 인자)이나 붙여넣은 파일명에서 오고
    // macOS 는 NFD(자모 분리)다. 그대로 두면 ①`slug()` 의 slice(0,40) 이 음절 중간을 자르고
    // ②저장소 키 `dommint:<deckId>` 가 눈에 같은 이름끼리 갈리며 ③내보내기 파일명의
    // 꼬리표 정규식이 통째로 빗나간다(결함 2-3). 상태에 들어가기 전에 한 번만 맞춘다.
    const keepName = U.nfc((mode === 'append' && !name) ? (Deck.state.data.name || '') : (name || ''));
    const order = [...deck.querySelectorAll(':scope > section.slide')].map(s => s.dataset.slideId);
    if (mode === 'append') {
      // 보태기다 — 갈아끼우기가 아니다. 상태를 비우지 않고 deckId 도 그대로 둔다.
      // rebind 를 쓰던 동안 기존 덱의 발표 대본·섹션명·텍스트 수정이 조용히 사라졌다(2026-09-08 재현).
      await Deck.state.extend({ order, carry, name: keepName });
    } else {
      // 같은 이름의 다른 보고서가 저장소를 공유하면 안 된다(#23: v45 검토본에 다른 덱 메모 17장).
      await Deck.state.rebind({ deckId: slug(keepName) + '-' + rand6(), name: keepName, order, carry });
    }
    // 콘텐츠 계층을 다시 적용한다. 부팅 때 한 번 돈 뒤로 덱이 통째로 바뀌었으므로
    // 다시 돌지 않으면 ①실려 온 텍스트 수정이 화면에 안 붙고 ②옛 덱의 펜·전환이미지
    // 오버레이가 새 슬라이드 위에 남는다. 99-boot.js 의 해당 부분과 같은 순서다.
    reapply();

    // 인쇄 경고는 **붙인 뒤에** 잰다 — 떼어 놓은 슬라이드는 레이아웃 값이 0 이다.
    const printWarn = widePrintWarning();
    // 남의 덱 구조를 도구가 손대는 것이라 **조용히 하지 않는다** — 몇 개를 폈는지 말한다.
    const flowed = markPrintFlow();
    const flowWarn = flowed
      ? '인쇄에서 사라지던 블록 ' + flowed + '개의 배치를 폈습니다(화면은 그대로입니다).'
      : null;
    // 슬라이드 집합이 바뀐 자리다 — 여기서 보관한다(항목7). 안 하면 새로고침에 통째로 사라진다.
    await keep();
    const msgs = [printWarn, flowWarn].filter(Boolean);
    if (msgs.length) U.toast(msgs.join(' '));
    return { warnings: msgs };
  };

  /* 인쇄(PDF)가 작게 나오는 덱을 흡수 직후 알린다 (후보 20번).
   *
   * 슬라이드의 직계 자식이 **레이아웃상** 슬라이드 폭을 넘으면 크롬 인쇄가 그 폭에 맞춰
   * **전체를 축소**한다. 화면에서는 안 보인다 — `transform` 은 **보이는 것만** 되돌리고
   * `overflow:hidden` 은 **보이는 것만** 자르기 때문이다.
   *
   * 실측(2026-09-11 고객 A): `.sheet{position:absolute; left:50%; width:1280px}` 이
   * 레이아웃상 **1920px** 까지 뻗어 PDF 가 **0.689 배**로 줄었다(슬라이드에 1280px 짜리 자를
   * 넣으니 551px 로 그려졌다). 사용자 표현: *"내용은 작고 화면 사이즈만 크다"*.
   *
   * **도구가 대신 고치지 않는다.** 일반 처방을 셋 다 재 봤고 전부 덱을 깼다:
   *   자식 position:static → 레이아웃 붕괴(높이 2px) · contain:size|strict → **표지 소실**(0%×0%)
   *   자식 max-width → 무효.
   * 그래서 **고치는 법까지 적어서 말만 한다.** 남의 덱 CSS 를 도구가 임의로 바꾸면 다른 덱이 깨진다.
   *
   * 레이아웃 값(computed left+width)으로 잰다 — getBoundingClientRect 는 transform 이 반영된
   * **보이는** 상자라 이 결함을 정의상 못 본다. */
  const wideChildren = () => {
    const out = new Set();
    for (const s of document.querySelectorAll('#deck > section.slide')) {
      // **슬라이드도 레이아웃 폭으로 잰다.** getBoundingClientRect 로 재면 렌더 폭(실측 1267)이
      // 나와 자식의 CSS 폭(1280)이 1.01 배로 «넘침» 이 된다 — 실측에서 정상 덱 둘이 그렇게
      // 오탐으로 잡혔다. 진짜 결함은 1.5 배였다(고객 A .sheet: 1920 / 1280).
      const sw = parseFloat(getComputedStyle(s).width) || 0;
      if (sw < 1) continue;
      for (const c of s.children) {
        if (c.hasAttribute && c.hasAttribute('data-ui')) continue;   // 도구가 넣은 층은 뺀다
        const cs = getComputedStyle(c);
        if (cs.position !== 'absolute' && cs.position !== 'fixed') continue;
        const reach = (parseFloat(cs.left) || 0) + (parseFloat(cs.width) || 0);
        if (reach <= sw + 1) continue;
        // className 은 SVG 에서 SVGAnimatedString 이라 문자열이 아니다 — 속성으로 읽는다.
        const cls = String(c.getAttribute('class') || '').trim().split(/\s+/)[0];
        out.add(cls ? '.' + cls : c.tagName.toLowerCase());
      }
    }
    return [...out].sort();
  };

  /* 인쇄에서 **통째로 사라지는** 블록을 흡수 때 표시한다 (후보 47번).
   *
   * 위 wideChildren 의 «폭» 형제다. 슬라이드의 절대배치 직계 자식이 **슬라이드보다 키가 크고**
   * 덱이 `transform: scale(...)` 로 줄여 맞추고 있으면, 인쇄에서 그 안의 내용이 지면 밖으로
   * 떨어져 **통째로 안 그려진다** — 제목만 남고 아래가 사라진다.
   * 실측(2026-09-11 고객 A v21): 8·11쪽의 큰 도형이 PDF 에 없다. `pdftotext` 로도 그 안의
   * 글자가 하나도 안 나온다. **SVG 라서가 아니다** — 같은 자리에 평범한 색 div 를 넣어도 같다.
   *
   * 폭 쪽과 달리 **여기서는 도구가 고친다.** 폭 쪽은 일반 처방이 전부 덱을 깨서 «말만 한다» 로
   * 끝냈지만, 이 조건은 손에 있는 덱 다섯으로 재어 **걸릴 것만 걸리는 것을 확인했다**:
   *   고객 A v20·v21 6개씩(비율 1.031~1.200 · 전부 scale 있음) · 고객 A v19 0개 ·
   *   고객 B v42·고객C **0개**(최대가 정확히 1.000 이고 transform 은 none).
   * 여유가 1.000 대 1.031 로 좁아 **키만으로는 약하다** — 그래서 «덱이 줄여서 맞추고 있다»
   * (transform 이 있다)를 함께 본다. 그 둘이 겹치는 자리가 정확히 이 결함이다.
   *
   * 표시만 하고 펴는 것은 print.css 가 한다 — 화면은 건드리지 않는다. */
  const markPrintFlow = () => {
    let n = 0;
    for (const s of document.querySelectorAll('#deck > section.slide')) {
      const sh = parseFloat(getComputedStyle(s).height) || 0;
      if (sh < 1) continue;
      for (const c of s.children) {
        if (c.hasAttribute && c.hasAttribute('data-ui')) continue;   // 도구가 넣은 층은 뺀다
        const cs = getComputedStyle(c);
        if (cs.position !== 'absolute') continue;
        if ((parseFloat(cs.height) || 0) <= sh + 1) continue;        // 지면 밖으로 나갈 만큼 크지 않다
        if (cs.transform === 'none') continue;                       // 덱이 줄여 맞추고 있을 때만이다
        // **폭 결함이 같이 있으면 손대지 않는다.** 그런 덱은 인쇄가 이미 통째로 축소돼 있어,
        // 여기만 펴면 축소 배율이 달라지며 멀쩡하던 쪽까지 무너진다(고객 A v20 에서 6쪽 실측).
        // 그쪽은 위 widePrintWarning 이 «덱을 이렇게 고치시라» 고 말하는 것이 처방이다.
        const sw = parseFloat(getComputedStyle(s).width) || 0;
        if (sw > 0 && (parseFloat(cs.left) || 0) + (parseFloat(cs.width) || 0) > sw + 1) continue;
        c.setAttribute('data-print-flow', '');
        n++;
      }
    }
    return n;
  };

  const widePrintWarning = () => {
    const w = wideChildren();
    if (!w.length) return null;
    return '인쇄(PDF)가 작게 나옵니다 — 슬라이드보다 넓은 절대위치 상자가 있습니다: ' + w.join(' ')
         + '. 그 규칙을 `left:0; transform:none` 으로 바꾸면 됩니다'
         + '(폭이 슬라이드와 같으면 가운데 맞춤이 애초에 필요 없습니다).';
  };

  /* 콘텐츠 계층 재적용. 흡수 뒤에 돌던 순서를 **지우기도 그대로 쓴다** —
   * 두 벌이 되면 한쪽만 고쳐져 갈린다(이 저장소가 반복해 온 실패다).
   * menu.refresh 는 «빈 덱 ↔ 덱 있음» 양방향이다 — 지우기가 그 역방향을 처음 만든다. */
  const reapply = () => {
    if (Deck.textedit && Deck.textedit.apply) Deck.textedit.apply();
    /* 🔴 **`textstyle` 이 여기 빠져 있었다.** 부팅(`99-boot.js:8`)은 부르는데 흡수 뒤에는 안 불러서,
     * 같은 파일이라도 **직접 열면 서식이 보이고 재흡수하면 안 보였다**(43번의 나머지 절반).
     * 위 주석이 «99-boot 와 같은 순서다» 라고 적고 있었는데 **실제로는 한 줄이 달랐다** —
     * 바로 그 주석이 경고하는 «두 벌이 되면 한쪽만 고쳐져 갈린다» 가 이 자리에서 났다.
     * 순서도 부팅과 같게 둔다: 글자가 자리를 잡은 뒤 서식을 입힌다. */
    if (Deck.textstyle && Deck.textstyle.apply) Deck.textstyle.apply();
    if (Deck.pen && Deck.pen.renderAll) Deck.pen.renderAll();
    if (Deck.media && Deck.media.renderAll) Deck.media.renderAll();
    if (Deck.review && Deck.review.render) Deck.review.render();
    if (Deck.nav && Deck.nav.rebuild) Deck.nav.rebuild();
    if (Deck.exporter && Deck.exporter.retitle) Deck.exporter.retitle();   // 흡수 직후(48번)
    Deck.ui.menu.refresh();   // UI.menu.refresh 는 이미 있다(40-menu.js:73)
  };

  /* 흡수 회차 목록. **DOM 이 진실이다** — 상태에 저장하지 않으므로 셀 수 있으면 그만이다.
   * 장수는 세면 되고(저장할 이유가 없다), 이름·시각은 장마다 중복해 적혀 있어 한 장만
   * 남아도 회차 이름을 잃지 않는다. */
  const rounds = () => {
    const out = [], by = new Map();
    for (const s of document.querySelectorAll('#deck > section.slide[data-import]')) {
      const id = s.dataset.import;
      if (!by.has(id)) {
        const r = { id, name: s.dataset.importName || '', at: s.dataset.importAt || '', n: 0 };
        by.set(id, r); out.push(r);
      }
      by.get(id).n++;
    }
    return out;
  };

  /* CSS 에서 그 회차 구간을 통째로 들어낸다. 마커가 없으면 아무것도 안 한다 —
   * 옛 파일(마커 이전)에서 조용히 엉뚱한 곳을 자르지 않기 위해서다. */
  const cutSegment = (css, id) => {
    const a = css.indexOf(MARK(id));
    if (a < 0) return css;
    const z = css.indexOf(MARK_END(id), a);
    if (z < 0) return css;                                   // 짝이 없으면 손대지 않는다
    return (css.slice(0, a) + css.slice(z + MARK_END(id).length)).replace(/\n{3,}/g, '\n\n');
  };

  /* 흡수 회차 하나를 되돌린다.
   *
   * **딸린 상태를 함께 정리한다.** 남기면 고아가 되어 용량으로 살고 내보내기 JSON 에
   * 노이즈로 실린다 — 그리고 같은 slideId 가 다시 흡수되면 **남의 메모가 되살아난다**
   * (#23 에서 겪은 것과 같은 종류의 사고다).
   * anchors 도 함께 지운다: 계획서 목록에는 없었지만 같은 slideId 키다. */
  const SID_KEYED = ['notes', 'pen', 'speaker', 'chapters', 'fragments', 'media', 'anchors', 'created'];

  /* 회차 id 는 **결정적이어야 한다.** 난수를 쓰면 `test_agent_path_matches_browser_path`
   * 의 바이트 대조가 깨진다 — 설계 §9 «앞문은 둘, 조립기는 하나» 를 재는 유일한 테스트다
   * (Task 4 가 슬라이드 id 를 결정적으로 만들어 둔 것과 같은 이유).
   * 파일 안에서만 유일하면 되므로 **지금 있는 것 중 최대 + 1** 이면 충분하다.
   * 지웠다가 다시 넣으면 번호가 재사용되는데, 그 번호를 참조하는 상태가 없으니 문제없다. */
  const nextImportId = () => {
    let max = 0;
    for (const r of rounds()) { const m = /^imp-(\d+)$/.exec(r.id); if (m) max = Math.max(max, +m[1]); }
    return 'imp-' + (max + 1);
  };

  const clearRound = async id => {
    const secs = [...document.querySelectorAll('#deck > section.slide')].filter(s => s.dataset.import === id);
    if (!secs.length) return 0;
    const gone = new Set(secs.map(s => s.dataset.slideId));
    const label = (rounds().find(r => r.id === id) || {}).name || id;
    secs.forEach(s => s.remove());

    const styleEl = document.getElementById('deck-css');
    styleEl.textContent = cutSegment(styleEl.textContent, id);

    const d = Deck.state.data;
    d.order = (d.order || []).filter(x => !gone.has(x));
    d.deleted = (d.deleted || []).filter(x => !gone.has(x));
    for (const k of SID_KEYED) if (d[k]) for (const sid of gone) delete d[k][sid];
    // edits 의 키는 '<slideId>:tN' 이다 — 앞자리로 가른다.
    if (d.edits) for (const key of Object.keys(d.edits)) if (gone.has(key.split(':')[0])) delete d.edits[key];
    // 한 짝만 남은 통합은 통합이 아니다(60-agenda.js 와 같은 규칙).
    d.merges = (d.merges || []).map(g => g.filter(x => !gone.has(x))).filter(g => g.length > 1);

    /* 지운 회차의 이름을 덱이 계속 달고 있으면 안 된다.
     *
     * 마지막 라운드면 흡수 전으로 되돌린다 — 안 되돌리면 슬라이드는 없는데 탭 제목과
     * 내보내기 파일명만 사라진 덱 이름으로 남는다(흡수 직후 retitle() 을 부르는 :550 의 뒷면).
     *
     * **라운드가 남았을 때가 빠져 있었다.** 종전 주석은 «남은 덱이 이름을 잃는다» 를 걱정해
     * 아무것도 안 했는데, 그 사이에 «남은 덱이 **지운 덱의 이름을 달고 있다**» 가 있었다.
     * 실측(2026-09-17): A 를 흡수하고 이름 없이 B 를 이어붙인 뒤 A 를 지우면, B 한 장만 남은
     * 파일이 `<title>`·파일명·`deck-state.name` 셋 다 A 의 이름으로 나갔다. 지운 자료의 이름이
     * 산출물에 붙어 나간 것이다. 60-agenda.js 의 되돌리기는 **0장일 때만** 걸려 여기를 못 막는다.
     * 그래서 비우는 대신 **남은 회차에게 넘긴다** — 가장 나중에 흡수한 것이 지금의 덱이다.
     * 사용자가 손으로 지은 이름(setName)은 지운 회차의 이름과 다르므로 건드리지 않는다.
     *
     * rounds() 는 DOM 을 세므로 위 remove() 뒤라야 남은 것만 나온다.
     * setName('') 은 못 쓴다 — 빈 이름을 거부한다(10-state.js:378). blank() 와 같은 '' 를 직접 넣는다.
     * 이름이 비면 retitle() 과 filename() 이 나란히 경로로 폴백한다(95-export.js:93,109). */
    const was = d.name;
    const rest = rounds();
    if (!rest.length) d.name = '';
    else if (d.name && d.name === label) d.name = rest.reduce((a, b) => (String(b.at) > String(a.at) ? b : a)).name || '';

    /* **이력에서도 그 이름을 지운다**(사용자 지시 2026-09-17).
     * 「덱 흡수: <이름>」이 `log` 에 남고 log 는 deck-state 에 실려 나간다 — 그래서 대외비 덱을
     * 흡수했다 지우고 파일을 보내면 **지운 덱의 이름만 딸려 나갔다**(실측: 지우기 뒤 내보낸
     * 파일에 2회). 제목·파일명을 고쳐도 여기가 남으면 지운 것이 아니다.
     * 지우기 기록 자체는 남기되 이름을 빼서 «무엇을》이 아니라 «몇 장을» 만 남긴다. */
    if (label) d.log = (d.log || []).filter(e => !(e && e.msg && String(e.msg).includes(label)));

    await Deck.state.commit('가져온 자료 지우기: ' + gone.size + '장');
    if (d.name !== was && Deck.exporter && Deck.exporter.retitle) Deck.exporter.retitle();
    reapply();
    await keep();          // 여기도 슬라이드 집합이 바뀐 자리다 — 0장이 되면 보관도 비운다
    return gone.size;
  };

  /* 작업자료 일괄. 개별 삭제는 이미 패널에 있다(material.remove) — 여기서는 한 줄로 전부.
   * material.js 는 손대지 않는다: list()·remove() 가 이미 export 되어 있다. */
  const materials = () => (Deck.material && Deck.material.list) ? Deck.material.list() : [];
  const clearMaterials = async () => {
    const items = materials();
    for (const m of items) await Deck.material.remove(m.id);
    return items.length;
  };

  const hhmm = iso => { try { return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const mb = n => (n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB');

  /* 지우기 다이얼로그. **기존 «초기화 범위 선택» 을 베낀다**(95-export.js resetDialog) —
   * 새 UI 를 발명하지 않는다. */
  async function clearDialog() {
    const rs = rounds();
    const mats = materials();
    const orphan = !rs.length && !!document.querySelector('#deck > section.slide');
    const boxes = [];
    const r = await Deck.ui.dialog({
      title: '가져온 자료 지우기',
      body: b => {
        b.append(U.el('p', { text: '선택한 것을 이 파일과 브라우저 저장소에서 지웁니다. 되돌릴 수 없습니다.' }));
        // 조용히 빈 목록을 보이지 않는다 — 왜 회차가 없는지 말한다.
        if (orphan) b.append(U.el('p', { class: 'muted', text: '이 덱에는 흡수 표시가 없어 회차별로 지울 수 없습니다. 이 도구로 다시 가져오거나, 저장 › 초기화 (범위 선택) 를 쓰세요.' }));
        rs.forEach((x, i) => {
          const cb = U.el('input', { type: 'checkbox', id: 'clear-' + x.id });
          boxes.push(['round:' + x.id, cb]);
          const at = hhmm(x.at);
          b.append(U.el('label', { class: 'chk' }, [cb, (i + 1) + '회차 · ' + (x.name || '이름 없음') + ' · ' + x.n + '장' + (at ? ' · ' + at : '')]));
        });
        if (mats.length) {
          const cb = U.el('input', { type: 'checkbox', id: 'clear-materials' });
          boxes.push(['materials', cb]);
          b.append(U.el('label', { class: 'chk' }, [cb, '작업자료 ' + mats.length + '개 · ' + mb(mats.reduce((a, m) => a + (m.size || 0), 0))]));
        }
      },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '지우기', primary: true, danger: true }],
    });
    if (r !== 'ok') return false;
    const picked = boxes.filter(([, cb]) => cb.checked).map(([k]) => k);
    if (!picked.length) { U.toast('지울 항목을 선택하세요'); return false; }
    let slides = 0, files = 0;
    for (const k of picked) if (k.startsWith('round:')) slides += await clearRound(k.slice(6));
    if (picked.includes('materials')) files = await clearMaterials();
    U.toast('지웠습니다' + (slides ? ' · 슬라이드 ' + slides + '장' : '') + (files ? ' · 작업자료 ' + files + '건' : ''));
    return true;
  }

  /* ---------- 넘침 검출 (test_render_regression.py 의 기하 검출기와 같은 규칙) ---------- */
  const overflowOf = sec => {
    const sb = sec.getBoundingClientRect();
    const out = [];
    for (const el of sec.querySelectorAll('*')) {
      const st = getComputedStyle(el);
      if (st.display === 'none' || st.visibility === 'hidden' || st.position === 'fixed') continue;
      const b = el.getBoundingClientRect();
      if (b.width < 1 || b.height < 1) continue;
      const over = Math.max(0, sb.top - b.top) + Math.max(0, b.bottom - sb.bottom)
                 + Math.max(0, sb.left - b.left) + Math.max(0, b.right - sb.right);
      if (over > 1) out.push(el.tagName.toLowerCase() + '.' + ((el.className || '').toString().trim() || '(no-class)'));
    }
    return out.sort();
  };

  /* ---------- 미리보기 ----------
   * 자동 판정을 믿지 않는다. 남의 HTML 은 반드시 어딘가 넘치므로 사람이 보고 골라야 한다.
   * 미리보기용 CSS 는 .ip-stage 로 스코프한다 — 썸네일은 다이얼로그 안이라 #deck 밖이다. */
  const STAGE = '.ip-stage';
  const stage = () => U.el('div', { class: 'ip-stage' });

  /* `fileName` 은 입구(파일 선택·드롭)가 넘기는 원본 파일명이다. 이름 칸의 기본값이 된다 —
   * 빈 셸은 덱 이름이 '' 라 이것이 없으면 `filename()` 이 경로로 떨어져 내보내기가
   * `DomMint_작업장_…` 으로 나갔다(작업장 Task 2). 꼬리표·버전은 여기서 걷지 않는다 —
   * `filename()` 의 `baseName()` 한 곳이 한다. */
  const open = (html, fileName) => {
    const r = parse(html);
    if (!r.slides.length) { U.toast('슬라이드를 찾지 못했습니다'); return; }
    const dropped = new Set();
    const previewCss = scopeCss(r.css, STAGE);

    // 넘침을 재려면 실제 크기로 붙여야 한다. 화면 밖 측정용 무대를 쓴다.
    const probe = U.el('div', { id: 'ip-probe', 'data-ui': '', style: 'position:fixed;left:-99999px;top:0;width:1280px' });
    const pstage = stage();
    probe.append(U.el('style', { text: previewCss }), pstage);
    document.body.append(probe);

    const cards = r.slides.map((s, i) => {
      const measured = s.cloneNode(true);
      measured.style.cssText = 'position:relative;width:1280px;height:720px;display:block';
      pstage.append(measured);
      const over = overflowOf(measured);

      const card = U.el('div', { class: 'ip-card', dataset: { i: String(i) } }, [
        U.el('div', { class: 'ip-thumb' }, [stage()]),
        U.el('div', { class: 'ip-meta' }, [
          U.el('b', { text: (i + 1) + '. ' + (s.dataset.slideTitle || '') }),
          over.length ? U.el('span', { class: 'ip-warn', title: over.join('\n'), text: '넘침 ' + over.length }) : null,
        ]),
        U.el('button', { type: 'button', class: 'ip-drop', text: '제외' }),
      ]);
      // 축소는 transform 이 아니라 zoom 이다 — transform 은 레이아웃 크기를 안 줄여
      // 그리드 칸이 원본 1280px 를 차지한다(#8 오버뷰에서 배운 것).
      const mini = s.cloneNode(true);
      mini.style.cssText = 'position:relative;width:1280px;height:720px;display:block;zoom:.16';
      card.querySelector('.ip-thumb .ip-stage').append(mini);

      const btn = card.querySelector('.ip-drop');
      btn.addEventListener('click', () => {
        if (dropped.has(i)) { dropped.delete(i); card.classList.remove('dropped'); btn.textContent = '제외'; }
        else { dropped.add(i); card.classList.add('dropped'); btn.textContent = '되살리기'; }
      });
      return card;
    });
    probe.remove();

    const host = U.el('div', { id: 'import-preview', 'data-ui': '' }, [
      U.el('style', { text: previewCss }),
      U.el('div', { class: 'ip-grid' }, cards),
    ]);
    const warn = U.el('div', { id: 'ip-warnings', text: r.warnings.join(' · ') });
    const nameIn = U.el('input', { id: 'ip-name', type: 'text', placeholder: '보고서 이름 (파일명이 됩니다)', value: Deck.state.data.name || (fileName || '').replace(/\.html?$/i, '') });
    const hasDeck = !!document.querySelector('#deck > section.slide');
    const modeSel = U.el('select', { id: 'ip-mode' }, [
      U.el('option', { value: 'replace', text: '전체 교체' }),
      U.el('option', { value: 'append', text: '뒤에 이어붙이기' }),
    ]);
    const kindLabel = { dommint: 'DomMint 산출물', slides: '슬라이드형', document: '일반 문서 자동 분할' }[r.kind];

    Deck.ui.dialog({
      title: '가져오기 확인 — ' + r.slides.length + '장 (' + kindLabel + ')',
      wide: true,
      body: b => { b.append(nameIn); if (hasDeck) b.append(modeSel); b.append(warn, host); },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '가져오기', primary: true }],
    }).then(async res => {
      if (res !== 'ok') return;
      const keep = r.slides.filter((_, i) => !dropped.has(i));
      if (!keep.length) { U.toast('가져올 슬라이드가 없습니다'); return; }
      const mode = hasDeck ? modeSel.value : 'replace';
      // 전체 교체는 파괴적이다 — 직전 상태를 버전 타임라인에 남긴다(#10 되돌리기와 같은 규칙).
      if (mode === 'replace' && hasDeck && Deck.versions && Deck.versions.save) {
        await Deck.versions.save('가져오기 직전 자동 스냅샷');
      }
      await commit({ slides: keep, css: r.css, carry: r.carry, name: nameIn.value.trim(), mode });
      U.toast(keep.length + '장을 가져왔습니다');
    });
  };

  /* ---------- 입구 ---------- */
  const pickFile = () => {
    const inp = U.el('input', { type: 'file', accept: '.html,.htm,text/html', style: 'display:none' });
    inp.addEventListener('change', async () => { if (inp.files[0]) open(await inp.files[0].text(), inp.files[0].name); inp.remove(); });
    document.body.append(inp); inp.click();
  };

  /* ---------- 작업장 보관 (항목7) ----------
   *
   * 흡수한 덱은 **살아 있는 DOM 에만** 있었다. 상태에 실리는 것은 order 와 로그뿐이고
   * (2장짜리 덱 실측 430 bytes — 본문 문자열도 CSS 도 없고 `created` 는 `{}` 다), 셸 파일에는
   * 슬라이드가 0장이며, 버전 스냅샷(76-versions.js)도 상태 본문만 담는다. 그래서 새로고침 한
   * 번에 통째로 사라졌고 **되찾을 길이 구조적으로 없었다.** 경고조차 없었다.
   *
   * 마크업은 **IndexedDB** 에 둔다. localStorage 는 실측 상한이 5,241,856 인데 v43 슬라이드
   * 마크업 합계가 6.28MB 다 — 거기 넣으면 큰 덱에서 「저장공간 부족」(항목5)을 그대로 재현한다.
   * IDB 는 32MB 를 넣고 되읽었고 quota 가 10.7GB 였다. 선택지가 아니라 유일한 자리다.
   *
   * 쓰는 시점은 **슬라이드 집합이 바뀌는 자리만**이다(흡수·회차 지우기). 모든 commit 에 걸면
   * 메모 타건마다 수 MB 를 쓰게 되고, 그것이 새 결함이 된다. */
  const SNAP = id => '__shell__:' + id;
  const MAP_KEY = 'dommint:shell-map';
  /* 경로는 **NFC 로 접어서** 키로 쓴다. 같은 파일인데 앱마다 정규화가 갈린다 — 실측:
   * playwright 의 WebKit·Chromium 은 `%EC%9E%91…`(NFC) 로, **Safari.app 은
   * `%E1%84%8C%E1%85%A1%E1%86%A8…`(NFD) 로** 준다(디스크 파일명은 셋 다 NFC).
   * 엔진이 아니라 **앱** 차이라 한 브라우저 안에서는 일관되지만, 접지 않으면 브라우저를 바꾸는
   * 순간 같은 파일이 다른 칸을 본다. 이 저장소는 NFC/NFD 로 이미 한 번 데였다 — 내보내기
   * 파일명의 꼬리표 정규식이 NFD 한글에 통째로 빗나갔다.
   * **쓸 때와 읽을 때 둘 다 접는다.** 한쪽만 접으면 이미 저장된 항목을 못 찾는다.
   *
   * **퍼센트 디코딩을 먼저 한다.** 인코딩된 채로 접으면 아무 일도 일어나지 않는다 —
   * 한글이 `%EC%9E%91` 처럼 ASCII 로 감싸여 있어 NFC/NFD 정규화의 대상이 아니기 때문이다.
   * (그대로 두면 「정규화를 넣었는데 여전히 못 찾는다」가 된다. 실제로 그렇게 한 번 틀렸다.) */
  const decode = s => { try { return decodeURIComponent(String(s)); } catch (e) { return String(s); } };
  const here = () => U.nfc(decode(location.pathname));
  const mine = k => U.nfc(decode(k)) === here();

  /* 길은 **경로로 가른다.** `dommint:shell` 은 같은 빌드의 모든 작업장 파일이 공유하는 칸이라
   * (deckId 가 리터럴 "shell" — build.py:86) 포인터를 값 하나로 두면 **두 번째 작업장이 첫 번째
   * 것을 본다.** #23 계열이다. `file://` 에서는 경로가 달라도 같은 localStorage 를 보지만
   * (실측: 다른 폴더의 작업장이 서로의 칸을 봤다) `location.pathname` 은 다르므로, 파일마다
   * 항목이 갈리는 **맵**으로 둔다.
   * 못 막는 경우를 적어 둔다: **파일을 옮기거나 이름을 바꾸면 항목을 못 찾는다.** 그때는 아래
   * `stranded()` 가 «있는데 못 찾는다» 를 말해 준다 — 침묵으로 끝나지는 않는다. */
  const mapRead = () => { try { return JSON.parse(localStorage.getItem(MAP_KEY) || '{}') || {}; } catch (e) { return {}; } };
  const mapWrite = m => { try { localStorage.setItem(MAP_KEY, JSON.stringify(m)); } catch (e) { /* 자리가 없으면 맵 없이 산다 */ } };
  /* 접기 **이전에** 저장된 항목도 찾는다 — 버리면 이미 쓰고 있는 작업장이 길을 잃는다.
   * 다음 보관 때 `dropMine` 이 옛 항목을 걷고 접은 키로 다시 적는다 — 그전까지는 여기가 잇는다. */
  const lookup = m => {
    if (m[here()]) return m[here()];
    for (const k of Object.keys(m)) if (mine(k)) return m[k];
    return '';
  };
  /** 이 경로의 항목을 **정규화가 갈린 것까지** 걷어낸다. */
  const dropMine = m => { for (const k of Object.keys(m)) if (mine(k)) delete m[k]; return m; };

  /** 지금 화면의 덱을 이 작업장 자리에 보관한다. 슬라이드가 없으면 자리를 비운다. */
  /* **공개판은 보관하지 않는다.** 아무나 여는 주소라 개인·고객 자료가 브라우저에 남으면 안 된다
   * — 같은 컴퓨터를 나눠 쓰면 다음 사람이 앞사람 덱을 그대로 되살린다(사용자 지적 2026-09-17).
   * 한 번 앉아서 쓰는 동작(흡수·메모·펜·수정·지우기·내보내기)은 그대로다. 새로고침을 안 넘길 뿐이다.
   * 보존 수단은 **내보내기 하나**다. */
  const keep = async () => false;
  const KEEP_DISABLED_PUBLIC = true;
  const _keep_unused = async () => {
    const deck = document.getElementById('deck');
    if (!deck) return false;
    const id = Deck.state.DECK_ID;
    const n = deck.querySelectorAll(':scope > section.slide').length;
    const m = mapRead();
    if (!n || id === 'shell') {
      try { await U.idb.del(SNAP(id)); } catch (e) { /* 없으면 그만이다 */ }
      mapWrite(dropMine(m));
      return false;
    }
    const css = document.getElementById('deck-css');
    const html = deck.innerHTML;
    try {
      await U.idb.put({ id: SNAP(id), at: U.nowIso(), name: Deck.state.data.name || '', n,
                        html, css: css ? css.textContent : '', size: html.length });
      dropMine(m)[here()] = id;    // 옛 정규화로 남은 항목을 함께 걷고 접은 키로 적는다
      mapWrite(m);
      return true;
    } catch (e) {
      // 보관이 실패하면 **말한다.** 이 결함의 본체가 «조용히 사라지는 것» 이었다.
      U.toast('작업장을 보관하지 못했습니다 · 내보내기로 파일에 저장하세요');
      return false;
    }
  };

  /** 이 경로에 보관된 것. 없으면 null. */
  const kept = async () => {
    const id = lookup(mapRead());
    if (!id) return null;
    let rec = null;
    try { rec = await U.idb.get(SNAP(id)); } catch (e) { return null; }
    return rec && rec.html ? Object.assign({ deckId: id }, rec) : null;
  };

  /* 보관 이전에 만들어진 고아. **되살릴 수 없지만 말은 해야 한다.**
   * 마크업이 어디에도 없어 구조상 복구가 불가능한데, 침묵하면 사용자는 그것을 모른 채 기다린다. */
  const stranded = async () => {
    let live = [];
    try { live = (await U.idb.all()).map(r => r.id); } catch (e) { /* ignore */ }
    const out = [];
    for (const k of Object.keys(localStorage)) {
      if (k.indexOf('dommint:') !== 0 || k === 'dommint:idb-migrated' || k === MAP_KEY) continue;
      if (k.indexOf(':archive:') > -1 || k.indexOf(':fork:') > -1) continue;
      let d = null;
      try { d = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { continue; }
      if (!d || !(d.order || []).length || d.deckId === 'shell') continue;
      if (live.indexOf(SNAP(d.deckId)) > -1) continue;          // 보관본이 있으면 고아가 아니다
      out.push({ name: d.name || '(이름 없음)', n: d.order.length, at: d.updatedAt || '' });
    }
    return out;
  };

  /* 재열기에 **묻는다. 자동으로 덮지 않는다** — 자동 채택은 #23(남의 덱 상태를 물려받는 것)을
   * 다시 부른다. 슬라이드가 이미 있으면 묻지 않는다. */
  /* 끄는 것과 지우는 것은 다르다. 묻지 않게만 하면 앞사람 자료가 칸에 그대로 남아
   * 개발자도구로 읽힌다 — 그것이 바로 걱정하신 상황이다. 부팅 때 **지우고** 시작한다.
   * 지우는 범위: 이 도구가 쓰는 칸 전부(`dommint:*` · IndexedDB 전체). 첨부 blob 도 개인 자료다. */
  const purgePublic = async () => {
    let ls = 0, idb = 0;
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.indexOf('dommint:') === 0) { ls += (localStorage.getItem(k) || '').length; localStorage.removeItem(k); }
      }
    } catch (e) { /* 저장소를 못 열면 지울 것도 없다 */ }
    try {
      for (const r of await U.idb.all()) { idb += (r.html || '').length + (r.size || 0); await U.idb.del(r.id); }
    } catch (e) { /* 같다 */ }
    return { ls, idb };
  };

  const offerRestore = async () => {
    if (document.querySelector('#deck > section.slide')) return;
    const rec = await kept();
    if (!rec) {
      const lost = await stranded();
      if (lost.length) {
        U.toast('이 브라우저에 이름만 남은 작업이 ' + lost.length + '건 있습니다 · 슬라이드는 복구할 수 없습니다');
      }
      return;
    }
    const ok = await Deck.ui.confirm('작업장 되살리기',
      '<p><b>' + U.escapeHtml(rec.name || '(이름 없음)') + '</b> ' + rec.n + '장이 이 작업장에 보관돼 있습니다.</p>'
      + '<p>' + U.escapeHtml(rec.at ? new Date(rec.at).toLocaleString('ko-KR') : '') + '</p>', '되살리기');
    if (!ok) return;
    const deck = document.getElementById('deck');
    const css = document.getElementById('deck-css');
    if (css) css.textContent = rec.css || '';
    deck.innerHTML = rec.html;
    // 상태를 먼저 집어야 아래 reapply 가 그 덱의 메모·수정·서식을 붙인다.
    Deck.state.adopt(rec.deckId);
    if (Deck.structure && Deck.structure.apply) Deck.structure.apply();
    reapply();
    Deck.ui.menu.refresh();
    U.toast(rec.n + '장을 되살렸습니다');
  };

  const init = () => {
    Deck.ui.registerMenu('source', { id: 'menu-import', order: 10, label: 'HTML 자료 가져오기', onClick: pickFile });
    // 지울 것이 없으면 아예 안 뜬다 — 빈 다이얼로그를 열게 하지 않는다(#22).
    Deck.ui.registerMenu('source', { id: 'menu-import-clear', order: 15, label: '가져온 자료 지우기…',
      when: () => !!(rounds().length || materials().length), onClick: clearDialog });
    document.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    document.addEventListener('drop', async e => {
      const f = [...(e.dataTransfer.files || [])].find(x => /\.html?$/i.test(x.name));
      if (!f) return;
      e.preventDefault();
      open(await f.text(), f.name);
    });
    emptyGuide();
    purgePublic();             // 공개판: 묻지 않는다. **남아 있던 것도 지우고 시작한다.**
  };

  /* 빈 작업장 안내. 슬라이드가 0장일 때만 보인다.
   * 흡수·회차 지우기·구성 삭제·되돌리기·버전 복원이 **각자** #deck 을 바꾸므로, 호출부마다
   * 동기화를 걸지 않고 #deck 의 자식 변화를 한 곳에서 본다 — 경로가 늘어도 빠지지 않는다.
   * 판정은 40-menu.js renderMenu 와 같은 선택자. */
  const emptyGuide = () => {
    const deck = document.getElementById('deck');
    const card = U.el('div', { id: 'empty-guide', 'data-ui': '', role: 'note' }, [
      U.el('b', { text: '보고서를 불러오세요' }),
      U.el('p', { class: 'eg-logo', text: '① 오른쪽 위 ✎ 를 눌러 HTML 열기 ↗' }),
      U.el('p', { text: '② 또는 파일을 이 화면에 끌어다 놓기' }),
      U.el('p', { class: 'eg-warn', text: '이 공개판은 아무것도 저장하지 않습니다 — 새로고침하면 사라집니다. 「수정본 HTML 내보내기」로 받아 두세요.' }),
    ]);
    document.body.append(card);
    /* 붙이자마자 한 번 판정한다.
     *
     * 종전에는 옵저버만 걸고 첫 판정을 생략하면서 «셸은 언제나 0장으로 부팅한다(저장본에는
     * import-js 가 빠진다)» 를 전제로 삼았다. 그 전제는 부팅 순서가 받쳐 주지 않는다:
     * 99-boot.js:6 structure.apply() 가 :43 emit('deck:ready') 보다 **먼저** 돌고
     * 이 모듈은 그 deck:ready 에 붙는다(아래 init 등록). apply() 가 state.created 에서
     * 슬라이드를 세우면(60-agenda.js — 앵커가 없으면 그냥 append 한다) 등록 시점에 이미
     * 장이 있고, childList 는 그 뒤로 안 바뀌므로 **옵저버가 영영 안 돈다.**
     * 그러면 카드가 position:fixed 로 덱 위에 남아(ui.css:389) 슬라이드가 멀쩡히 있는데도
     * 화면은 «불러오세요» 로 보인다(재현 2026-09-16: slides 3 · hidden false · 카운터 1/3).
     * 첫 판정 한 줄이면 전제 자체가 필요 없다 — 순서가 바뀌어도 서는 쪽으로 둔다. */
    const sync = () => { card.hidden = !!deck.querySelector(':scope > section.slide'); };
    sync();
    new MutationObserver(sync).observe(deck, { childList: true });
  };

  // 셸 모듈은 99-boot.js 의 init 목록에 들어가지 않는다(설계 §9) — 스스로 산다.
  // import-js 는 deck-js 뒤에 오지만 부팅은 비동기라 순서를 가정하지 않는다.
  if (window.__deckReady) init();
  else document.addEventListener('deck:ready', init, { once: true });

  return { parse, scopeCss, stripMarks, rounds, clearRound, clearMaterials, clearDialog, assignKeys, commit, slug, init, open, overflowOf,
           keep, kept, stranded, offerRestore, purgePublic };
})();

/* ==== shell/material.js ==== */
/* shell/material.js — 작업자료 보관함 (셸 전용).
 *
 * 첨부(70-review.js)와 다른 물건이다. 첨부는 검토용 스크린샷이라 WebP 압축 후 수십 KB 이고
 * 내보내기에 dataURL 로 실린다. 작업자료는 원본 PPT·Excel·PDF 다 — 10MB PPTX 는 base64 로
 * 13MB 가 되고, #15 에서 세운 용량 규율(0.7% 이득에 계약 깨기 거부)이 그대로 무너진다.
 * 그래서 바이트는 IDB 에만 두고 내보내기에는 목록만 싣는다.
 *
 * UI 가 셸 전용인 이유(설계 §9-4): 바이트가 안 실리므로 다른 기기의 검토자는 이름만 보고
 * 파일을 못 연다 — 눌러 보고 실패하는 항목을 메뉴에 두지 않는다(#22).
 * 목록은 상태로 계속 여행하므로 unbuild 변경요청서는 "이 덱은 이런 자료로 만들었다"를 싣는다.
 */
Deck.material = (() => {
  const U = Deck.util, S = Deck.state;
  const key = id => '__mat__:' + id;

  // IDB 는 키·값이 아니라 레코드 스토어다 — put({id, …})·get(id)·del(id) (00-util.js).
  const add = async file => {
    const id = U.uid('mat');
    // 이 이름은 상태로 여행해 unbuild 변경요청서의 자료 표와 blob 파일 이름이 된다.
    // macOS 드롭은 NFD 라, 맞추지 않으면 눈에 같은 두 이름의 바이트가 달라진다(결함 2-3).
    const name = U.nfc(file.name);
    await U.idb.put({ id: key(id), name: name, type: file.type || '', size: file.size, blob: file });
    S.data.materials = S.data.materials || {};
    S.data.materials[id] = { name: name, type: file.type || '', size: file.size, at: new Date().toISOString() };
    S.commit('작업자료 추가: ' + name);
    return id;
  };
  const list = () => Object.entries(S.data.materials || {}).map(([id, m]) => Object.assign({ id }, m));
  const remove = async id => {
    await U.idb.del(key(id));
    delete (S.data.materials || {})[id];
    S.commit('작업자료 삭제');
  };
  const open = async id => {
    const r = await U.idb.get(key(id));
    if (!r || !r.blob) { U.toast('자료를 찾을 수 없습니다 — 다른 브라우저에서 추가했을 수 있습니다'); return; }
    const url = URL.createObjectURL(r.blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  };

  const fmt = n => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB');

  function panel() {
    const p = Deck.ui.panel.register('material', {
      title: '작업자료',
      subtitle: 'PPT·Excel·PDF·이미지 — 이 브라우저에만 저장되고 내보내기 파일에는 목록만 실립니다',
    });
    const render = () => {
      p.body.innerHTML = '';
      const inp = U.el('input', { type: 'file', multiple: true, id: 'mat-add' });
      inp.addEventListener('change', async () => {
        for (const f of inp.files) await add(f);
        render(); Deck.ui.menu.refresh();
      });
      p.body.append(inp);
      const ul = U.el('div', { class: 'mat-list' });
      for (const m of list()) {
        const row = U.el('div', { class: 'mat-row' }, [
          U.el('button', { type: 'button', class: 'mat-open', text: m.name }),
          U.el('small', { text: fmt(m.size) }),
          U.el('button', { type: 'button', class: 'mat-del', text: '삭제' }),
        ]);
        row.querySelector('.mat-open').addEventListener('click', () => open(m.id));
        row.querySelector('.mat-del').addEventListener('click', async () => { await remove(m.id); render(); Deck.ui.menu.refresh(); });
        ul.append(row);
      }
      if (!list().length) ul.append(U.el('small', { text: '아직 없습니다.' }));
      p.body.append(ul);
    };
    render();
    Deck.ui.panel.open('material');
  }

  /* 바이트를 브라우저 밖으로 꺼낸다.
   *
   * 작업자료는 IDB 에만 살고 내보내기 파일에는 **목록만** 실린다(13.2MB 를 붙여도 산출물은
   * +578 바이트다). 그래서 에이전트는 "이런 자료로 만들었다" 는 알아도 **자료를 읽을 수 없다** —
   * 리뷰가 *"파서가 없는 게 아니라 바이트가 없다"* 고 지적한 자리다.
   * ZIP 은 `Deck.util.zipStore` 한 벌을 쓴다(대본 xlsx 와 같은 것).
   * IDB 는 **붙인 사람의 브라우저에만** 있으므로 꺼내는 것도 여기서 한다. */
  async function download() {
    const items = list();
    if (!items.length) { U.toast('내려받을 작업자료가 없습니다'); return; }
    const files = [];
    for (const m of items) {
      const r = await U.idb.get(key(m.id));
      if (!r || !r.blob) continue;                       // 다른 브라우저에서 붙인 것은 바이트가 없다
      files.push({ name: U.nfc(m.name), data: new Uint8Array(await r.blob.arrayBuffer()) });
    }
    if (!files.length) { U.toast('이 브라우저에 저장된 바이트가 없습니다 — 자료를 붙인 브라우저에서 내려받으세요'); return; }
    const name = (U.nfc((S.data.name || 'DomMint').trim()) || 'DomMint') + '_작업자료.zip';
    const a = U.el('a', { href: URL.createObjectURL(U.zipStore(files)), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const missed = items.length - files.length;
    U.toast('작업자료 ' + files.length + '건을 내려받았습니다' + (missed ? ' · ' + missed + '건은 바이트가 없어 건너뜀' : ''));
  }

  const init = () => {
    Deck.ui.registerMenu('source', {
      id: 'menu-material', order: 20,
      label: () => '작업자료 (' + list().length + ')',
      badge: () => list().length > 0,
      onClick: panel,
    });
    Deck.ui.registerMenu('source', {
      id: 'menu-material-zip', order: 30,
      label: '작업자료 내려받기 (ZIP)',
      when: () => list().length > 0,
      onClick: download,
    });
  };

  // 셸 모듈은 99-boot.js 의 init 목록에 들어가지 않는다(설계 §9) — 스스로 산다.
  if (window.__deckReady) init();
  else document.addEventListener('deck:ready', init, { once: true });

  return { init, add, list, remove, open, download };
})();

</script>
</body></html>
