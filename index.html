    try { localStorage.setItem(KEY, json); }
    catch (e) {
      const keep = S.data.undo;
      S.data.undo = [];
      json = JSON.stringify(S.data);
      try {
        localStorage.setItem(KEY, json);
        U.toast('저장공간이 부족해 되돌리기 기록을 비웠습니다 · 변경은 저장되었습니다');
      } catch (e2) {
        // 어차피 못 적는다 — 되돌리기까지 뺏을 이유가 없으니 메모리 상태는 되돌려 놓는다.
        S.data.undo = keep; json = JSON.stringify(S.data); ok = false;
        U.toast('저장공간이 부족해 이 변경을 저장하지 못했습니다 · 내보내기로 파일에 보관하세요');
      }
    }
    const tag = document.getElementById('deck-state');
    if (tag) tag.textContent = json.replace(/<\//g, '<\\/');
    U.emit('deck:state', { msg });
    return ok;
  };

  S.slideIds = () => S.data.order.slice();

  /* 조회는 **만들지 않는다**. 읽기만 해도 빈 레코드가 생기면 내보내기에 노이즈가 쌓이고
   * (#5 에서 겪었다), 그 노이즈가 unbuild 에서 **헛 요청**이 된다 — 검토자가 덱을 열어
   * 몇 장 넘겨 보기만 해도 패치가 23 op 로 나왔다(2026-09-09 실측: media 18 · 시드 5).
   * 교훈은 speaker 한 곳에만 적용돼 있었다. 여섯 자리에 같은 규칙을 건다.
   *
   * 쓰려면 `*For` 를 쓴다. 둘을 나누지 않으면 조회 한 번이 상태를 늘린다.
   * 조회가 돌려주는 빈 값은 동결한다 — 거기에 쓰면 조용히 버려지므로 소리가 나야 한다.
   * `tests/test_phantom_state.py` 가 여섯 자리를 한꺼번에 잰다. */
  /* `Object.freeze` 만으로는 부족하다 — 이 모듈들은 strict 모드가 아니라 동결된 값에 써도
   * **아무 말 없이 무시된다.** "썼는데 안 써진" 상태는 이 저장소가 가장 비싸게 겪어 온 실패다.
   * Proxy 로 막고 **무엇을 써야 하는지까지 말한다.** (실제로 이 분리를 넣자마자 회귀 12건이
   * timeout 으로 깨졌는데 원인은 테스트들이 조회 헬퍼로 쓰고 있었다는 것이었다 —
   * 예외였다면 첫 줄에서 알았을 일이다.) */
  const readOnly = (empty, name) => new Proxy(empty, {
    set() { throw new TypeError("Deck.state." + name + "() 는 조회다 — 쓰려면 Deck.state." + name + "For() 를 쓴다"); },
    defineProperty() { throw new TypeError("Deck.state." + name + "() 는 조회다 — 쓰려면 Deck.state." + name + "For() 를 쓴다"); },
  });
  const EMPTY_NOTE = readOnly({ text: '', history: readOnly([], 'note'), files: readOnly([], 'note') }, 'note');
  const EMPTY_MEDIA = readOnly({ pano: readOnly([], 'media'), ref: readOnly([], 'media') }, 'media');
  const EMPTY_PENS = readOnly([], 'pens');
  const EMPTY_ANCHORS = readOnly([], 'anchors');
  const EMPTY_MARKS = readOnly([], 'speakerMarks');
  const EMPTY_FRAGMENTS = readOnly([], 'fragments');

  S.note = id => S.data.notes[id] || EMPTY_NOTE;
  S.pens = id => S.data.pen[id] || EMPTY_PENS;
  S.media = id => S.data.media[id] || EMPTY_MEDIA;
  S.anchors = id => S.data.anchors[id] || EMPTY_ANCHORS;
  S.fragments = id => S.data.fragments[id] || EMPTY_FRAGMENTS;
  S.speaker = id => (S.data.speaker && S.data.speaker[id]) || '';

  /* 대본의 구간 색칠. **speaker 는 평문 그대로 둔다** — 값이 HTML 이 되면 본 창 textarea ·
   * 엑셀 왕복(=== 동등 비교) · 내보내기 JSON 이 전부 깨진다(86-presenter.js:9 의 거절 이유).
   * styles 가 edits 와 갈라선 것과 같은 수법으로, 서식만 여기 따로 산다. */
  S.marks = id => (S.data.speakerMarks && S.data.speakerMarks[id]) || EMPTY_MARKS;
  /* `putMarks` 는 **쓰기만** 한다. 타이핑으로 오프셋이 밀릴 때마다 부르는 자리라
   * 커밋하면 타건마다 로그가 쌓이고 `deck:state` 가 터져 발표자 뷰가 통째로 다시 그려진다.
   * 저장은 대본 저장의 디바운스(450ms)가 같이 해 준다. */
  S.putMarks = (id, arr) => {
    if (!S.data.speakerMarks) S.data.speakerMarks = {};
    // 색이든 크기든 **하나는** 있어야 마크다 — 둘 다 없으면 보이지 않는 구간만 상태에 쌓인다
    const clean = (arr || []).filter(m => m && m.to > m.from && typeof m.text === 'string'
                                          && (m.color || m.size != null));
    if (clean.length) S.data.speakerMarks[id] = clean; else delete S.data.speakerMarks[id];
    return clean;
  };
  S.setMarks = (id, arr) => { S.putMarks(id, arr); return S.commit('대본 색칠'); };

  S.noteFor = id => S.data.notes[id] || (S.data.notes[id] = { text: '', history: [], files: [] });
  S.pensFor = id => S.data.pen[id] || (S.data.pen[id] = []);
  S.mediaFor = id => S.data.media[id] || (S.data.media[id] = { pano: [], ref: [] });
  S.anchorsFor = id => S.data.anchors[id] || (S.data.anchors[id] = []);
  S.fragmentsFor = id => S.data.fragments[id] || (S.data.fragments[id] = []);
  S.setSpeaker = (id, text) => {
    if (!S.data.speaker) S.data.speaker = {};
    if ((text || '').trim()) S.data.speaker[id] = text; else delete S.data.speaker[id];
  };
  S.addLog = msg => { S.data.log.push({ at: U.nowIso(), msg }); if (S.data.log.length > 500) S.data.log.splice(0, S.data.log.length - 500); };
  S.pushUndo = e => S.data.undo.push(e);
  S.popUndo = () => S.data.undo.pop();

  const referencedBlobIds = d => {
    const ids = new Set();
    Object.values(d.notes || {}).forEach(n => (n.files || []).forEach(f => ids.add(f)));
    Object.values(d.media || {}).forEach(m => [...(m.pano || []), ...(m.ref || [])].forEach(f => ids.add(f)));
    return ids;
  };

  S.exportJson = async () => {
    const out = JSON.parse(JSON.stringify(S.data));
    out.blobs = {};
    for (const id of referencedBlobIds(out)) {
      const r = await U.idb.get(id);
      if (r) out.blobs[id] = { name: r.name, type: r.type, size: r.size, data: await U.fileToDataUrl(r.blob) };
    }
    return out;
  };

  S.resetScopes = async sc => {
    const d = S.data;
    if (sc.notes) { for (const n of Object.values(d.notes)) for (const f of n.files || []) await U.idb.del(f); d.notes = {}; }
    if (sc.pen) d.pen = {};
    if (sc.edits) d.edits = {};
    if (sc.structure) { d.order = S.embedded.order.slice(); d.deleted = []; d.created = {}; d.merges = []; d.undo = []; }
    if (sc.anchors) d.anchors = {};
    if (sc.fragments) d.fragments = {};
    if (sc.speaker) d.speaker = {};
    /* 아래 셋은 **지울 길이 없던 것들**이다(2026-09-11 사용자 신고: «표지 글자색을 녹색으로
     * 바꿨는데 원복이 안 되네»). 기능을 더하면서 초기화 범위를 안 더해서 생겼다 —
     * 「걷어낼 때도, **더할 때도** 지울 길을 함께 둔다」. `test_reset_scopes.py` 가 이제 그물이다. */
    if (sc.styles) d.styles = {};
    if (sc.speakerMarks) d.speakerMarks = {};
    if (sc.chapters) d.chapters = {};
    if (sc.files) { for (const m of Object.values(d.media)) for (const f of [...(m.pano || []), ...(m.ref || [])]) await U.idb.del(f); d.media = {}; }
    S.commit('초기화: ' + Object.keys(sc).filter(k => sc[k]).join(', '));
  };

  /* 돌려주는 것은 **{found, n, missed}** 다. 숫자 하나로는 세 가지가 뭉개진다:
   * «보관된 적 없다» · «보관됐는데 사라졌다(quota)» · «있었지만 이 덱에 자리가 없다».
   * 셋을 한 문구로 말하면 사용자가 **틀린 것을 옳다고 읽는다** — 이 기능의 최악이다. */
  S.importArchive = async () => {
    if (!S.archived) return { found: false, n: 0, missed: 0 };
    const A = readLocal(S.archived.key);
    /* 아카이브가 없다 = quota 로 버려졌다. `S.archived` 는 `L` 에서 센 것이라 남아 있다.
     * 그 불일치가 지문이다. **상태를 지우지 않는다** — 사용자에게 알려야 하기 때문이다. */
    if (!A) return { found: false, n: 0, missed: S.archived.total || 0 };
    let n = 0;
    for (const [id, nt] of Object.entries(A.notes || {})) {
      if (!nt || (!nt.text && !(nt.history || []).length)) continue;
      const cur = S.noteFor(id);
      if (nt.text) { cur.text = cur.text ? cur.text + '\n' + nt.text : nt.text; n++; }
      cur.history = [...(cur.history || []), ...(nt.history || [])];
    }
    for (const [id, arr] of Object.entries(A.pen || {})) {
      if (!arr || !arr.length) continue;
      const cur = S.pensFor(id);
      arr.forEach(p => cur.push(Object.assign({}, p, { n: cur.length + 1 })));
      n += arr.length;
    }
    /* `edits` 는 그 `data-key` 가 **지금 DOM 에 있을 때만** 반영된다(키가 없는 곳에 써 두면
     * 고아가 되어 unbuild 에서 헛 요청이 된다). 그래서 **못 담은 것이 남을 수 있다.** */
    let missed = 0;
    for (const [k, v] of Object.entries(A.edits || {})) {
      if (document.querySelector('[data-key="' + k + '"]')) { S.data.edits[k] = v; n++; }
      else missed++;
    }
    S.commit('이전 버전(' + A.build + ') 로컬 데이터 가져오기 ' + n + '건');
    /* **못 담은 것이 있으면 아카이브를 지우지 않는다.**
     *
     * 종전에는 무조건 지웠다 — 그래서 흡수 **전에** 눌러 보면(셸은 `#deck` 이 비어 있어
     * `data-key` 가 0개다) 0건 반영하고 아카이브가 사라져 **나중에 옳은 덱을 흡수해도
     * 되살릴 수 없었다.** 셸을 열면 이 메뉴가 바로 보이므로 그 순서는 자연스럽다.
     * 재현·수정 2026-09-10(카드 12번). `notes`·`pen` 은 무조건 병합되니 `edits` 전용 구멍이었다.
     *
     * 남겨 두면 옳은 덱을 흡수한 뒤 다시 눌러 살릴 수 있다. 전부 담겼을 때만 지운다 —
     * 안 지우면 같은 것을 두 번 붙인다. */
    if (!missed) {
      try { localStorage.removeItem(S.archived.key); } catch (e) { /* ignore */ }
      S.archived = null;
    } else {
      /* «아직 못 담았다» 는 표시. rebind() 가 이것만 보고 살려 준다 — 아래 그 자리의 주석 참고. */
      S.archived = Object.assign({}, S.archived, { pending: true });
    }
    return { found: true, n, missed };
  };

  S.usage = async () => {
    const local = (localStorage.getItem(KEY) || '').length;
    // 갈라진 작업 보관 칸(:fork:<saveId>). 같은 localStorage quota 를 먹으므로 따로 보여야 원인이 드러난다(검토 세션 U).
    let fork = 0;
    try { for (const k of Object.keys(localStorage)) if (k.startsWith(KEY + ':fork:')) fork += (localStorage.getItem(k) || '').length; } catch (e) { /* ignore */ }
    // blobs 스토어에는 첨부 말고도 파일 핸들(__fs__:)·버전 스냅샷(__ver__:)이 산다. 첨부 용량만 센다.
    let idb = 0, vers = 0;
    try { for (const r of await U.idb.all()) { const v = /^__ver__:/.test(r.id); if (v) vers += r.size || 0; else if (!/^__fs__:/.test(r.id)) idb += r.size || 0; } } catch (e) { /* ignore */ }
    let est = {}; try { if (navigator.storage && navigator.storage.estimate) est = await navigator.storage.estimate(); } catch (e) { /* ignore */ }
    return { local, fork, idb, vers, quota: est.quota || 0, usage: est.usage || 0 };
  };

  /* 덱을 갈아끼운다(흡수). 새 deckId = 새 저장소이고, 옛 저장소는 지우지 않는다 —
   * 네임스페이스를 옮길 때 지우면 사용자 메모·펜이 고아가 된다(#23 의 교훈).
   * 저장 계층은 Deck.state 하나뿐이라는 계약 때문에 여기 산다 — 흡수 코드(셸)가
   * localStorage 를 직접 만지지 않게 하는 진입점이다. */
  S.rebind = async ({ deckId, name, order, carry }) => {
    DECK_ID = deckId; KEY = NS + deckId;
    S.DECK_ID = DECK_ID; S.KEY = KEY;
    /* **작업자료는 덱이 아니라 작업장 소유다** — 덱을 갈아끼워도 따라가야 한다.
     * 종전에는 blank() 가 `materials` 를 비워 흡수 한 번에 목록이 사라졌다(실측 1개 → 0개).
     * 그런데 파일 자체는 IndexedDB 의 `__mat__:` 에 멀쩡히 남아 있었다 — **잃은 것은 레코드뿐**
     * 이라, 상태를 통째로 들고 다니는 rekey 를 새로 만들지 않고 여기서 한 줄로 넘긴다.
     * #23 보호(남의 덱 메모를 안 들고 온다)와 부딪히지 않는다: 작업자료에는 덱 내용이 없다. */
    const materials = S.data.materials || {};
    S.data = blank();
    S.data.materials = materials;
    S.data.deckId = deckId;
    S.data.name = name || '';
    S.data.order = order || [];
    S.data.build = (document.querySelector('meta[name=deck-build]') || {}).content || '';
    /* 흡수한 덱이 갖고 오는 '작성자가 쓴 내용'. **무엇이 오는지는 흡수 쪽이 정한다** —
     * 여기서 목록을 또 적지 않는다(`import.js` 의 `CARRY_SHAPE` 가 유일한 정의다).
     *
     * 🔴 종전에는 같은 목록이 **세 곳**에 하드코딩돼 있었다(`CARRY_SHAPE` · 여기 · `extend`).
     * 그래서 흡수에 `styles`·`speakerMarks` 를 더해도 **상태가 안 받았다** — 43번이 그 자리다.
     * 셋이 어긋나도 아무것도 안 터지고 **필드 하나가 조용히 사라질 뿐**이라 더 나빴다.
     * 검토 흔적(notes·pen·anchors·media)이 안 넘어오는 것도 그쪽 결정이고 여기서 거들지 않는다. */
    if (carry) for (const k of Object.keys(carry)) if (carry[k]) S.data[k] = carry[k];
    /* 아카이브 정보는 버린다 — 새 deckId 로 갈아탔으니 옛 덱의 보관분은 남의 것이다(#23).
     *
     * **딱 하나 예외**: 사용자가 이미 «가져오기» 를 눌렀는데 그때 덱이 비어 있어 담지 못한
     * 경우(`pending`). 셸은 흡수 전 `#deck` 이 비어 `data-key` 가 0개라 그 순서가 흔하고,
     * 여기서 끊으면 **아카이브를 남겨 둔 의미가 없다** — 살릴 수 있는 유일한 시점이
     * 흡수 뒤인데 그때 메뉴가 사라지기 때문이다(재현 2026-09-10, 카드 12번).
     * 무작정 남기지 않고 «명시적으로 시도했고 못 담았다» 는 표시가 있을 때만 잇는다. */
    S.archived = (S.archived && S.archived.pending) ? S.archived : null;
    await S.commit('덱 흡수: ' + (name || deckId));
  };

  /* 다른 칸의 상태를 **그대로 들고** 키를 옮긴다 — 작업장 되살리기(항목7)가 쓴다.
   *
   * `rebind` 와 반대다. rebind 는 **새 덱을 만들려고** 상태를 비우지만, 여기는 **이미 하던 작업**
   * 을 다시 여는 것이라 한 글자도 잃으면 안 된다. 셸은 파일이 늘 «나는 shell 이다» 라고 말해서
   * (build.py:86 의 리터럴 deckId) 재열기마다 `dommint:shell` 로 돌아가는데, 흡수가 민팅한 칸은
   * 이름이 달라 그 길에서 만나지를 못한다 — 그 칸을 이름으로 직접 집는 문이다.
   * 없는 칸이면 아무것도 안 한다: 빈 상태로 갈아타면 있던 것까지 잃는다. */
  S.adopt = deckId => {
    const key = NS + deckId;
    const L = readLocal(key);
    if (!L) return false;
    DECK_ID = deckId; KEY = key;
    S.DECK_ID = DECK_ID; S.KEY = KEY;
    S.data = normalize(L);
    U.emit('deck:state', { msg: '작업장 되살리기' });
    return true;
  };

  /* 덱 이름을 나중에 바꾼다. 종전에는 대입점이 rebind()·extend() 둘뿐이라
   * **민팅 시점의 이름이 영구히 굳었다** — 파일명이 여기서 오는데 정정할 길이 없다.
   * 실사용 사고(2026-09-10): 0-A 로 고친 v0.2 를 열고 ⌘S 하니 저장 대화상자가 옛 이름
   * `…_v0.1_…` 을 권했고 그대로 **배치가 깨진 v0.1 파일에 두 번 저장**됐다.
   * 파일의 deck-state 를 손으로 고치는 것으로는 안 된다 — 위 로드 분기가
   * `L.build === E.build` 면 로컬 상태를 덮어씌운다. 저장 계층을 거쳐야 한다.
   * deckId 는 건드리지 않는다: 갈면 검토자의 dommint:<옛 deckId> 메모·펜이 고아가 된다(#23). */
  S.setName = async name => {
    // macOS 는 한글을 NFD 로 넘긴다. 입구에서 접지 않으면 filename() 의 꼬리표 정규식이
    // 통째로 빗나간다 — 흡수 경로에서 이미 겪은 결함이다(도구계층 결함 C).
    const v = U.nfc(String(name == null ? '' : name).trim());
    if (!v) return false;                       // 빈 이름이면 파일명이 조용히 경로로 떨어진다
    if (v === S.data.name) return true;
    const from = S.data.name;
    S.data.name = v;
    await S.commit('덱 이름: ' + (from || '(없음)') + ' → ' + v);
    if (Deck.exporter && Deck.exporter.retitle) Deck.exporter.retitle();   // 이름 변경(48번)
    return true;
  };

  /* 덱을 **이어붙인다**. rebind 와 달리 상태를 비우지 않는다 —
   * append 는 '갈아끼우기'가 아니라 '보태기'다. 같은 함수로 둘을 처리하다가
   * 기존 덱의 발표 대본·섹션명·텍스트 수정이 조용히 사라졌다(2026-09-08 재현).
   * deckId 도 그대로 둔다: 갈리면 검토자의 dommint:<옛 deckId> 메모·펜이 고아가 되고
   * unbuild 의 base 도 어긋난다. */
  S.extend = async ({ order, carry, name }) => {
    if (name) S.data.name = name;
    S.data.order = order || S.data.order;
    // 들어온 쪽이 이기되 기존을 지우지는 않는다. 목록은 흡수 쪽(`CARRY_SHAPE`)이 정한다.
    if (carry) for (const k of Object.keys(carry)) {
      if (carry[k]) S.data[k] = Object.assign({}, S.data[k] || {}, carry[k]);
    }
    await S.commit('덱 이어붙임: ' + (order || []).length + '장');
  };

  return S;
})();

/* ==== 20-nav.js ==== */
/* 20-nav.js — slide navigation. Emits `deck:change` {index, slide, changed} on every show(). Keys live in 30-keys.js. */
Deck.nav = (() => {
  const UI = () => Deck.ui || { menu: { refresh() {} } };
  const U = Deck.util;
  let idx = 0, deck, dotsWrap, bar;
  const slides = () => [...deck.querySelectorAll(':scope > section.slide')];
  const index = () => idx;
  const current = () => slides()[idx];
  const byId = id => slides().find(s => s.dataset.slideId === id);

  function syncPagers(list, n) {
    list.forEach((sl, selfIdx) => {
      const nav = sl.querySelector('.uc-nav');
      if (!nav) return;
      if (nav.dataset.pn !== String(list.length)) {
        nav.innerHTML = '';
        const pg = U.el('div', { class: 'uc-pager' });
        for (let i = 0; i < list.length; i++) pg.append(U.el('span', { class: 'uc-pg', dataset: { i: String(i) }, text: String(i + 1) }));
        nav.append(pg);
        nav.dataset.pn = String(list.length);
      }
      // on = 지금 보는 장(모든 슬라이드에 같은 값, 화면용) · self = 이 슬라이드 자신의 번호(인쇄용: 19쪽이 다 나오므로 장마다 달라야 한다)
      [...nav.querySelectorAll('.uc-pg')].forEach((c, i) => { c.classList.toggle('on', i === n); c.classList.toggle('self', i === selfIdx); });
    });
  }
  function buildDots(n) {
    if (dotsWrap.children.length === n) return;
    dotsWrap.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = U.el('i', { dataset: { i: String(i) } });
      d.addEventListener('click', () => show(i));
      dotsWrap.append(d);
    }
  }
  /* 좌우 클릭 판정. **가운데 20% 는 죽은 구역**이다 — 가운데를 누른 사람이 어느 쪽으로
   * 갈지 모르는 상태를 만들지 않는다. **발표자 뷰도 이 판정을 쓴다**(후보 11번):
   * 비율을 두 벌로 두면 한쪽만 고쳐져 갈린다. */
  const CLICK_EDGE = 0.4;
  const clickZone = (x, w) => (x > w * (1 - CLICK_EDGE) ? 'next' : x < w * CLICK_EDGE ? 'prev' : null);

  /* 네비 투명도 프리셋. 값 '' = 변수를 지워 stage.css 의 기본값(뚜렷)을 쓴다 — 기본값을 두 벌 두지 않는다.
   * 보는 사람의 취향이라 덱별 상태가 아니라 전역 키에 둔다. */
  const NAV_ALPHA = [['뚜렷', ''], ['보통', '.6'], ['흐리게', '.3']];
  const NAV_ALPHA_KEY = 'dommint:nav-alpha';
  const navAlpha = () => { let k; try { k = localStorage.getItem(NAV_ALPHA_KEY); } catch (e) {} return NAV_ALPHA.find(p => p[0] === k) || NAV_ALPHA[0]; };
  function applyNavAlpha(p) {
    if (p[1]) document.documentElement.style.setProperty('--nav-a', p[1]);
    else document.documentElement.style.removeProperty('--nav-a');
  }
  function cycleNavAlpha() {
    const p = NAV_ALPHA[(NAV_ALPHA.indexOf(navAlpha()) + 1) % NAV_ALPHA.length];
    try { localStorage.setItem(NAV_ALPHA_KEY, p[0]); } catch (e) {}
    applyNavAlpha(p);
    return p[0];
  }

  function show(n) {
    const s = slides(), N = s.length;
    if (!N) return;
    n = Math.max(0, Math.min(N - 1, n));
    s.forEach((el, i) => { el.classList.remove('active', 'prev'); if (i === n) el.classList.add('active'); else if (i < n) el.classList.add('prev'); });
    buildDots(N);
    [...dotsWrap.children].forEach((d, i) => d.classList.toggle('on', i === n));
    syncPagers(s, n);
    const cur = document.getElementById('cur'); if (cur) cur.textContent = n + 1;
    const tot = document.getElementById('cnt-total'); if (tot) tot.textContent = N;
    if (bar) bar.style.width = ((n + 1) / N * 100) + '%';
    const changed = idx !== n;
    idx = n;
    U.emit('deck:change', { index: n, slide: s[n], changed });
  }
  const next = () => show(idx + 1);
  const prev = () => show(idx - 1);
  const rebuild = () => show(Math.min(idx, slides().length - 1));
  const isFs = () => !!document.fullscreenElement;
  function toggleFs() {
    if (isFs()) { document.exitFullscreen().catch(() => {}); return Promise.resolve(false); }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { U.toast('이 브라우저는 전체화면을 지원하지 않습니다'); return Promise.resolve(false); }
    // 실패를 삼키지 않는다 — 왜 안 되는지 안 보이면 '전체화면이 안 된다'로만 남는다.
    return Promise.resolve(req.call(el)).then(() => true).catch(e => {
      U.toast('전체화면을 열지 못했습니다 · ' + ((e && e.name) || '알 수 없음'), 3200);
      console.warn('fullscreen failed', e);
      return false;
    });
  }
  function fit() {
    // 무대의 '실측 크기'를 쓰면 안 된다 — #stage 에 0.22초 전환이 걸려 있어 여는 순간엔
    // 아직 넓고 닫는 순간엔 아직 좁다. 전환 도중을 재면 배율이 틀어진 채 굳는다(실측:
    // 열 때 덱이 패널을 130px 덮고, 닫아도 작은 채로 남았다).
    // 그래서 창 크기에서 패널 몫을 빼서 '앞으로 될 크기'를 직접 계산한다 — 타이밍과 무관하다.
    const reserved = document.body.classList.contains('split')
      ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'), 10) || 0)
      : 0;
    const w = Math.max(320, window.innerWidth - reserved), h = window.innerHeight;
    deck.style.transform = 'scale(' + Math.min(w / 1280, h / 720) + ')';
  }
  function init() {
    deck = document.getElementById('deck');
    dotsWrap = document.getElementById('dots');
    bar = document.getElementById('bar');
    document.getElementById('next').addEventListener('click', next);
    document.getElementById('prev').addEventListener('click', prev);
    document.getElementById('fs').addEventListener('click', toggleFs);
    document.addEventListener('click', e => {
      const pg = e.target.closest && e.target.closest('.uc-pg');
      if (!pg) return;
      if (Deck.ui && Deck.ui.mode !== 'present') return;
      e.stopPropagation(); e.preventDefault();
      show(+pg.dataset.i);
    }, true);
    deck.addEventListener('click', e => {
      if (Deck.ui && Deck.ui.mode !== 'present') return;
      if (e.target.closest && e.target.closest('[data-ui],.uc-pager,.nz-display,.slideshow,.pen-layer,a,button,input,textarea,select')) return;
      const r = deck.getBoundingClientRect();
      const z = clickZone(e.clientX - r.left, r.width);
      if (z === 'next') next(); else if (z === 'prev') prev();
    });
    window.addEventListener('resize', fit);
    // 전체화면 진입/이탈에서 반드시 다시 재는다. resize 는 뷰포트가 확정되기 전에 오거나
    // 아예 안 오기도 해서(실측: 진입 후 fit() 호출 0회) 덱이 1280×720 그대로 남아
    // '전체화면이 안 된다'로 보였다. 두 번 재는 건 배율 확정 타이밍이 브라우저마다 달라서다.
    document.addEventListener('fullscreenchange', () => {
      fit();
      requestAnimationFrame(fit);
      setTimeout(fit, 160);
      UI().menu.refresh();
    });
    fit();
    applyNavAlpha(navAlpha());
  }
  return { init, show, next, prev, index, slides, current, byId, toggleFs, isFs, fit, rebuild, clickZone, navAlpha: () => navAlpha()[0], cycleNavAlpha };
})();

/* ==== 30-keys.js ==== */
/* 30-keys.js — Deck.ui core: modes, Escape stack, focusStage and the ONLY keyboard router.
 * Rules (see spec §4):
 *  - a visible input/textarea/contenteditable owns every key except Escape
 *  - Escape goes to the top of the esc stack (pen note → pen → dialog → panel → edit mode)
 *  - a focused button never turns Space/Enter into navigation double-fires; tooling buttons blur after click
 *  - pen mode swallows navigation keys (pen is bound to one slide)
 */
Deck.ui = (() => {
  const U = Deck.util;
  const UI = { mode: 'present', escStack: [] };
  const NAV_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];

  UI.setMode = m => {
    document.body.classList.remove('mode-' + UI.mode);
    UI.mode = m;
    document.body.classList.add('mode-' + m);
    U.emit('deck:mode', { mode: m });
  };
  UI.pushEsc = (fn, tag) => { UI.popEsc(tag); UI.escStack.push({ fn, tag }); };
  UI.popEsc = tag => { UI.escStack = UI.escStack.filter(e => e.tag !== tag); };
  UI.focusStage = () => {
    const a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
    const st = document.getElementById('stage');
    if (st) st.focus({ preventScroll: true });
  };
  UI.isTypingTarget = el => {
    if (!el || !el.matches) return false;
    if (!el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]),textarea,[contenteditable="true"],[contenteditable=""]')) return false;
    return typeof el.checkVisibility === 'function' ? el.checkVisibility() : !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  };
  const isButtonLike = el => !!(el && el.matches && el.matches('button,a[href],[role=button],summary,input[type=button],input[type=checkbox],input[type=radio],input[type=file]'));

  window.addEventListener('keydown', e => {
    const a = document.activeElement;
    if (e.key === 'Escape' && (e.metaKey || e.ctrlKey)) {   // ⌘Esc: 발표자 뷰 닫기(본창에서도)
      if (Deck.presenter && Deck.presenter.isOpen()) { e.preventDefault(); Deck.presenter.close(); return; }
    }
    if (e.key === 'Escape') {
      const top = UI.escStack[UI.escStack.length - 1];
      if (top) { e.preventDefault(); e.stopImmediatePropagation(); top.fn(e); }
      return;
    }
    if (UI.isTypingTarget(a)) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.shiftKey && e.key.toLowerCase() === 'm') { e.preventDefault(); if (Deck.review) Deck.review.open(); return; }
    if (mod && !e.altKey && e.key.toLowerCase() === 's') {              // ⌘S 제자리 저장 · ⌘⇧S 는 이름을 묻고 저장(39번) · FS Access 없으면 둘 다 다운로드 폴백
      e.preventDefault();
      if (Deck.exporter) (e.shiftKey ? Deck.exporter.renameAndSave() : Deck.exporter.saveInPlace());
      return;
    }
    if (mod || e.altKey) return;
    if (UI.mode === 'pen') { if (NAV_KEYS.includes(e.key)) e.preventDefault(); return; }
    if (UI.mode === 'overview' && e.key === 'Enter') {                 // 그리드에서 현재 장 선택
      e.preventDefault(); Deck.overview.exit(Deck.nav.index()); return;
    }
    if (e.key.toLowerCase() === 'o' && Deck.overview) { e.preventDefault(); Deck.overview.toggle(); return; }
    if (e.key.toLowerCase() === 'l' && Deck.spotlight) { e.preventDefault(); Deck.spotlight.toggle(); return; }
    if (e.key.toLowerCase() === 'p' && Deck.presenter) { e.preventDefault(); Deck.presenter.toggle(); return; }
    if (isButtonLike(a) && (e.key === ' ' || e.key === 'Enter')) {
      // inside tooling UI: native behaviour (checkbox toggle, button click) — never slide navigation
      if (a.closest('[data-ui],dialog')) return;
      // a focused deck button (다음/이전/전체화면): activate exactly once, then release focus
      e.preventDefault(); a.click(); a.blur();
      return;
    }
    // 단계 노출(#21)이 먼저 키를 먹는다. 마지막 단계면 false 를 돌려 슬라이드를 넘긴다.
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); Deck.nav.next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); Deck.nav.prev(); }
    else if (e.key === 'Home') { e.preventDefault(); Deck.nav.show(0); }
    else if (e.key === 'End') { e.preventDefault(); Deck.nav.show(Deck.nav.slides().length - 1); }
  }, true);

  // buttons must not keep focus after a mouse click (otherwise Space/Enter re-fires them and arrows feel dead)
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button,[role=button]');
    if (!b || b.closest('dialog')) return;
    if (document.activeElement === b) b.blur();
    setTimeout(() => { if (document.activeElement === b) b.blur(); }, 0);
  }, true);

  return UI;
})();

/* ==== 40-menu.js ==== */
/* 40-menu.js — 메뉴 menu (4 groups: 발표·검토·구성·저장), panel manager (one panel at a time), <dialog> helper.
 * Everything here is created at boot by Deck.ui.ensure(); nothing is static in the HTML, so an exported file
 * always rebuilds its UI with live handlers.  All tooling containers carry [data-ui] (removed on export). */
(() => {
  const U = Deck.util, UI = Deck.ui;
  const GROUPS = [['source', '자료'], ['present', '발표'], ['review', '검토'], ['compose', '구성'], ['save', '저장']];
  const registry = { source: [], present: [], review: [], compose: [], save: [] };
  const panels = {};
  let host, menuBtn, flyout, panelHost, currentPanel = null;

  /* 함수다 — 상수로 두면 로드 시점에 굳는데 그때는 `Deck.exporter` 가 아직 없어
   * 내보내기 이름을 참조할 수 없다. 그래서 여기에만 옛 이름이 하드코딩된 채 남아 있었다. */
  const HELP_HTML = () => '<table class="help">' +
    '<tr><td>→ · PageDown · Space</td><td>다음 슬라이드</td></tr>' +
    '<tr><td>← · PageUp</td><td>이전 슬라이드</td></tr>' +
    '<tr><td>Home · End</td><td>처음 · 마지막</td></tr>' +
    '<tr><td>메뉴</td><td>전체화면 (메뉴 버튼 › 전체화면)</td></tr>' +
    '<tr><td>Esc</td><td>열린 창 닫기 · 영역지정/편집 종료</td></tr>' +
    '<tr><td>⌘/Ctrl + Shift + M</td><td>슬라이드 메모</td></tr>' +
    '<tr><td>⌘/Ctrl + S</td><td>' + (Deck.exporter ? Deck.exporter.LABEL : '') + '</td></tr>' +
    '<tr><td>화면 왼쪽/오른쪽 클릭</td><td>이전/다음</td></tr></table>';

  /* ---------- menu ---------- */
  UI.registerMenu = (group, item) => {
    if (!registry[group]) throw new Error('unknown menu group ' + group);
    registry[group] = registry[group].filter(it => it.id !== item.id).concat([item]);
    if (flyout) renderMenu();
  };
  function renderMenu() {
    flyout.innerHTML = '';
    for (const [g, label] of GROUPS) {
      // 덱이 비어 있으면 '자료'만 남긴다. 슬라이드가 없는데 발표·검토·구성·저장을
      // 눌러 봐야 할 일이 없다 — 눌러 보고 실패하는 항목을 메뉴에 두지 않는다(#22 와 같은 원칙).
      if (g !== 'source' && !document.querySelector('#deck > section.slide')) continue;
      // 순서를 모듈 init 순서에 맡기지 않는다(모듈을 추가하면 메뉴가 멋대로 재배열된다).
      // order 가 작을수록 위. 같으면 등록 순서(안정 정렬).
      const items = registry[g].filter(it => !it.when || it.when())
        .map((it, i) => [it, i]).sort((a, b) => ((a[0].order || 100) - (b[0].order || 100)) || (a[1] - b[1])).map(x => x[0]);
      if (!items.length) continue;
      flyout.append(U.el('div', { class: 'menu-group', text: label }));
      for (const it of items) {
        const b = U.el('button', { type: 'button', id: it.id, class: 'menu-item', role: 'menuitem', dataset: { group: g } },
          [U.el('span', { class: 'mi-label', text: typeof it.label === 'function' ? it.label() : it.label }), it.hint ? U.el('kbd', { text: U.hotkey(it.hint) }) : null]);
        const badge = it.badge ? it.badge() : false;
        if (badge) { b.classList.add('has-badge'); if (typeof badge === 'string') b.dataset.badge = badge; }
        if (it.active && it.active()) b.classList.add('on');
        b.addEventListener('click', e => { e.stopPropagation(); closeMenu(); it.onClick(e); });
        flyout.append(b);
      }
    }
  }
  const openMenu = () => { renderMenu(); flyout.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true'); UI.pushEsc(closeMenu, 'menu'); };
  const closeMenu = () => { flyout.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); UI.popEsc('menu'); };
  /* 열려 있는 메뉴를 통째로 다시 그리면 사용자가 누르려던 버튼이 커서 밑에서 사라진다
   * (저장소 사용량 갱신이 800ms 디바운스로 들어와 클릭을 삼키던 실제 결함).
   * 항목 구성이 그대로면 라벨·배지만 제자리에서 고친다. */
  function refreshMenu() {
    if (!flyout) return;
    if (!flyout.classList.contains('open')) { renderMenu(); return; }
    for (const [g] of GROUPS) {
      for (const it of registry[g]) {
        const b = flyout.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(it.id) : it.id));
        const shown = !it.when || it.when();
        if (!b || !shown) { renderMenu(); return; }               // 구성이 바뀌었으면 어쩔 수 없이 재구성
        const lab = b.querySelector('.mi-label');
        const text = typeof it.label === 'function' ? it.label() : it.label;
        if (lab && lab.textContent !== text) lab.textContent = text;
        const badge = it.badge ? it.badge() : false;
        b.classList.toggle('has-badge', !!badge);
        if (typeof badge === 'string') b.dataset.badge = badge; else b.removeAttribute('data-badge');
        b.classList.toggle('on', !!(it.active && it.active()));
      }
    }
  }
  UI.menu = { open: openMenu, close: closeMenu, refresh: refreshMenu, toggle: () => (flyout.classList.contains('open') ? closeMenu() : openMenu()) };

  /* ---------- 분할 배치 ----------
   * 패널이 슬라이드 위에 떠서 가리던 것을, 무대를 왼쪽으로 좁히고 패널을 오른쪽에 나란히 두도록 바꿨다
   * (사용자 요청 2026-09-07). 덱 배율은 좁아진 무대 기준으로 다시 잰다 —
   * 그래서 fit() 이 window 가 아니라 #stage 실측을 쓰게 했다.
   * 화면이 좁으면(<1100px) 좁혀 봐야 덱이 너무 작아지므로 종전처럼 덮는다. */
  const SPLIT_MIN = 1100;
  /* 패널을 왼쪽 슬라이드와 같은 높이·같은 윗선에 맞춘다(사용자 요청).
   * 덱을 '실측'하면 안 된다 — #stage 에 전환이 걸려 있어 여닫는 순간의 중간값을 재게 된다.
   * 배율 공식이 fit() 과 같으므로 여기서도 계산으로 구한다(타이밍 무관). */
  function alignPanel() {
    const reserved = document.body.classList.contains('split')
      ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'), 10) || 0) : 0;
    const scale = Math.min(Math.max(320, window.innerWidth - reserved) / 1280, window.innerHeight / 720);
    const h = Math.round(720 * scale);
    document.documentElement.style.setProperty('--deck-top', Math.round((window.innerHeight - h) / 2) + 'px');
    document.documentElement.style.setProperty('--deck-h', h + 'px');
  }
  function splitFor(p) {
    const w = parseInt((p.el && p.el.style.width) || getComputedStyle(p.el).width, 10) || 400;
    if (window.innerWidth < SPLIT_MIN) { unsplit(); return; }
    document.documentElement.style.setProperty('--panel-w', (w + 32) + 'px');
    document.body.classList.add('split');
    alignPanel();
    if (Deck.nav && Deck.nav.fit) requestAnimationFrame(() => Deck.nav.fit());
  }
  function unsplit() {
    document.body.classList.remove('split');
    alignPanel();
    if (Deck.nav && Deck.nav.fit) requestAnimationFrame(() => Deck.nav.fit());
  }
  UI.split = { on: () => document.body.classList.contains('split'), refresh: () => { const p = panels[currentPanel]; if (p) splitFor(p); else unsplit(); } };
  UI.split.align = alignPanel;
  window.addEventListener('resize', () => UI.split.refresh());
  document.addEventListener('fullscreenchange', () => UI.split.refresh());

  /* ---------- panels ---------- */
  UI.panel = {
    register(name, opts) {
      if (panels[name]) return panels[name];
      const el = U.el('section', { class: 'dpanel', id: 'panel-' + name, 'data-ui': '', role: 'dialog', 'aria-label': opts.title });
      if (opts.width) el.style.width = opts.width;
      const titleWrap = U.el('div', { class: 'panel-title' }, [U.el('b', { text: opts.title }), U.el('small', { text: opts.subtitle || '' })]);
      const closeBtn = U.el('button', { type: 'button', class: 'panel-close', title: '닫기 (Esc)', 'aria-label': '닫기', text: '×' });
      closeBtn.addEventListener('click', () => UI.panel.close(name));
      const head = U.el('div', { class: 'panel-head' }, [titleWrap, closeBtn]);
      const body = U.el('div', { class: 'panel-body' });
      const foot = U.el('div', { class: 'panel-foot' });
      el.append(head, body, foot);
      // keep keyboard/pointer events inside the panel from reaching deck-level handlers
      ['click', 'dblclick', 'mousedown', 'pointerdown', 'wheel', 'touchstart'].forEach(t => el.addEventListener(t, e => e.stopPropagation()));
      panelHost.append(el);
      panels[name] = { name, el, opts, head, body, foot, titleWrap };
      if (opts.build) opts.build(body, foot, panels[name]);
      return panels[name];
    },
    open(name) {
      const p = panels[name]; if (!p) return;
      if (currentPanel && currentPanel !== name) UI.panel.close(currentPanel, true);
      closeMenu();
      p.el.classList.add('open'); currentPanel = name;
      splitFor(p);                                   // 무대를 좁혀 패널과 나란히 (가리지 않게)
      if (p.opts.onOpen) p.opts.onOpen(p);
      UI.pushEsc(() => UI.panel.close(name), 'panel:' + name);
      U.emit('deck:panel', { name, open: true });
    },
    close(name, silent) {
      name = name || currentPanel;
      const p = panels[name]; if (!p || !p.el.classList.contains('open')) return;
      // 숨기기 '전에' 포커스를 빼낸다(#17). 포커스가 안에 있는 채로 감추면 그 프레임 동안
      // 포커스가 사라진 요소에 남아 스크린리더·탭 순서가 엉킨다.
      if (p.el.contains(document.activeElement)) UI.focusStage();
      p.el.classList.remove('open');
      if (currentPanel === name) currentPanel = null;
      if (!currentPanel) unsplit();
      UI.popEsc('panel:' + name);
      if (p.opts.onClose) p.opts.onClose(p);
      if (!silent) UI.focusStage();
      U.emit('deck:panel', { name, open: false });
    },
    toggle(name) { return UI.panel.isOpen(name) ? UI.panel.close(name) : UI.panel.open(name); },
    isOpen(name) { return !!(panels[name] && panels[name].el.classList.contains('open')); },
    current() { return currentPanel; },
    get(name) { return panels[name]; },
  };

  /* ---------- dialog ---------- */
  UI.dialog = opts => new Promise(resolve => {
    const dlg = U.el('dialog', { class: 'ddialog' + (opts.wide ? ' wide' : ''), 'data-ui': '' });
    const body = U.el('div', { class: 'dlg-body' });
    if (typeof opts.body === 'function') opts.body(body); else if (opts.body) body.innerHTML = opts.body;
    const btns = U.el('div', { class: 'dlg-buttons' });
    const buttons = opts.buttons || [{ id: 'cancel', label: '취소' }, { id: 'ok', label: '확인', primary: true }];
    let settled = false;
    const done = id => {
      if (settled) return; settled = true;
      UI.popEsc('dialog');
      if (dlg.contains(document.activeElement)) UI.focusStage();   // 닫기 전에 포커스 이동(#17)
      try { dlg.close(); } catch (e) { /* already closed */ }
      dlg.remove();
      UI.focusStage();
      resolve(id);
    };
    buttons.forEach(b => btns.append(U.el('button', { type: 'button', id: 'dlg-' + b.id, class: (b.primary ? 'primary' : '') + (b.danger ? ' danger' : ''), text: b.label, onclick: () => done(b.id) })));
    dlg.append(U.el('div', { class: 'dlg-title', text: opts.title || '' }), body, btns);
    dlg.addEventListener('cancel', e => { e.preventDefault(); done('cancel'); });
    dlg.addEventListener('click', e => { if (e.target === dlg) done('cancel'); });
    ['keydown', 'keyup', 'keypress'].forEach(t => dlg.addEventListener(t, e => e.stopPropagation()));
    document.body.append(dlg);
    UI.pushEsc(() => done('cancel'), 'dialog');
    dlg.showModal();
    const first = dlg.querySelector('textarea,input:not([type=checkbox]),button.primary');
    if (first) first.focus();
    if (opts.onShow) opts.onShow(dlg, done);
  });
  UI.confirm = (title, html, okLabel, danger) => UI.dialog({ title, body: html, buttons: [{ id: 'cancel', label: '취소' }, { id: 'ok', label: okLabel || '확인', primary: true, danger }] }).then(r => r === 'ok');

  /* ---------- bootstrap ---------- */
  UI.ensure = () => {
    if (host) return;
    host = U.el('div', { id: 'deck-ui', 'data-ui': '' });
    menuBtn = U.el('button', { type: 'button', id: 'deck-menu-toggle', 'aria-expanded': 'false', 'aria-haspopup': 'true', title: '검토 도구 메뉴', text: '메뉴' });
    flyout = U.el('div', { id: 'deck-menu', role: 'menu' });
    panelHost = U.el('div', { id: 'deck-panels' });
    menuBtn.addEventListener('click', e => { e.stopPropagation(); UI.menu.toggle(); });
    flyout.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', e => { if (flyout.classList.contains('open') && !flyout.contains(e.target) && e.target !== menuBtn) closeMenu(); });
    host.append(menuBtn, flyout, panelHost);
    document.body.append(host);
    UI.registerMenu('present', { id: 'menu-fullscreen',
      label: () => (Deck.nav && Deck.nav.isFs && Deck.nav.isFs() ? '전체화면 끄기' : '전체화면'),
      active: () => !!(Deck.nav && Deck.nav.isFs && Deck.nav.isFs()),
      onClick: () => Deck.nav.toggleFs() });
    UI.registerMenu('present', { id: 'menu-nav-alpha',
      label: () => '네비 투명도 · ' + Deck.nav.navAlpha(),
      onClick: () => U.toast('네비 투명도 · ' + Deck.nav.cycleNavAlpha()) });
    UI.registerMenu('present', { id: 'menu-first', label: '처음 슬라이드로', hint: 'Home', onClick: () => Deck.nav.show(0) });
    UI.registerMenu('present', { id: 'menu-help', label: '단축키 도움말', onClick: () => UI.dialog({ title: '단축키', body: HELP_HTML(), buttons: [{ id: 'ok', label: '닫기', primary: true }] }) });
    renderMenu();
    UI.setMode('present');
    document.addEventListener('deck:state', () => { if (flyout.classList.contains('open')) renderMenu(); });
  };
})();

/* ==== 50-textedit.js ==== */
/* 50-textedit.js — click-to-edit text keyed by data-key (never by DOM position). */
Deck.textedit = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  let active = false, hover = null, help = null;
  const sel = key => '[data-key="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]';

  const originals = new Map();   // data-key -> pristine text as delivered in the file
  /* textContent 로 읽는다. innerText 는 **렌더된 것만** 돌려주는데, 이 덱은 한 장만 보이고
   * 나머지 18장은 visibility:hidden 이라 innerText 가 전부 '' 다.
   * innerText 로 캡처하면 584개 키 중 561개의 '원문'이 '' 로 잡히고(실측),
   * 내보낼 때 '원문으로 되돌리기'가 그 561곳의 글자를 지운다 = 검토본이 빈 카드로 나간다.
   * 비교·복원도 같은 축(textContent)으로 해야 한다. */
  const captureOriginals = () => { if (originals.size) return; document.querySelectorAll('#deck [data-key]').forEach(el => originals.set(el.dataset.key, el.textContent)); };
  /* 읽기·쓰기의 **유일한 축**. 편집기도 이것을 쓴다 — 종전에는 편집기만 innerText 라
   * ①보이지 않는 장을 열면 빈 칸이 뜨고 ②줄바꿈이 편집 직후엔 <br> 로 보이다가
   * 재적용(textContent) 뒤 한 줄로 뭉개졌다. 파일 머리의 규칙이 같은 파일 안에서 깨져 있었다. */
  const textFor = el => (el ? el.textContent : '');
  /* 줄바꿈이 든 값에만 표시를 단다. 슬라이드 전체에 pre-wrap 을 걸면 기존 마크업의 공백
   * 처리가 바뀌어 레이아웃이 흔들린다 — 표시가 붙은 요소만 도구 CSS 가 여러 줄로 보여 준다. */
  /* 글자만 바꾸고 **마크업은 남긴다.** `textContent` 를 통째로 대입하면 `<br>`·span·중첩
   * data-key 가 사라지고, 내보내기의 원문 복원도 같은 대입이라 검토본에 평문이 나가 다시 열면
   * 그것이 원문이 된다(실측 2026-09-15: 표지 제목의 줄바꿈·색 span). 앞뒤 공통 부분을 뺀
   * 가운데만 텍스트 노드 안에서 갈아 끼운다 — 축은 그대로 textContent 이고, 텍스트 노드가
   * 하나뿐인 요소에서는 종전 대입과 결과가 같다. */
  const putText = (el, v) => {
    const old = el.textContent;
    v = String(v);
    if (old === v) return;
    let a = 0, z = 0;
    while (a < old.length && a < v.length && old[a] === v[a]) a++;
    while (z < old.length - a && z < v.length - a && old[old.length - 1 - z] === v[v.length - 1 - z]) z++;
    const from = a, to = old.length - z, ins = v.slice(a, v.length - z);
    const nodes = [], wk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n; (n = wk.nextNode());) nodes.push(n);
    if (!nodes.length) { el.append(ins); return; }
    let seen = 0, put = false;
    for (const node of nodes) {
      const s = seen, len = node.nodeValue.length;
      seen += len;
      const lo = Math.max(from, s), hi = Math.min(to, s + len);
      if (hi > lo || (!put && from >= s && from <= s + len)) {   // 바뀌는 구간과 겹치거나, 삽입 자리가 이 노드 안
        node.nodeValue = node.nodeValue.slice(0, lo - s) + (put ? '' : ins) + node.nodeValue.slice(Math.max(hi, lo) - s);
        put = true;
      }
    }
  };
  const newlines = s => (String(s).match(/\n/g) || []).length;
  /* 표시는 **사용자가 줄을 더했을 때만** 단다. 원문이 소스 들여쓰기로 `\n` 을 품고 있으면
   * (표지 제목이 그렇다) 한 글자만 고쳐도 pre-wrap 이 걸려 들여쓰기가 화면에 드러난다. */
  const setText = (el, v) => {
    putText(el, v);
    const o = originals.get(el.dataset.key);
    el.toggleAttribute('data-multiline', newlines(v) > (o == null ? 0 : newlines(o)));
  };
  const apply = () => {
    captureOriginals();
    for (const [k, v] of Object.entries(S.data.edits)) {
      const el = document.querySelector(sel(k));
      if (el) setText(el, v);
    }
  };
  const revertAll = () => { originals.forEach((v, k) => { const el = document.querySelector(sel(k)); if (el) setText(el, v); }); };
  const originalOf = key => (originals.has(key) ? originals.get(key) : null);
  const orphanKeys = () => Object.keys(S.data.edits).filter(k => !document.querySelector(sel(k)));

  function setHover(el) {
    if (hover === el) return;
    if (hover) hover.classList.remove('edit-hover');
    hover = el;
    if (hover) hover.classList.add('edit-hover');
  }
  function openEditor(el) {
    const key = el.dataset.key;
    let ta;
    UI.dialog({
      title: '텍스트 수정',
      body: b => {
        b.append(U.el('p', { text: '내용을 수정한 후 적용을 누르세요. 줄바꿈도 반영됩니다. (⌘/Ctrl+Enter 적용)' }));
        ta = U.el('textarea', { id: 'textedit-input' });
        ta.value = textFor(el);
        b.append(ta);
      },
      buttons: [{ id: 'cancel', label: '취소' }, { id: 'apply', label: '적용', primary: true }],
      onShow: (dlg, done) => { ta.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); done('apply'); } }); },
    }).then(r => {
      if (r !== 'apply') return;
      const v = ta.value;
      setText(el, v);
      S.data.edits[key] = v;
      /* setText 는 textContent 를 통째로 갈아 끼우므로 서식 span 이 날아가고, 글자 수가
       * 바뀌었으면 범위 오프셋도 무효가 된다. reflow 가 새 길이로 자르고 다시 그린다 —
       * 이걸 빠뜨리면 «고친 뒤 색이 사라지거나 엉뚱한 글자에 붙는다». */
      if (Deck.textstyle) Deck.textstyle.reflow(el);
      S.commit('텍스트 수정: ' + key);
    });
  }
  function enter() {
    if (active) return;
    active = true;
    UI.setMode('edit');
    if (!help) { help = U.el('div', { id: 'edit-help', 'data-ui': '', text: '클릭: 고르기 · 더블클릭: 내용 수정 · 위 툴바: 크기·정렬·색 · Esc: 종료' }); document.body.append(help); }
    help.hidden = false;
    if (Deck.textstyle) Deck.textstyle.show(true);
    UI.pushEsc(exit, 'edit');
    UI.menu.refresh();
  }
  function exit() {
    if (!active) return;
    active = false;
    setHover(null);
    if (Deck.textstyle) Deck.textstyle.show(false);
    if (help) help.hidden = true;
    UI.popEsc('edit');
    UI.setMode('present');
    UI.focusStage();
    UI.menu.refresh();
  }
  function init() {
    document.addEventListener('mouseover', e => {
      if (!active) return;
      const el = e.target.closest && e.target.closest('#deck [data-key]');
      setHover(el || null);
    }, true);
    /* 클릭은 **고르기**, 더블클릭이 **내용 수정**이다(사용자 결정 2026-09-10).
     * 종전에는 클릭이 곧 다이얼로그였다 — 그러면 서식 툴바로 한 요소에 여러 번 손댈 때마다
     * 다이얼로그를 열고 닫아야 한다. 이 변경은 회귀가 단언하던 동작이라 테스트도 함께 옮겼다. */
    document.addEventListener('click', e => {
      if (!active) return;
      if (e.target.closest && e.target.closest('[data-ui],dialog')) return;
      const el = e.target.closest && e.target.closest('#deck [data-key]');
      if (!el) return;
      e.preventDefault(); e.stopPropagation();
      if (Deck.textstyle) Deck.textstyle.select(el);
    }, true);
    document.addEventListener('dblclick', e => {
      if (!active) return;
      if (e.target.closest && e.target.closest('[data-ui],dialog')) return;
      const el = e.target.closest && e.target.closest('#deck [data-key]');
      if (!el) return;
      e.preventDefault(); e.stopPropagation();
      openEditor(el);
    }, true);
    UI.registerMenu('review', { order: 30, id: 'menu-textedit', label: () => (active ? '텍스트 수정 종료' : '텍스트 수정'), active: () => active, onClick: () => (active ? exit() : enter()) });
  }
  return { init, enter, exit, apply, revertAll, originalOf, orphanKeys, textFor, putText, openEditor, isActive: () => active };
})();

/* ==== 52-textstyle.js ==== */
/* 52-textstyle.js — 요소·범위 단위 서식(크기·정렬·색). 텍스트 자체는 50 이 textContent 로 쥔다.
 *
 * 50 과 나눠 사는 이유: 50 은 축이 한 줄로 설명되는 파일이다("읽기·쓰기의 유일한 축은
 * textContent"). 서식은 텍스트가 아니라 스타일이라 `edits` 가 아니라 `styles` 에 산다.
 *
 * ★ 부분 선택이 그 축을 깨지 않는다(2026-09-10 실측으로 1차 판단을 뒤집었다).
 *   `"INTRO"` → `<span>IN</span>TRO` 로 만들어도 **textContent 는 "INTRO" 그대로**다.
 *   그래서 범위 서식을 `styles[k].runs` 에 **문자 오프셋**으로 두고 **화면에 그릴 때만**
 *   span 을 만든다. span 은 순수 표현 계층이라 cleanClone() 이 원문으로 되돌릴 때 사라지고,
 *   다시 열면 상태에서 재생성된다. `edits` 는 끝까지 평문이다.
 *
 * 모드는 새로 만들지 않는다. 툴바는 '텍스트 수정'(mode-edit) 안에서 뜬다 —
 * 별도 모드를 파면 Esc 스택과 UI.setMode 가 50 과 서로를 덮는다.
 */
Deck.textstyle = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  const SEL = key => '[data-key="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]';
  const MIN = 0.6, MAX = 2.0, STEP = 0.1;
  const RECENT_KEY = 'dommint:fmt-recent';   // 검토자 개인의 편의다 — 덱 상태가 아니다
  /* 첫 줄은 **덱의 :root 에서 읽는다**. 하드코딩하면 다른 고객 덱에서 브랜드와 어긋난다. */
  const DECK_VARS = [['--ink', '#141821'], ['--lg', '#A50034'], ['--blue', '#0072CE'],
                     ['--teal', '#00A19A'], ['--amber', '#d97706'], ['--green', '#2e9e4f']];
  const GREYS = ['#000000', '#1f2937', '#374151', '#4b5563', '#6b7280', '#9ca3af', '#d1d5db', '#e5e7eb', '#f3f4f6', '#ffffff'];
  const HUES = [['#7f1d1d', '#dc2626', '#f87171'], ['#7c2d12', '#ea580c', '#fb923c'],
                ['#713f12', '#ca8a04', '#facc15'], ['#14532d', '#16a34a', '#4ade80'],
                ['#1e3a8a', '#2563eb', '#60a5fa'], ['#4c1d95', '#7c3aed', '#a78bfa']];

  let toolbar = null, palette = null, target = null, pending = null, stale = 0;

  /* 색 목록만 내보낸다 — **팔레트 UI 는 표면마다 다르다**(여긴 본 창 팝오버, 발표자 뷰는
   * 별창 툴바 한 줄). 색이 두 벌이면 «이 덱의 색» 이라는 범위 원칙이 한쪽에서만 산다. */
  Deck.palette = () => ({
    deck: DECK_VARS.map(([v, fb]) => ((deck() ? getComputedStyle(deck()).getPropertyValue(v).trim() : '') || fb)),
    greys: GREYS.slice(),
    hues: HUES.map(t => t.slice()),
  });

  const deck = () => document.getElementById('deck');
  const styles = () => S.data.styles || (S.data.styles = {});
  const styleOf = key => styles()[key] || null;
  /* leaf 만 부분 선택을 받는다. 자식이 있는 요소(실측 562개 중 50개)는 그 자식이 대개
   * 또 data-key 이거나 `.dot`·`.toc-p` 같은 **구조 span** 이라, 오프셋으로 쪼개면 마크업이 깨진다.
   *
   * ⚠ **내가 만든 서식 span 은 세지 않는다.** `children.length === 0` 으로 재면 한 번 서식을 준
   * 순간 그 요소가 leaf 가 아니게 되어 **두 번째부터 부분 선택이 죽는다**(실측으로 잡았다).
   * 여기서 묻는 것은 «원래 구조가 있느냐» 지 «지금 자식이 있느냐» 가 아니다. */
  const isLeaf = el => !!el && [...el.children].every(c => c.hasAttribute('data-fmt-run'));

  /* ---------- 배수 → px ----------
   * 배수를 `em` 에 그대로 실으면 **오히려 작아진다**: `font-size:1.2em` 은 부모 기준이라
   * `.title{42px}` 에 걸어도 부모가 16px 이면 19.2px 이 된다. 그래서 인라인을 씌우기 **전에**
   * 실측 px 를 잡아 두고 `base * size` 를 px 로 쓴다 → 멱등.
   *
   * 안 보이는 장에서도 값이 나와야 한다. `.slide` 는 `display:block` + `visibility:hidden`
   * 이라 getComputedStyle 이 정상값을 준다 — `display:none` 이면 0 이 나오고 **모든 서식이
   * 조용히 사라진다**. test_textstyle.py 가 이 사실을 못박는다(v43 과 같은 자리). */
  const bases = new Map();
  /* 🔴 **덱 원본의 인라인 선언을 기억해 둔다.** 도구가 `setProperty` 로 덮어쓰면 원본 값이
   * 그 자리에서 사라지고, 되돌릴 때 `removeProperty` 만 하면 **원본까지 같이 지워진다.**
   *
   * 실측 2026-09-11(고객 A v21 흡수 · 도구를 한 번도 안 쓰고 `revertAll()` 만 호출):
   * 인라인 font-size 요소 **6 → 1**. 살아남은 하나는 **`data-key` 가 없는 것**이었다 —
   * `revertAll` 이 `[data-key]` 를 전부 돌며 세 속성을 지웠기 때문이다. 표지 `(VAT별도)` 가
   * 15px → 22px 로 커졌다. ***사용자가 자기 작업을 되돌리려고 누른 버튼이 고객 덱의 원본
   * 디자인을 바꿨다*** — 「DomMint 는 도구다, 덱이 아니다」의 선을 넘는 자리다.
   * 게다가 작은 글씨 하나가 커진 것이라 **화면에서 거의 안 보인다.** */
  const OWNED = ['font-size', 'text-align', 'color'];
  const origins = new Map();
  const originOf = el => {
    const k = el.dataset.key;
    if (!origins.has(k)) {
      const o = {};
      for (const p of OWNED) o[p] = [el.style.getPropertyValue(p), el.style.getPropertyPriority(p)];
      origins.set(k, o);
    }
    return origins.get(k);
  };
  const baseOf = el => {
    const k = el.dataset.key;
    originOf(el);                       // **덮어쓰기 전에** 원본을 잡는다 — paint 의 첫 줄이 여기다
    if (!bases.has(k)) bases.set(k, parseFloat(getComputedStyle(el).fontSize) || 0);
    return bases.get(k);
  };
  const captureBases = () => { deck() && deck().querySelectorAll('[data-key]').forEach(baseOf); };

  /* 인라인 + !important 로 넣는다.
   * ①CSS 규칙으로는 못 이긴다 — 도구 CSS 는 `@layer tools` 라 deck 계층을 언제나 이기고 그 반대도다.
   * ②**인라인만으로도 못 이긴다** — 이 덱은 `font-size` 에만 `!important` 를 57곳 쓴다
   *   (`.uc-left{font-size:11px!important}`). 실측: 인라인 12.1px 인데 computed 는 11px 이었다.
   * → 인라인 + !important 가 저자 스타일의 최상위다. */
  const css = (el, prop, v) => (v ? el.style.setProperty(prop, v, 'important') : el.style.removeProperty(prop));
  /* 도구가 값을 거두면 **지우는 것이 아니라 덱 원본으로 되돌린다.** 지우면 원본이 같이 간다. */
  const put = (el, prop, v) => {
    if (v) return el.style.setProperty(prop, v, 'important');
    el.style.removeProperty(prop);
    const [ov, op] = originOf(el)[prop] || ['', ''];
    if (ov) el.style.setProperty(prop, ov, op);
  };

  /* ---------- 범위 → 구간 ----------
   * 문자마다 «어느 run 이 이기나» 를 적고 연속된 것을 잇는다. 겹치면 **나중 것이 이긴다**.
   * 구간 자료구조를 따로 두지 않는 이유: 한 요소의 글자 수는 수십~수백이라 O(n) 이 더 싸고,
   * 겹침·인접·포함을 특수 처리할 필요가 없어 틀릴 자리가 없다. */
  function segments(len, runs) {
    const at = new Array(len).fill(null);
    for (const r of runs || []) {
      const from = Math.max(0, Math.min(len, r.from | 0));
      const to = Math.max(from, Math.min(len, r.to | 0));
      for (let i = from; i < to; i++) {
        /* **속성별로** 이긴다. run 을 통째로 덮으면 «크게 한 뒤 색을 주니 크기가 사라졌다» 가
         * 난다(실측 2026-09-10: color 만 든 마지막 run 이 앞의 size 를 지웠다). */
        const now = at[i] ? { size: at[i].size, color: at[i].color } : {};
        if (r.size != null) now.size = r.size;
        if (r.color) now.color = r.color;
        at[i] = now;
      }
    }
    const same = (a, b) => (!a && !b) || (!!a && !!b && a.size === b.size && a.color === b.color);
    const out = [];
    for (let i = 0; i < len; i++) {
      const last = out[out.length - 1];
      /* 값으로 견준다 — 위에서 문자마다 새 객체를 만들므로 참조 비교는 늘 거짓이다. */
      if (last && same(last.r, at[i])) last.to = i + 1;
      else out.push({ r: at[i], from: i, to: i + 1 });
    }
    return out;
  }

  /* 오프셋만으로는 «밀림» 을 못 잡는다.
   *
   * clamp 는 **넘침**만 막는다. 본문 **앞에** 낱말을 끼워 넣으면 모든 오프셋이 뒤로 밀리는데
   * **길이는 오히려 늘어나** clamp 를 그대로 통과한다. 실측(2026-09-10): `'고객 B'` 에 준
   * 서식이 `'신규 핀'` 에 붙었다 — 이 계획이 *"가장 나쁘다"* 고 적어 둔 바로 그 상황이다.
   * (검토 세션이 발표자 뷰 대본에서 같은 구멍을 짚어 왔다. 대본은 «앞에 한 줄
   *  추가» 가 일상이고, 엑셀 가져오기는 전 슬라이드 본문을 한꺼번에 갈아끼운다.)
   *
   * 그래서 run 에 **그때 그 글자(`text`)** 를 함께 적고, 그릴 때 대조한다. 어긋나면
   * ①**적용하지 않고** ②몇 건인지 말하고 ③**구간은 지우지 않는다** — 글자를 되돌리면
   * 다시 맞기 때문이다. `text` 가 없는 옛 run(1차 데이터)은 그대로 통과시킨다. */
  const fresh = (r, text) => !r.text || text.slice(r.from, r.to) === r.text;

  function paint(el, st) {
    const b = baseOf(el);
    put(el, 'font-size', (st && st.size && b) ? (b * st.size).toFixed(2) + 'px' : '');
    put(el, 'text-align', (st && st.align) || '');     // 블록 속성이라 범위에 줄 수 없다
    put(el, 'color', (st && st.color) || '');
    /* 🔴 종전에는 여기서 `isLeaf` 가 아니면 돌아섰고, 그래서 **제목 H1 과 목차 LI 에서는
     * 드래그해도 요소 전체가 바뀌었다**(사용자 신고 2026-09-11 · 자식 있는 것이 562 중 50개인데
     * 하필 가장 먼저 손대는 자리에 몰려 있다). 이제 `textContent` 를 통째로 다시 만들지 않고
     * **선택 구간에 걸린 텍스트 노드만 쪼개 감싼다** — `<br>` 도 기존 span 도 그대로 남는다.
     *
     * 계약은 그대로다: **상태에는 `textContent` 기준 오프셋만** 있고 span 은 그릴 때만 생긴다.
     * 저장 축과 렌더 축이 같은지 실측했다(2026-09-11): `el.textContent` 와 텍스트 노드를 걸어
     * 이은 문자열이 **완전히 같다** — `<br>` 은 양쪽 모두 **0 글자**다(줄로 세는 것은 `innerText`
     * 뿐이고 여기서는 안 쓴다). 그래서 이 둘 사이에 밀림이 없다. */
    unwrapRuns(el);
    const all = (st && st.runs) || [];
    const text = el.textContent;
    const runs = all.filter(r => fresh(r, text));
    stale += all.length - runs.length;
    if (!runs.length) return;
    for (const s of segments(text.length, runs)) if (s.r) wrapRange(el, s.from, s.to, s.r, b);
  }

  /* 지난번에 그린 span 만 푼다 — 구조는 건드리지 않는다(종전 leaf 경로는 textContent 를
   * 통째로 갈아 끼워 자식을 날렸다. 그래서 자식이 있으면 아예 돌아설 수밖에 없었다). */
  function unwrapRuns(el) {
    el.querySelectorAll('[data-fmt-run]').forEach(sp => sp.replaceWith(...sp.childNodes));
    el.normalize();                                  // 쪼개 둔 텍스트 노드를 도로 붙여 오프셋을 고른다
  }

  /* `textContent` 기준 [from, to) 에 걸린 텍스트 노드들을 쪼개 감싼다.
   * **먼저 다 찾아 두고 그 뒤에 쪼갠다** — `splitText` 가 순회 중인 트리를 바꾸기 때문이다. */
  function wrapRange(el, from, to, r, b) {
    const parts = [];
    let seen = 0, n;
    const wk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while ((n = wk.nextNode())) {
      const len = n.nodeValue.length, start = seen;
      seen += len;
      if (start + len <= from || start >= to) continue;
      parts.push({ node: n, a: Math.max(0, from - start), z: Math.min(len, to - start) });
    }
    for (const p of parts) {
      let node = p.node;
      if (p.z < node.nodeValue.length) node.splitText(p.z);
      if (p.a > 0) node = node.splitText(p.a);
      const sp = document.createElement('span');
      sp.setAttribute('data-fmt-run', '');
      if (r.size && b) css(sp, 'font-size', (b * r.size).toFixed(2) + 'px');
      if (r.color) css(sp, 'color', r.color);
      node.replaceWith(sp);
      sp.append(node);
    }
  }

  const apply = () => {
    captureBases();                      // 인라인을 씌우기 **전에** 원래 px 를 잡는다
    stale = 0;
    for (const [k, st] of Object.entries(styles())) {
      const el = deck() && deck().querySelector(SEL(k));
      if (el) paint(el, st);
    }
    /* 조용히 넘어가지 않는다 — 사용자가 «틀린 색을 옳은 것으로 읽는» 것이 이 기능의 최악이다. */
    if (stale && U.toast) U.toast('글자가 바뀐 곳 ' + stale + '건은 서식을 적용하지 않았습니다');
  };
  const revertAll = () => { if (deck()) deck().querySelectorAll('[data-key]').forEach(el => paint(el, null)); };

  /* 🔴 **내보낸 파일에 도구 흔적을 남기지 않는다.** 검토본은 `styles` 상태를 함께 싣고 가므로
   * 다시 열 때 서식이 재생성된다 — 파일에는 덱 원본만 남아야 한다. `95-export.js` 가
   * `data-fmt-run` span 을 같은 이유로 걷는데 **요소 자체의 인라인만 그때 안 걷혔다.**
   *
   * 남으면 조용히 쌓인다. 실측 2026-09-11: 크기를 준 뒤 내보내면
   * `style="font-size: 24.2px !important"` 가 그대로 실리고, **다시 열면 그 값이 base 가 되어
   * ×1.1 이 또 곱해진다**(24.2 → 26.62). 저장·재오픈을 반복할수록 글자가 커지고,
   * 되돌려도 덱 원본이 아니라 도구 값으로 돌아간다. 선택 표시(`fmt-sel`)까지 실려 나갔다. */
  const strip = root => {
    if (!root) return;
    root.querySelectorAll('.fmt-sel').forEach(el => el.classList.remove('fmt-sel'));
    /* 🔴 **도구가 실제로 그린 것만 손댄다.** `origins` 는 덱의 모든 `[data-key]` 를 담고 있어서
     * 그것을 다 돌면 값은 보존돼도 **덱 전체의 선언 순서가 재정렬된다**(실측: `font-size:15px;
     * opacity:.7` → `opacity:0.7; font-size:15px`). 값이 같아도 남의 파일을 그렇게 넓게 다시
     * 쓸 이유가 없다. `styles` 에 든 키만 되돌리면 나머지는 **한 바이트도 안 바뀐다.** */
    for (const k of Object.keys(styles())) {
      const el = root.querySelector(SEL(k));
      /* ⚠ `!o` 는 **지금은 안 닿는다** — 위 루프가 `styles` 키만 돌고, 그 키들은 한 번 이상
       * 그려졌으므로 `origins` 에 반드시 있다. **죽은 코드가 아니라 범위가 좁아서 안 닿는 것**이라
       * 지우지 않는다: 누가 이 루프를 다시 `[data-key]` 전체로 넓히면 **그 순간 닿고, 없으면
       * 기록 없는 요소의 덱 원본이 통째로 지워진다**(42번을 내보내기 쪽에서 되풀이하는 것이다 —
       * 실제로 이 고침의 1차안이 그랬다). 넓힐 사람은 이 가드를 먼저 읽어라. */
      const o = el && origins.get(k);
      if (!o) continue;
      for (const prop of OWNED) {
        el.style.removeProperty(prop);
        if (o[prop] && o[prop][0]) el.style.setProperty(prop, o[prop][0], o[prop][1]);
      }
      if (!el.getAttribute('style')) el.removeAttribute('style');   // 빈 껍데기도 흔적이다
    }
  };
  const orphanKeys = () => Object.keys(styles()).filter(k => !(deck() && deck().querySelector(SEL(k))));

  /* 글자가 바뀌면 오프셋이 무효가 된다 — 새 길이로 자르고 사라진 자리는 버린다.
   * 조용히 엉뚱한 글자에 색이 붙는 쪽이 가장 나쁘다. 50 의 setText 뒤에 불린다. */
  function reflow(el) {
    if (!el || !el.dataset.key) return;
    const k = el.dataset.key, st = styleOf(k);
    if (!st) return;
    if (st.runs) {
      /* clamp 는 **넘침**만 막는다(밀림은 위 `fresh` 가 그릴 때 막는다).
       * 지문이 어긋난 구간을 여기서 **지우지 않는 이유**: 글자를 되돌리면 다시 맞기 때문이다.
       * 사용자가 오타를 고쳤다 되돌리는 동안 서식이 영영 사라지면 그게 더 나쁘다. */
      const len = el.textContent.length;
      const kept = st.runs
        .map(r => ({ ...r, from: Math.min(r.from, len), to: Math.min(r.to, len) }))
        .filter(r => r.to > r.from);
      if (kept.length) st.runs = kept; else delete st.runs;
      if (!Object.keys(st).length) delete styles()[k];
    }
    paint(el, styleOf(k));
  }

  /* ---------- 선택 범위 ----------
   * `pending` 은 **`selectionchange` 한 곳에서만** 갱신한다. 종전에는 document 의 `mouseup` 과
   * 툴바 누름과 여기가 **세 겹으로** 같은 일을 했는데, 되돌려 재니 **셋 다 하나씩 빼도 아무 그물이
   * 울지 않았다**(2026-09-11) — 죽은 겹이 있어도 못 찾는 모양이었다. 한 곳으로 모았다. */
  function rangeIn(el) {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount || !el) return null;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.commonAncestorContainer)) return null;
    const pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    const from = pre.toString().length;
    const to = from + r.toString().length;
    return to > from ? { from, to } : null;
  }

  /* `textContent` 기준 [from, to) 를 실제 선택으로 되돌려 놓는다 — `rangeIn` 의 반대 방향이다. */
  function selectRange(el, from, to) {
    const pick = t => {
      let seen = 0, n;
      const wk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      while ((n = wk.nextNode())) {
        const len = n.nodeValue.length;
        if (seen + len >= t) return [n, t - seen];
        seen += len;
      }
      return null;
    };
    const a = pick(from), z = pick(to);
    if (!a || !z) return;
    const r = document.createRange();
    r.setStart(a[0], a[1]); r.setEnd(z[0], z[1]);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }

  /* ---------- 쓰기 ---------- */
  function write(patch) {
    if (!target) return;
    const k = target.dataset.key;
    const st = Object.assign({}, styleOf(k));
    /* 🔴 **누르는 그 순간의 선택을 직접 읽는다.** 종전에는 저장해 둔 `pending` 에만 기댔는데,
     * 실측 2026-09-11 로 그것이 **드래그가 아니라 「툴바 버튼을 누르는 순간의 mouseup」 에서**
     * 잡히고 있었다(툴바가 `pointerdown·mousedown·click` 만 막고 `mouseup` 은 안 막아 document
     * 까지 새어 나간 덕이다). 부분 적용이 그 우연에 기대고 있었고, 그래서 툴바 라벨은
     * «요소 전체» 라고 떠 있는데 실제로는 부분만 바뀌었다.
     * `isLeaf` 조건도 없앴다 — 이제 자식이 있어도 구간만 감싼다(사용자 요청). */
    const sel = rangeIn(target) || pending;
    const ranged = sel && ('size' in patch || 'color' in patch);
    if (ranged) {
      /* 같은 범위를 다시 손대면 **그 run 을 갱신한다.** 매번 덧붙이면 한 곳을 세 번 만졌을 때
       * runs 가 셋이 되어 상태가 부풀고 읽기 어려워진다. 다른 범위와 겹치는 것은 segments 가
       * 속성별로 정리하므로 여기서는 «같은 범위» 만 본다. */
      const runs = (st.runs || []).slice();
      const i = runs.findIndex(r => r.from === sel.from && r.to === sel.to);
      const run = Object.assign({}, i >= 0 ? runs[i] : { from: sel.from, to: sel.to });
      run.text = target.textContent.slice(sel.from, sel.to);           // 밀림 감지용 지문
      if (patch.size != null) run.size = patch.size;
      if (patch.color != null) run.color = patch.color;
      if (i >= 0) runs[i] = run; else runs.push(run);
      st.runs = runs;
    } else {
      Object.assign(st, patch);
      for (const f of Object.keys(st)) if (st[f] === null || st[f] === undefined) delete st[f];
    }
    if (Object.keys(st).length) styles()[k] = st; else delete styles()[k];
    paint(target, styleOf(k));
    /* 🔴 **고른 자리를 되돌려 놓는다.** `paint` 가 노드를 갈아 끼우면 선택이 날아가는데,
     * 그것을 «사용자가 선택을 풀었다» 로 읽으면 **두 번째 누름이 요소 전체로 간다**
     * (실측 2026-09-11: 크게를 연달아 누르니 둘째부터 `styles.size` 가 붙었다).
     * 되돌려 놓으면 라벨도 계속 사실이고, 연달아 누르는 실사용 흐름도 산다. */
    if (ranged) { selectRange(target, sel.from, sel.to); pending = sel; }
    sync();
    S.commit('서식: ' + k + (ranged ? ' (' + sel.from + '~' + sel.to + ')' : ''));
  }
  /* **한 자리에서** 답한다 — 라벨이 말하는 것과 버튼이 하는 것이 어긋나면 안 된다.
   * 실측 2026-09-11: 어긋나 있었다(라벨은 «요소 전체», 실제로는 부분 적용). */
  const liveRange = () => rangeIn(target) || pending;
  const curRunSize = () => {
    const st = target ? styleOf(target.dataset.key) : null;
    if (!st) return 1;
    const r = liveRange();
    if (r && st.runs) {
      const hit = st.runs.filter(x => x.from <= r.from && x.to >= r.to).pop();
      if (hit && hit.size) return hit.size;
    }
    return st.size || 1;
  };
  const bump = d => {
    if (!target) return;
    const next = Math.round(Math.min(MAX, Math.max(MIN, curRunSize() + d)) * 10) / 10;
    write({ size: (next === 1 && !liveRange()) ? null : next });   // 1 배는 '원본 그대로' 라 필드를 지운다
  };
  const setAlign = a => target && write({ align: (styleOf(target.dataset.key) || {}).align === a ? null : a });
  function setColor(c) {
    if (!target) return;
    write({ color: c });
    remember(c);
    if (palette) palette.classList.remove('open');
  }
  function clearOne() {
    if (!target) return;
    delete styles()[target.dataset.key];
    paint(target, null);
    sync();
    S.commit('서식 지움: ' + target.dataset.key);
  }

  /* 최근 색은 localStorage 에 둔다 — 검토자 개인의 편의지 덱과 함께 이동할 내용이 아니다.
   * (memoStyle 을 덱 상태로 옮긴 결정과 반대 방향이고, 기준은 «이것이 산출물의 일부인가» 다.) */
  function recent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } }
  function remember(c) {
    try {
      const arr = [c].concat(recent().filter(x => x !== c)).slice(0, 8);
      localStorage.setItem(RECENT_KEY, JSON.stringify(arr));
      if (palette) drawRecent();
    } catch (e) { /* 사파리 프라이빗 등 — 최근 색이 없다고 기능이 죽지는 않는다 */ }
  }

  /* ---------- 선택 ---------- */
  function select(el, range) {
    if (target && target !== el) target.classList.remove('fmt-sel');
    target = el;
    pending = range || null;
    if (target) target.classList.add('fmt-sel');
    sync();
  }

  function sync() {
    if (!toolbar) return;
    const st = target ? (styleOf(target.dataset.key) || {}) : null;
    toolbar.classList.toggle('nosel', !target);
    const lbl = toolbar.querySelector('.lbl');
    const r = liveRange();
    lbl.textContent = !target ? '고를 것' : (r ? '“…” ×' + curRunSize().toFixed(1) : '×' + curRunSize().toFixed(1));
    lbl.title = r ? ('고른 글자 ' + r.from + '~' + r.to + ' 에만 적용됩니다') : '요소 전체에 적용됩니다';
    toolbar.querySelectorAll('[data-align]').forEach(b => b.classList.toggle('on', !!st && st.align === b.dataset.align));
  }

  /* ---------- 아이콘 ----------
   * 엑셀·워드의 정렬 아이콘은 **가로 막대 4줄의 들쭉날쭉한 끝**으로 방향을 보인다.
   * 유니코드에 그 글자가 없다(`⬅ ⬛ ➡` 는 «이동» 으로 읽힌다 — 사용자 지적 2026-09-10). */
  const ALIGN_BARS = { left: [14, 9, 14, 6], center: [14, 8, 14, 6], right: [14, 9, 14, 6] };
  function alignIcon(kind) {
    const rows = ALIGN_BARS[kind];
    const bars = rows.map((w, i) => {
      const x = kind === 'left' ? 1 : kind === 'right' ? 15 - w : (16 - w) / 2;
      return '<rect x="' + x + '" y="' + (2 + i * 3.2) + '" width="' + w + '" height="1.8" rx=".9"/>';
    }).join('');
    return '<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">' + bars + '</svg>';
  }

  /* ---------- UI ---------- */
  function mk(attrs, fn) {
    const b = U.el('button', Object.assign({ type: 'button' }, attrs));
    if (fn) b.addEventListener('click', fn);
    return b;
  }
  function swatch(c, cls) {
    const b = mk({ class: 'sw' + (cls ? ' ' + cls : ''), dataset: { color: c }, style: 'background:' + c, title: c },
                 () => setColor(c));
    return b;
  }
  function drawRecent() {
    const host = palette.querySelector('.pal-recent');
    host.innerHTML = '';
    const arr = recent();
    host.parentElement.hidden = !arr.length;
    arr.forEach(c => host.append(swatch(c)));
  }
  function buildPalette() {
    const row = (label, kids) => U.el('div', { class: 'pal-row' }, [U.el('b', { text: label }), U.el('div', { class: 'pal-sw' }, kids)]);
    const deckColors = DECK_VARS.map(([v, fb]) => {
      const c = (deck() ? getComputedStyle(deck()).getPropertyValue(v).trim() : '') || fb;
      return swatch(c);
    });
    const std = [];
    GREYS.forEach(c => std.push(swatch(c)));
    HUES.forEach(t => t.forEach(c => std.push(swatch(c))));

    const head = U.el('div', { class: 'pal-head' }, [U.el('b', { text: '이 덱' })]);
    /* EyeDropper 가 없는 브라우저에서는 **버튼을 감춘다** — 눌러 보고 실패하는 항목을 두지 않는다(#22). */
    if (typeof window.EyeDropper === 'function') {
      head.append(mk({ class: 'pal-pick', id: 'fmt-eyedropper', title: '화면에서 색 집기 (스포이드)', text: '💉' }, pickFromScreen));
    }
    palette = U.el('div', { id: 'fmt-palette', 'data-ui': '' }, [
      head,
      U.el('div', { class: 'pal-sw' }, deckColors),
      row('표준', std),
      U.el('div', { class: 'pal-row', hidden: '' }, [U.el('b', { text: '최근' }), U.el('div', { class: 'pal-sw pal-recent' })]),
    ]);
    ['pointerdown', 'mousedown', 'click'].forEach(t => palette.addEventListener(t, e => e.stopPropagation()));
    document.body.append(palette);
    drawRecent();
  }
  /* 취소(Esc)는 조용히 끝낸다 — saveInPlace 의 AbortError 처리와 같은 규칙이다. */
  function pickFromScreen() {
    if (typeof window.EyeDropper !== 'function') return;
    new window.EyeDropper().open()
      .then(r => r && r.sRGBHex && setColor(r.sRGBHex))
      .catch(() => { /* 사용자가 취소했다 */ });
  }

  function build() {
    const size = U.el('div', { class: 'grp' }, [
      mk({ id: 'fmt-smaller', text: 'A−', title: '작게' }, () => bump(-STEP)),
      mk({ id: 'fmt-bigger', text: 'A+', title: '크게' }, () => bump(STEP)),
    ]);
    const align = U.el('div', { class: 'grp' }, ['left', 'center', 'right'].map(a => {
      const b = mk({ dataset: { align: a }, class: 'ico', title: { left: '왼쪽 맞춤', center: '가운데 맞춤', right: '오른쪽 맞춤' }[a] }, () => setAlign(a));
      b.innerHTML = alignIcon(a);
      return b;
    }));
    const colorBtn = mk({ id: 'fmt-color', class: 'ico', title: '글자 색' }, () => {
      if (!palette) buildPalette();
      const on = palette.classList.toggle('open');
      if (on) {
        const r = toolbar.getBoundingClientRect();
        palette.style.left = Math.max(8, r.left) + 'px';
        palette.style.top = (r.bottom + 6) + 'px';
      }
    });
    colorBtn.innerHTML = '<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">'
      + '<path d="M5 10 8 2l3 8h-2l-.6-1.7H7.6L7 10z"/><rect x="3" y="12" width="10" height="2.6" rx="1"/></svg>';
    const ops = U.el('div', { class: 'grp' }, [
      mk({ class: 'clear', id: 'fmt-clear', text: '↩ 서식' }, clearOne),
      mk({ id: 'fmt-text', text: '✏ 내용' }, () => target && Deck.textedit && Deck.textedit.openEditor(target)),
      mk({ class: 'done', id: 'fmt-done', text: '완료 (Esc)' }, () => Deck.textedit && Deck.textedit.exit()),
    ]);
    toolbar = U.el('div', { id: 'fmt-toolbar', 'data-ui': '' },
                   [U.el('span', { class: 'lbl', text: '고를 것' }), size, align, U.el('div', { class: 'grp' }, [colorBtn]), ops]);
    ['pointerdown', 'mousedown', 'click'].forEach(t => toolbar.addEventListener(t, e => e.stopPropagation()));
    document.body.append(toolbar);
  }

  function show(on) {
    if (!toolbar) build();
    if (!on) { select(null); if (palette) palette.classList.remove('open'); }
    toolbar.classList.toggle('open', !!on);
    sync();
  }

  function init() {
    build();
    /* 드래그가 끝난 자리에서 범위를 잡아 둔다 — 툴바를 누르는 순간 선택이 흐트러질 수 있다. */
    /* 라벨은 **누르기 전에** 사실을 말해야 한다 — 드래그로 골랐는지 아닌지를 사용자가 알아야
     * «전체가 바뀌었다» 에 놀라지 않는다. 그러려면 `pending` 이 **선택과 같이 가야** 한다:
     * 선택이 풀리면 같이 비운다. 안 비우면 라벨은 «고른 글자» 라고 떠 있는데 사용자 눈에는
     * 아무것도 안 골라져 있다 — 거짓말의 방향만 바뀔 뿐이다. */
    document.addEventListener('selectionchange', () => {
      if (!toolbar || !toolbar.classList.contains('open')) return;
      pending = target ? rangeIn(target) : null;
      sync();
    });
  }

  return { init, apply, revertAll, strip, orphanKeys, reflow, show, select, styleOf, baseOf, segments, fresh,
           staleCount: () => stale,
           isOpen: () => !!toolbar && toolbar.classList.contains('open'),
           target: () => target, range: () => pending };
})();

/* ==== 60-agenda.js ==== */
/* 60-agenda.js — Deck.structure: slide order / new / delete / merge / undo, applied from state on every load. */
Deck.structure = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  const deckEl = () => document.getElementById('deck');
  const L = () => [...deckEl().querySelectorAll(':scope > section.slide')];
  const byId = id => L().find(s => s.dataset.slideId === id);
  const title = s => s.dataset.slideTitle || s.dataset.section || ((s.querySelector('.s-title') || {}).textContent || '').trim() || s.dataset.slideId;
  const syncOrder = () => { S.data.order = L().map(s => s.dataset.slideId); };
  const cleanHtml = el => { const c = el.cloneNode(true); c.querySelectorAll('.pen-layer,.pano-overlay').forEach(x => x.remove()); c.classList.remove('active', 'prev'); return c.outerHTML; };
  let panel = null, list = null, summary = null, dragId = null;

  /* ---------- apply persisted structure to the DOM (boot + after import) ---------- */
  function apply() {
    const d = deckEl();
    const present = () => [...d.querySelectorAll(':scope > section.slide')];
    for (const [id, c] of Object.entries(S.data.created)) {
      if (present().find(s => s.dataset.slideId === id)) continue;
      const tmp = document.createElement('div'); tmp.innerHTML = c.html;
      const el = tmp.firstElementChild;
      if (!el) continue;
      const anchor = c.after && present().find(s => s.dataset.slideId === c.after);
      if (anchor) anchor.after(el); else d.append(el);
    }
    for (const id of S.data.deleted) { const el = present().find(s => s.dataset.slideId === id); if (el) el.remove(); }
    const all = present(); const map = new Map(all.map(s => [s.dataset.slideId, s]));
    const ordered = S.data.order.map(id => map.get(id)).filter(Boolean);
    const rest = all.filter(s => !S.data.order.includes(s.dataset.slideId));
    [...ordered, ...rest].forEach(s => d.append(s));
    syncOrder();
    /* 이름도 같이 맞춘다. 위 `syncOrder()` 가 순서를 DOM 에서 되살리는 것과 같은 방향이다 —
     * 다만 **DOM 에는 덱 이름을 말하는 것이 없다**(슬라이드의 `data-import*` 는 슬라이드와
     * 함께 죽는다). 그래서 남은 유일한 원천인 «파일이 싣고 있는 이름» 으로 되돌린다.
     * 비우지 않는 이유: 흡수해서 따라온 이름과 작성자가 정한 이름을 가를 근거가 상태에 없다
     * (`S.data.name` 은 맨 문자열이고 대입 3곳이 같은 필드다 — 10-state.js:344·380·392).
     * 그래서 «누가 정했나» 가 아니라 «이 파일이 그 이름을 싣고 있나» 를 묻는다.
     * 안 하면 슬라이드 0 장인 셸이 흡수해 온 이름을 탭 제목·파일명으로 계속 달고 있다
     * (이어붙이기는 deckId 를 그대로 두므로 그 이름이 셸 저장소에 남는다 — 10-state.js:389).
     * `commit` 하지 않는 것도 순서와 같다: 열어 보기만 해서는 로컬에 쓰지 않는다. */
    if (!S.data.order.length) S.data.name = (S.embedded && S.embedded.name) || '';
    applyChapters();                 // 오버뷰에서 바꾼 섹션을 복원한다
  }

  /* ---------- operations ---------- */
  function moveTo(id, newIndex) {
    const s = byId(id); if (!s) return;
    const slides = L();
    newIndex = Math.max(0, Math.min(slides.length - 1, newIndex));
    const from = slides.indexOf(s);
    if (from === newIndex) return;
    const ref = slides[newIndex];
    if (newIndex > from) ref.after(s); else ref.before(s);
    syncOrder();
    S.pushUndo({ t: 'order', id, from, to: newIndex });
    S.commit('순서 이동: ' + title(s) + ' → ' + (newIndex + 1) + '번');
    Deck.nav.show(L().indexOf(s));
    render();
  }
  function newSlideHtml(id, pos) {
    const k = n => ' data-key="' + id + ':t' + n + '"';
    return '<section class="slide" data-slide-id="' + id + '" data-chapter="NEW" data-section="새 슬라이드" data-slide-title="새 슬라이드">' +
      '<div class="unified-chapter"><div class="uc-left"' + k(1) + '>NEW</div><div class="uc-mid"' + k(2) + '>새 슬라이드</div><div class="uc-nav"></div></div>' +
      '<div class="pad" style="justify-content:center;gap:14px">' +
      '<div class="kicker"' + k(3) + '><span class="dot"></span>사용자 추가 슬라이드</div>' +
      '<div class="s-title"' + k(4) + '>새 슬라이드 제목</div>' +
      '<div class="s-sub"' + k(5) + '>여기에 넣을 내용을 ‘텍스트 수정’ 또는 ‘슬라이드 수정 · 영역지정 수정’으로 작성하세요. 최종 교정 시 반영됩니다.</div>' +
      '<div class="note" style="margin-top:8px"' + k(6) + '>＋ 신규 슬라이드 (위치: ' + pos + '번). 내용 지시를 남겨주시면 정식 디자인으로 완성합니다.</div>' +
      '</div></section>';
  }
  function createAfter(id) {
    const after = byId(id) || L()[Deck.nav.index()];
    const nid = 'slide-n' + Date.now().toString(36);
    const pos = L().indexOf(after) + 1;
    const tmp = document.createElement('div'); tmp.innerHTML = newSlideHtml(nid, pos + 1);
    const sec = tmp.firstElementChild;
    after.after(sec);
    S.data.created[nid] = { html: sec.outerHTML, after: after.dataset.slideId };
    syncOrder();
    S.pushUndo({ t: 'new', id: nid });
    S.commit('신규 슬라이드 추가: ' + nid + ' (' + (pos + 1) + '번 위치)');
    Deck.nav.show(pos);
    render();
    U.toast('새 슬라이드가 추가되었습니다');
    return nid;
  }
  async function remove(ids) {
    ids = ids.filter(byId);
    if (!ids.length) { U.toast('삭제할 슬라이드를 체크하세요'); return false; }
    const ok = await UI.confirm('슬라이드 삭제', '<p>' + ids.length + '개 슬라이드를 삭제할까요? (되돌리기 가능)</p>', '삭제', true);
    if (!ok) return false;
    for (const id of ids) {
      const el = byId(id); const at = L().indexOf(el);
      S.pushUndo({ t: 'del', id, html: cleanHtml(el), at });
      el.remove();
      if (S.data.created[id]) delete S.data.created[id];
      else if (!S.data.deleted.includes(id)) S.data.deleted.push(id);
      S.data.merges = S.data.merges.map(g => g.filter(x => x !== id)).filter(g => g.length > 1);
      S.addLog('삭제: ' + id);
    }
    syncOrder();
    S.commit();
    Deck.nav.rebuild();
    render();
    U.toast(ids.length + '개 슬라이드를 삭제했습니다');
    return true;
  }
  function merge(ids) {
    if (ids.length < 2) { U.toast('통합할 슬라이드를 2개 이상 체크하세요'); return; }
    S.data.merges.push(ids.slice());
    S.pushUndo({ t: 'merge' });
    S.commit('통합 요청: ' + ids.map(id => { const s = byId(id); return s ? title(s) : id; }).join(' + '));
    render();
    U.toast('통합 그룹으로 표시했습니다 (최종 교정 시 병합)');
  }
  function undo() {
    const u = S.popUndo();
    if (!u) { U.toast('되돌릴 작업이 없습니다'); return; }
    if (u.t === 'order') {

  const MAX_FILE = 10 * 1024 * 1024;

  const STATUS_IDLE = '첨부 파일과 메모는 자동 저장되며, 내보내기 파일 안에 함께 담깁니다.';

  const curId = () => Deck.nav.current().dataset.slideId;
  const hasNote = id => { const r = S.data.notes[id]; return !!(r && ((r.text || '').trim() || (r.files || []).length || (r.history || []).length)); };
  const fmtKB = n => Math.max(1, Math.ceil((n || 0) / 1024)) + ' KB';

  function saveText() {
    const id = els.ta.dataset.slide; if (!id) return;
    const rec = S.noteFor(id);

    els.status.textContent = '메모가 저장되었습니다 · ' + new Date().toLocaleTimeString('ko-KR');
  }
  const saveTextDebounced = U.debounce(saveText, 400);

  async function addFiles(files) {
    const id = curId(); const rec = S.noteFor(id); let n = 0, saved = 0;
    for (const f of files) {
      if (f.size > MAX_FILE) { U.toast(f.name + ': 10MB 이하 파일만 첨부할 수 있습니다'); continue; }
      // 이미지는 붙여넣기·파일 선택 어느 경로로 들어와도 같은 규칙으로 줄인다 (P0-4)
      const c = await U.compressImage(f);
      if (c.changed) saved += f.size - c.blob.size;
      const bid = U.uid('att');

      rec.files.push(bid); n++;

    if (n) S.commit('첨부 추가 ' + n + '건: ' + id);

    render();
  }

  /* 붙여넣기·드래그앤드롭 → 메모 첨부 (P0-4). 패널이 열려 있을 때만 받는다. */

  /* 이전 요청은 더 이상 새로 쌓이지 않지만(반영요청 등록 버튼 삭제), 옛 검토본에 남아 있을 수 있어

    S.commit('이전 요청 되살리기: ' + curId()); render();
  }
  function removeHistory(i) { S.noteFor(curId()).history.splice(i, 1); S.commit(); render(); }

  /* 첨부 목록은 **다 만든 뒤에 한 번에 갈아끼운다.**

   * 목록이 두 벌·세 벌이 됐다. 개수 표시는 배열 길이라 1로 맞으니 "숫자는 하나인데 두 개로

   * 붙어 있는 이전 렌더의 이미지가 깨진다. */
  let filesSeq = 0;
  async function renderFiles(rec) {
    const seq = ++filesSeq;
    const bids = [...(rec.files || [])];
    const items = [], fresh = [];
    for (const bid of bids) {
      const r = await U.idb.get(bid);
      const item = U.el('div', { class: 'file-item', dataset: { id: bid } });
      let thumb;
      if (r && r.blob && /^image\//.test(r.type)) { const url = URL.createObjectURL(r.blob); fresh.push(url); thumb = U.el('img', { src: url, alt: '' }); thumb.addEventListener('click', () => Deck.media && Deck.media.view(url, r.name)); }
      else thumb = U.el('div', { class: 'generic', text: r ? ((r.name.split('.').pop() || 'FILE').toUpperCase()) : '없음' });

      const del = U.el('button', { type: 'button', title: '첨부 삭제', text: '×' }); del.addEventListener('click', () => removeFile(bid));

  }
  function renderHistory(rec) {

  let active = PRESETS[0][0];
