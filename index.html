  }
  function pzCloseBlank() { UI.popEsc('pz-blank'); if (els.blank) { els.blank.remove(); els.blank = null; } }
  function pzAskBlank(txt, after) {
    pzCloseBlank();
    const inp = U.el('input', { type: 'text', id: 'pz-blank-in', placeholder: '무엇으로 바꿀까요 (비우면 ____ 로 남깁니다)' });
    const ok = U.el('button', { type: 'button', id: 'pz-blank-ok', text: '확인' });
    const done = () => { pzInsert(txt.replace('____', inp.value.trim() || '____')); pzCloseBlank(); };
    ok.addEventListener('click', done);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(); } });
    els.blank = U.el('div', { class: 'pz-blank', id: 'pz-blank' }, [inp, ok]);
    after.after(els.blank);
    // Esc 는 키 라우터가 capture 로 먼저 채 간다(30-keys.js). stopPropagation 으로는 못 막으니
    // 이 코드베이스가 그 층위를 위해 둔 esc 스택에 얹는다 — 빈칸 입력이 패널보다 위다.
    UI.pushEsc(pzCloseBlank, 'pz-blank');
    inp.focus();
  }
  /** 검색어가 있으면 접힘을 무시하고 매칭만 보여 준다. 지우면 원래 접힘 상태로 돌아온다. */
  function pzFilter(q) {
    q = (q || '').trim().toLowerCase();
    const hits = {};
    els.presets.querySelectorAll('.pz-items').forEach(box => {
      let hit = 0;
      box.querySelectorAll('.pz').forEach(b => {
        const m = !q || (b.textContent + ' ' + b.title).toLowerCase().includes(q);
        b.hidden = !m; if (m) hit++;
      });
      hits[box.dataset.cat] = hit;
      // 검색 중엔 고른 카테고리를 무시하고 **매칭된 것 전부**를 오른쪽에 편다 — 이 동작이 이 UI 의 핵심이다.
      box.hidden = q ? hit === 0 : box.dataset.cat !== active;
    });
    els.presets.querySelectorAll('button.cat').forEach(h => {
      const cat = h.dataset.cat;
      h.classList.toggle('on', !q && cat === active);
      h.setAttribute('aria-pressed', String(!q && cat === active));
      h.hidden = !!q && !hits[cat];          // 검색 중 결과 없는 카테고리는 왼쪽에서도 감춘다
    });
  }
  function buildPresets() {
    els.presets = U.el('div', { class: 'rv-presets', id: 'rv-presets' });
    els.search = U.el('input', { type: 'search', id: 'rv-search', placeholder: '프리셋 검색 · 잘림 · 대비 · 차트 · 마스킹' });
    els.search.addEventListener('input', () => { pzCloseBlank(); pzFilter(els.search.value); });
    els.presets.append(els.search);
    const cats = U.el('div', { class: 'pz-cats' });
    const panel = U.el('div', { class: 'pz-panel' });
    PRESETS.forEach(([cat, items]) => {
      const head = U.el('button', { type: 'button', class: 'cat', dataset: { cat } },
                        [cat, U.el('span', { class: 'cnt', text: String(items.length) })]);
      const box = U.el('div', { class: 'pz-items', dataset: { cat } });
      head.addEventListener('click', () => {
        pzCloseBlank();
        active = cat;
        els.search.value = ''; pzFilter('');
      });
      items.forEach(([lab, txt]) => {
        const b = U.el('button', { type: 'button', class: 'pz', text: lab, title: txt });
        b.addEventListener('click', () => { if (txt.includes('____')) pzAskBlank(txt, box); else { pzCloseBlank(); pzInsert(txt); } });
        box.append(b);
      });
      cats.append(head); panel.append(box);
    });
    els.presets.append(U.el('div', { class: 'pz-2col' }, [cats, panel]));
    pzFilter('');
    return els.presets;
  }

  function buildPanel(body, foot) {
    const presets = buildPresets();
    els.ta = U.el('textarea', { id: 'review-text', placeholder: '이 슬라이드에 대한 수정 요청을 적어 주세요. 입력하는 대로 자동 저장됩니다.' });
    els.ta.addEventListener('input', saveTextDebounced);
    els.ta.addEventListener('blur', saveText);
    const fileInput = U.el('input', { type: 'file', id: 'review-file', multiple: true, accept: 'image/*,.pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.txt,.csv,.html' });
    fileInput.addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
    const panoInput = U.el('input', { type: 'file', id: 'review-pano-file', multiple: true, accept: 'image/*', style: 'display:none' });
    panoInput.addEventListener('change', async e => { const files = [...e.target.files]; e.target.value = ''; if (!Deck.media) return U.toast('전환이미지 모듈이 없습니다'); const k = await Deck.media.register(curId(), files); U.toast(k + '개 전환이미지를 등록했습니다 · 본문에서 › 클릭 시 순차 전환'); render(); });
    const panoBtn = U.el('button', { type: 'button', id: 'review-pano', title: '이 슬라이드에 전환이미지(파노라마) 등록', text: '🖼 전환이미지 등록' }); panoBtn.addEventListener('click', () => panoInput.click());
    els.status = U.el('div', { class: 'status-line', id: 'review-status', text: STATUS_IDLE });
    els.filesCnt = U.el('span', { class: 'cnt', id: 'review-files-cnt', text: '0' });
    els.files = U.el('div', { class: 'file-list', id: 'review-files' });
    els.sections = U.el('div', { id: 'review-sections' });
    els.historyCnt = U.el('span', { class: 'cnt', id: 'review-history-cnt', text: '0' });
    els.history = U.el('div', { id: 'review-history' });
    // 이전 요청은 이제 새로 쌓이지 않는다(반영요청 등록 버튼 삭제). 옛 검토본에 남아 있을 때만 보인다.
    els.historyWrap = U.el('div', { id: 'review-history-wrap' }, [
      U.el('div', { class: 'sec-h' }, ['🗂 이전 요청사항', els.historyCnt]), els.history]);
    body.append(
      U.el('div', { class: 'sec-h' }, ['⚡ 빠른 수정요청 프리셋', U.el('span', { class: 'muted', text: '클릭하면 요청문 추가' })]), presets,
      U.el('div', { class: 'sec-h' }, ['📝 수정 요청사항 ', U.el('span', { class: 'muted', text: '· 에이전트에게 갑니다' })]), els.ta,
      U.el('div', { class: 'attach-row' }, [U.el('label', { class: 'filebtn' }, ['📎 파일 첨부', fileInput]), panoBtn, panoInput]),
      els.status,
      U.el('div', { class: 'sec-h' }, ['📎 첨부 파일·이미지', els.filesCnt]), els.files,
      els.sections,
      els.historyWrap);
    foot.append(Deck.exporter.button('review-export'));
  }
  function init() {
    panel = UI.panel.register('review', { title: '슬라이드 수정', subtitle: '', build: buildPanel, onOpen: render, onClose: saveText });
    UI.registerMenu('review', { order: 10, id: 'menu-review', label: '슬라이드 수정', hint: '⌘⇧M', badge: () => hasNote(curId()), onClick: () => UI.panel.open('review') });
    // 텍스트 입력 중의 붙여넣기는 건드리지 않는다 — 이미지가 실제로 있을 때만 가로챈다
    panel.el.addEventListener('paste', async e => {
      if (!U.imagesFromDataTransfer(e.clipboardData).length) return;
      e.preventDefault();
      await pasteImages(e.clipboardData, '붙여넣은 이미지');
    });
    panel.el.addEventListener('dragover', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { e.preventDefault(); panel.el.classList.add('drop-on'); } });
    panel.el.addEventListener('dragleave', e => { if (e.target === panel.el) panel.el.classList.remove('drop-on'); });
    panel.el.addEventListener('drop', async e => {
      if (!U.imagesFromDataTransfer(e.dataTransfer).length) return;
      e.preventDefault(); panel.el.classList.remove('drop-on');
      await pasteImages(e.dataTransfer, '떨어뜨린 이미지');
    });
    document.addEventListener('deck:change', render);
    document.addEventListener('deck:state', e => { if (!(e.detail && e.detail.msg === undefined)) render(); });
  }
  const open = () => UI.panel.open('review');
  const addSection = (name, renderFn) => { sections = sections.filter(s => s.name !== name).concat([{ name, render: renderFn }]); render(); };
  return { init, open, render, hasNote, addSection, addFiles, pasteImages };
})();

/* ==== 76-versions.js ==== */
/* 76-versions.js — 버전 타임라인 (백로그 #10).
 * 에이전트 재생성 전후를 '이름 붙인 버전'으로 고정하고, 두 버전의 차이를 본다.
 *
 * 저장: IndexedDB 의 blobs 스토어에 `__ver__:<deckId>:<id>` 로 넣는다.
 *   - 첨부 blob 과 같은 스토어를 쓰되 접두어로 구분한다(스토어를 늘리면 DB 버전을 올려야 하고,
 *     이미 배포된 v43·v44 가 열려 있는 브라우저에서 onupgradeneeded 가 blocked 될 수 있다).
 *   - 상태 본문만 담는다(첨부 dataURL 제외) — 스냅샷 20개가 수십 MB 가 되면 안 된다.
 *   - blobs 스토어의 다른 소비자와 섞이지 않게 usage/내보내기 쪽 필터를 맞춰 둔다.
 * diff 는 P0-3 계약의 JSON Patch 를 그대로 쓴다 — 비교 로직을 두 벌 만들지 않는다.
 */
Deck.versions = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  // deckId 는 state.load() 에서 파일의 값으로 정해진다 — 모듈 로드 시점에 상수로 잡으면
  // 폴백값('deck')이 굳어 버린다(실측: 레코드 id 가 __ver__:deck: 으로 저장됨).
  const prefix = () => '__ver__:' + S.DECK_ID + ':';
  const MAX = 30;
  let panel = null, cmpA = null, cmpB = null;

  const isVer = r => typeof r.id === 'string' && r.id.indexOf(prefix()) === 0;
  /** 상태 본문만 — 첨부·되돌리기 스택은 스냅샷에 넣지 않는다. */
  const body = () => {
    const d = JSON.parse(JSON.stringify(S.data));
    delete d.undo; delete d.blobs;
    return d;
  };

  async function all() {
    let rows = [];
    try { rows = (await U.idb.all()).filter(isVer); } catch (e) { return []; }
    return rows.sort((a, b) => (a.at < b.at ? 1 : -1));
  }
  async function save(name) {
    const id = prefix() + U.uid('v');
    const rec = { id, at: U.nowIso(), name: (name || '').trim() || new Date().toLocaleString('ko-KR'), build: S.data.build, state: body() };
    rec.size = JSON.stringify(rec.state).length;
    await U.idb.put(rec);
    const rows = await all();
    for (const old of rows.slice(MAX)) await U.idb.del(old.id);   // 오래된 것부터 정리
    S.commit('버전 저장: ' + rec.name);
    render();
    return rec;
  }
  async function remove(id) { await U.idb.del(id); render(); }
  async function get(id) { try { return await U.idb.get(id); } catch (e) { return null; } }

  /** 두 버전(또는 버전↔현재) 사이의 변경을 JSON Patch 로 뽑는다 — P0-3 계약과 같은 표현. */
  async function diff(idA, idB) {
    const a = idA ? await get(idA) : null;
    const b = idB ? await get(idB) : null;
    const A = a ? a.state : body();
    const B = b ? b.state : body();
    return { ops: patch(A, B), aName: a ? a.name : '현재', bName: b ? b.name : '현재' };
  }

  /* 최소 JSON Patch 생성기 — 단일 파일 안이라 라이브러리를 못 쓴다.
   * unbuild 쪽(Python jsonpatch)과 표현을 맞춘다: op/path/value, RFC 6901 포인터. */
  function patch(a, b, base) {
    base = base || '';
    const ops = [];
    const esc = k => String(k).replace(/~/g, '~0').replace(/\//g, '~1');
    const kind = v => (Array.isArray(v) ? 'array' : v === null ? 'null' : typeof v);
    if (kind(a) !== kind(b) || kind(a) !== 'object') {
      if (JSON.stringify(a) !== JSON.stringify(b)) ops.push({ op: 'replace', path: base || '/', value: b });
      return ops;
    }
    for (const k of Object.keys(a)) {
      if (!(k in b)) ops.push({ op: 'remove', path: base + '/' + esc(k) });
      else ops.push(...patch(a[k], b[k], base + '/' + esc(k)));
    }
    for (const k of Object.keys(b)) if (!(k in a)) ops.push({ op: 'add', path: base + '/' + esc(k), value: b[k] });
    return ops;
  }

  async function restore(id) {
    const rec = await get(id);
    if (!rec) { U.toast('그 버전을 찾지 못했습니다'); return false; }
    const ok = await UI.confirm('버전 되돌리기', '<p><b>' + U.escapeHtml(rec.name) + '</b> 시점의 상태로 되돌립니다.<br>지금 상태는 되돌리기 전에 자동으로 한 벌 저장됩니다.</p>', '되돌리기', true);
    if (!ok) return false;
    await save('되돌리기 직전 (' + new Date().toLocaleTimeString('ko-KR') + ')');
    const keep = S.data.undo, lineage = S.data.lineage || [];
    Object.assign(S.data, JSON.parse(JSON.stringify(rec.state)));
    S.data.undo = keep;
    /* **계보는 되돌리지 않는다**(undo 와 같은 이유). 계보는 내용이 아니라 «이 브라우저가 무엇을 저장했나» 다 —
     * 스냅샷의 옛 계보로 덮으면 그 뒤에 저장한 파일의 saveId 가 빠져, 그 파일을 다시 열거나 새로고침할 때
     * 되돌린 뒤의 작업이 파일에 진다(검토 세션 Q1 · 10-state.js load). */
    S.data.lineage = [...new Set([...(S.data.lineage || []), ...lineage])].slice(-50);
    S.commit('버전 되돌리기: ' + rec.name);
    if (Deck.structure) { Deck.structure.apply(); Deck.nav.rebuild(); Deck.structure.render(); }
    if (Deck.textedit) Deck.textedit.apply();
    if (Deck.pen) Deck.pen.renderAll();
    if (Deck.media) await Deck.media.renderAll();
    if (Deck.review) Deck.review.render();
    render();
    U.toast('되돌렸습니다 · ' + rec.name);
    return true;
  }

  const LABEL = { add: '추가', remove: '삭제', replace: '변경' };
  const SECTION = { order: '슬라이드 순서', notes: '메모', pen: '영역지정 수정', anchors: '요소 코멘트', edits: '텍스트 수정', media: '이미지', created: '신규 슬라이드', deleted: '삭제', merges: '통합', log: '로그', updatedAt: '저장 시각', build: '빌드' };
  const sectionOf = p => SECTION[(p.split('/')[1] || '').split('~')[0]] || (p.split('/')[1] || '기타');

  async function renderDiff(host) {
    host.innerHTML = '';
    const { ops, aName, bName } = await diff(cmpA, cmpB);
    const meaningful = ops.filter(o => !/^\/(updatedAt|log)(\/|$)/.test(o.path));
    host.append(U.el('div', { class: 'status-line', text: aName + ' → ' + bName + ' · 변경 ' + meaningful.length + '건' + (ops.length - meaningful.length ? ' (저장 시각·로그 ' + (ops.length - meaningful.length) + '건 숨김)' : '') }));
    if (!meaningful.length) { host.append(U.el('div', { class: 'muted', text: '두 버전의 내용이 같습니다.' })); return; }
    const box = U.el('div', { class: 'ver-diff' });
    meaningful.slice(0, 120).forEach(o => {
      box.append(U.el('div', { class: 'vd-i op-' + o.op }, [
        U.el('span', { class: 'op', text: LABEL[o.op] || o.op }),
        U.el('span', { class: 'sec', text: sectionOf(o.path) }),
        U.el('code', { text: o.path }),
      ]));
    });
    host.append(box);
  }

  function build(bodyEl) {
    const nameIn = U.el('input', { type: 'text', id: 'ver-name', placeholder: '버전 이름 (예: 에이전트 재생성 전)' });
    const saveBtn = U.el('button', { type: 'button', id: 'ver-save', class: 'btn accent', text: '📌 지금 상태를 버전으로 저장' });
    saveBtn.addEventListener('click', async () => { await save(nameIn.value); nameIn.value = ''; });
    const listEl = U.el('div', { id: 'ver-list' });
    const diffEl = U.el('div', { id: 'ver-diff-host' });
    bodyEl.append(
      U.el('div', { class: 'sec-h' }, ['📌 버전 저장']), nameIn, saveBtn,
      U.el('div', { class: 'sec-h' }, ['🗂 저장된 버전', U.el('span', { class: 'cnt', id: 'ver-cnt', text: '0' })]), listEl,
      U.el('div', { class: 'sec-h' }, ['↔ 비교']), diffEl);
  }

  async function render() {
    if (!panel || !panel.el.classList.contains('open')) return;
    const rows = await all();
    const listEl = panel.el.querySelector('#ver-list');
    panel.el.querySelector('#ver-cnt').textContent = String(rows.length);
    listEl.innerHTML = '';
    if (!rows.length) listEl.append(U.el('div', { class: 'muted', text: '저장된 버전이 없습니다. 에이전트에 보내기 전에 한 벌 찍어 두면 전후를 비교할 수 있습니다.' }));
    rows.forEach(r => {
      const pick = (which) => { if (which === 'a') cmpA = (cmpA === r.id ? null : r.id); else cmpB = (cmpB === r.id ? null : r.id); render(); };
      const a = U.el('button', { type: 'button', class: 'vpick' + (cmpA === r.id ? ' on' : ''), title: '비교 A', text: 'A' }); a.addEventListener('click', () => pick('a'));
      const b = U.el('button', { type: 'button', class: 'vpick' + (cmpB === r.id ? ' on' : ''), title: '비교 B', text: 'B' }); b.addEventListener('click', () => pick('b'));
      const rs = U.el('button', { type: 'button', class: 'vres', text: '되돌리기' }); rs.addEventListener('click', () => restore(r.id));
      const del = U.el('button', { type: 'button', class: 'vdel', title: '삭제', text: '×' }); del.addEventListener('click', () => remove(r.id));
      listEl.append(U.el('div', { class: 'ver-i', dataset: { id: r.id } }, [
        U.el('div', {}, [U.el('b', { text: r.name }), U.el('small', { text: (r.at || '').slice(0, 16).replace('T', ' ') + ' · ' + r.build + ' · ' + Math.ceil((r.size || 0) / 1024) + ' KB' })]),
        U.el('span', { class: 'vbtns' }, [a, b, rs, del]),
      ]));
    });
    await renderDiff(panel.el.querySelector('#ver-diff-host'));
  }

  function init() {
    panel = UI.panel.register('versions', { title: '버전 타임라인', subtitle: '에이전트 재생성 전후를 이름 붙여 고정하고 비교합니다.', width: '460px', build, onOpen: render });
    UI.registerMenu('save', { order: 50, id: 'menu-versions', label: '버전 타임라인', onClick: () => UI.panel.open('versions') });
  }
  return { init, save, all, get, remove, diff, restore, render, patch, isVer, get PREFIX() { return prefix(); } };
})();

/* ==== 77-deeplink.js ==== */
/* 77-deeplink.js — URL 해시 딥링크 (백로그 #20).
 * `#/7` = 7번째 슬라이드. 메모에 "7쪽 보세요" 대신 링크를 붙일 수 있고, 새로고침해도 그 자리로 돌아온다.
 *
 * history.pushState 가 아니라 replaceState 를 쓴다 — 발표하며 19장을 넘기면 뒤로가기 스택이
 * 19개로 불어나 브라우저 뒤로가기가 쓸모없어진다. 위치 복원이 목적이지 탐색 이력이 목적이 아니다.
 */
Deck.deeplink = (() => {
  const U = Deck.util;
  let applying = false;

  /** 해시에서 슬라이드 인덱스(0-based)를 읽는다. 없거나 이상하면 null. */
  function parse(hash) {
    // 인자를 주면 그것만 본다. `hash || location.hash` 로 두면 parse('') 가 현재 위치를 반환해 헷갈린다.
    const src = arguments.length ? (hash || '') : (location.hash || '');
    const m = /^#\/(\d+)$/.exec(src);
    if (!m) return null;
    const n = parseInt(m[1], 10) - 1;
    const total = Deck.nav.slides().length;
    return n >= 0 && n < total ? n : null;
  }
  const hashFor = i => '#/' + (i + 1);

  /** 부팅 시: 해시가 가리키는 장으로. 없으면 첫 장. */
  function initial() {
    const n = parse();
    return n === null ? 0 : n;
  }
  function sync(i) {
    const want = hashFor(i);
    if (location.hash === want) return;
    applying = true;
    try { history.replaceState(null, '', location.pathname + location.search + want); }
    catch (e) { location.hash = want; }        // file:// 등에서 replaceState 가 막히면 폴백
    applying = false;
  }
  function onHashChange() {
    if (applying) return;
    const n = parse();
    if (n !== null && n !== Deck.nav.index()) Deck.nav.show(n);
  }
  function init() {
    window.addEventListener('hashchange', onHashChange);
    document.addEventListener('deck:change', e => sync(e.detail ? e.detail.index : Deck.nav.index()));
  }
  return { init, parse, initial, sync, hashFor };
})();

/* ==== 80-pen.js ==== */
/* 80-pen.js — pen / rect / arrow annotations with notes. The SVG layer is ALWAYS rendered from state (Deck.state.data.pen),
 * so marks survive reload and export, and the exporter can simply drop the layer. */
Deck.pen = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state, SVGNS = 'http://www.w3.org/2000/svg';
  const COLORS = ['#FF3B30', '#00B3FF', '#FFCC00', '#00E6BD'];
  let active = false, tool = 'rect', color = COLORS[0], drawing = false, cur = null, start = null, pending = null, slideId = null;
  let toolbar = null, noteBox = null, noteTxt = null;

  const svgEl = (name, attr) => { const n = document.createElementNS(SVGNS, name); for (const k in attr) n.setAttribute(k, attr[k]); return n; };
  const rnd = v => Math.round(v * 10) / 10;
  const pt = (e, s) => { const r = s.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 1280, y: (e.clientY - r.top) / r.height * 720 }; };
  function layerOf(s) {
    let g = s.querySelector(':scope > .pen-layer');
    if (!g) {
      g = svgEl('svg', { class: 'pen-layer', viewBox: '0 0 1280 720', preserveAspectRatio: 'none' });
      g.append(svgEl('defs', {}), svgEl('rect', { class: 'pen-capture', x: 0, y: 0, width: 1280, height: 720, fill: 'transparent' }));
      s.append(g);
    }
    return g;
  }
  function ensureMarker(g, c) {
    const id = 'pen-ah-' + g.closest('.slide').dataset.slideId + '-' + c.replace('#', '');
    if (!g.querySelector('#' + id)) {
      const m = svgEl('marker', { id, markerWidth: 10, markerHeight: 10, refX: 7, refY: 3, orient: 'auto', markerUnits: 'strokeWidth' });
      m.append(svgEl('path', { d: 'M0,0 L7,3 L0,6 Z', fill: c }));
      g.querySelector('defs').append(m);
    }
    return id;
  }
  function shapeEl(g, p) {
    let el;
    if (p.tool === 'rect') el = svgEl('rect', { x: p.x, y: p.y, width: p.w, height: p.h, fill: 'none', stroke: p.color, 'stroke-width': 4, rx: 6 });
    else if (p.tool === 'arrow') el = svgEl('line', { x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2, stroke: p.color, 'stroke-width': 4, 'marker-end': 'url(#' + ensureMarker(g, p.color) + ')' });
    else el = svgEl('path', { d: p.d || ('M ' + p.px + ' ' + p.py), fill: 'none', stroke: p.color, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    el.setAttribute('data-mark', '1'); el.setAttribute('data-pin', p.n);
    if (p.note) { const t = svgEl('title', {}); t.textContent = '#' + p.n + ' ' + p.note; el.append(t); }
    return el;
  }
  function pinEl(p) {
    const pin = svgEl('g', { class: 'pen-pin', 'data-pin': p.n });
    pin.append(svgEl('circle', { cx: p.px, cy: p.py, r: 15, fill: p.color, stroke: '#fff', 'stroke-width': 2 }));
    const t = svgEl('text', { x: p.px, y: p.py + 6, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 900, fill: '#fff', 'font-family': 'Pretendard, Arial' });
    t.textContent = p.n; pin.append(t);
    return pin;
  }
  function render(id) {
    const s = Deck.structure.byId(id); if (!s) return;
    const arr = S.data.pen[id] || [];
    if (!arr.length && !s.querySelector(':scope > .pen-layer')) return;
    const g = layerOf(s);
    [...g.querySelectorAll('[data-mark],.pen-pin')].forEach(x => x.remove());
    g.querySelector('defs').innerHTML = '';
    arr.forEach(p => {
      g.append(shapeEl(g, p));
      const pin = pinEl(p);
      // 핀은 .pen-capture 뒤에 깔려 위에 있고 형제라 버블링도 없다 — 그리기를 시작하지 않는다.
      pin.addEventListener('click', e => { e.stopPropagation(); openEdit(id, p, e.clientX, e.clientY); });
      g.append(pin);
    });
  }
  const renderAll = () => Deck.nav.slides().forEach(s => render(s.dataset.slideId));

  /* ---------- drawing ---------- */
  function onDown(e) {
    if (!active || pending) return;
    e.preventDefault(); e.stopPropagation();
    const s = Deck.structure.byId(slideId); const g = layerOf(s); const p = pt(e, s);
    start = p; drawing = true;
    if (tool === 'rect') cur = svgEl('rect', { x: p.x, y: p.y, width: 0, height: 0, fill: 'none', stroke: color, 'stroke-width': 4, rx: 6 });
    else if (tool === 'arrow') cur = svgEl('line', { x1: p.x, y1: p.y, x2: p.x, y2: p.y, stroke: color, 'stroke-width': 4, 'marker-end': 'url(#' + ensureMarker(g, color) + ')' });
    else cur = svgEl('path', { d: 'M ' + rnd(p.x) + ' ' + rnd(p.y), fill: 'none', stroke: color, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    cur.setAttribute('data-draft', '1'); g.append(cur);
    window.addEventListener('pointermove', onMove, true);
    window.addEventListener('pointerup', onUp, true);
  }
  function onMove(e) {
    if (!drawing || !cur) return;
    e.preventDefault();
    const s = Deck.structure.byId(slideId); const p = pt(e, s);
    if (tool === 'pen') cur.setAttribute('d', cur.getAttribute('d') + ' L ' + rnd(p.x) + ' ' + rnd(p.y));
    else if (tool === 'rect') { cur.setAttribute('x', Math.min(p.x, start.x)); cur.setAttribute('y', Math.min(p.y, start.y)); cur.setAttribute('width', Math.abs(p.x - start.x)); cur.setAttribute('height', Math.abs(p.y - start.y)); }
    else { cur.setAttribute('x2', p.x); cur.setAttribute('y2', p.y); }
  }
  function onUp(e) {
    window.removeEventListener('pointermove', onMove, true);
    window.removeEventListener('pointerup', onUp, true);
    if (!drawing) return;
    drawing = false;
    const s = Deck.structure.byId(slideId); const end = pt(e, s);
    const shape = { tool, color, px: rnd(start.x), py: rnd(start.y) };
    if (tool === 'pen') shape.d = cur.getAttribute('d');
    else if (tool === 'rect') { shape.x = rnd(Math.min(end.x, start.x)); shape.y = rnd(Math.min(end.y, start.y)); shape.w = rnd(Math.abs(end.x - start.x)); shape.h = rnd(Math.abs(end.y - start.y)); }
    else { shape.x1 = rnd(start.x); shape.y1 = rnd(start.y); shape.x2 = rnd(end.x); shape.y2 = rnd(end.y); }
    pending = shape;
    noteTxt.value = '';
    showNote(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
  }
  /* 상자를 여는 자리는 한 곳이다 — 새로 그린 직후와 이미 있는 것을 고칠 때가 같은 상자를 쓴다. */
  function showNote(cx, cy) {
    const vw = window.innerWidth, vh = window.innerHeight;
    noteBox.style.left = Math.max(12, Math.min(vw - 272, cx - 130)) + 'px';
    noteBox.style.top = Math.max(12, Math.min(vh - 180, cy + 16)) + 'px';
    // 새로 그린 직후에는 아직 저장 전이라 '취소' 가 곧 삭제다 — 눌러도 아무 일 없는 버튼을 두지 않는다.
    noteBox.querySelector('#pen-note-del').hidden = !pending.editN;
    noteBox.classList.add('open');
    UI.pushEsc(cancelNote, 'pen-note');
    noteTxt.focus();
    setTimeout(() => { if (pending && document.activeElement !== noteTxt) noteTxt.focus(); }, 20);
  }
  /* 고치는 것은 요청 문구지 표시가 아니다 — 도형·좌표·색·n 은 건드리지 않는다. */
  function openEdit(id, p, cx, cy) {
    if (!active || pending || id !== slideId) return;
    pending = { editN: p.n };
    noteTxt.value = p.note || '';
    showNote(cx, cy);
  }
  function closeNote() {
    noteBox.classList.remove('open');
    UI.popEsc('pen-note');
    if (cur) { cur.remove(); cur = null; }
    UI.focusStage();
  }
  function commitNote() {
    if (!pending) return;
    const arr = S.pensFor(slideId), note = noteTxt.value.trim(), edit = pending.editN;
    let n = edit;
    if (edit) { const p = arr.find(x => String(x.n) === String(edit)); if (p) p.note = note; }
    else { n = arr.length + 1; arr.push(Object.assign({ n, note }, pending)); }
    pending = null;
    closeNote();
    render(slideId);
    S.commit('영역지정 ' + (edit ? '문구 수정 #' : '#') + n + ': ' + slideId);
    U.toast('영역지정 ＃' + n + (edit ? ' 문구 수정됨' : ' 저장됨'));
    if (Deck.review) Deck.review.render();
  }
  /* 삭제 경로는 remove() 한 벌뿐이다 — 패널의 × 와 같은 함수를 부른다. */
  function deleteEditing() {
    const n = pending && pending.editN; if (!n) return;
    pending = null; closeNote();
    remove(slideId, n);
  }
  function cancelNote() { pending = null; closeNote(); render(slideId); }

  /* ---------- edit ops ---------- */
  function remove(id, n) {
    const arr = S.pensFor(id); const i = arr.findIndex(p => String(p.n) === String(n));
    if (i < 0) return;
    arr.splice(i, 1); arr.forEach((p, k) => { p.n = k + 1; });
    render(id); S.commit('영역지정 삭제: ' + id + ' #' + n);
    if (Deck.review) Deck.review.render();
  }
  function clear(id) { S.data.pen[id] = []; render(id); S.commit('영역지정 전체 삭제: ' + id); if (Deck.review) Deck.review.render(); }
  const undoLast = () => { const arr = S.pens(slideId); if (!arr.length) { U.toast('지울 영역지정이 없습니다'); return; } remove(slideId, arr[arr.length - 1].n); };
  const clearAll = async () => { if (!S.pens(slideId).length) return; if (await UI.confirm('영역지정 삭제', '<p>이 슬라이드에서 지정한 영역을 모두 지울까요?</p>', '삭제', true)) clear(slideId); };

  /* ---------- mode ---------- */
  function enter() {
    if (active) return;
    active = true;
    slideId = Deck.nav.current().dataset.slideId;
    if (UI.panel.current()) UI.panel.close(UI.panel.current(), true);
    UI.setMode('pen');
    toolbar.querySelector('.lbl').textContent = 'SLIDE ' + String(Deck.nav.index() + 1).padStart(2, '0');
    toolbar.classList.add('open');
    const g = layerOf(Deck.nav.current());
    g.querySelector('.pen-capture').onpointerdown = onDown;
    UI.pushEsc(exit, 'pen');
    UI.menu.refresh();
    UI.focusStage();
  }
  function exit() {
    if (!active) return;
    if (pending) cancelNote();
    active = false; drawing = false;
    if (cur) { cur.remove(); cur = null; }
    window.removeEventListener('pointermove', onMove, true);
    window.removeEventListener('pointerup', onUp, true);
    Deck.nav.slides().forEach(s => { const cap = s.querySelector(':scope > .pen-layer .pen-capture'); if (cap) cap.onpointerdown = null; });
    toolbar.classList.remove('open'); noteBox.classList.remove('open');
    UI.popEsc('pen-note'); UI.popEsc('pen');
    UI.setMode('present');
    UI.focusStage();
    UI.menu.refresh();
    render(slideId);
    if (Deck.review) Deck.review.render();
    if (Deck.structure) Deck.structure.render();
  }

  /* ---------- UI ---------- */
  function buildUi() {
    const mk = (attrs, fn) => { const b = U.el('button', Object.assign({ type: 'button' }, attrs)); if (fn) b.addEventListener('click', fn); return b; };
    const tools = U.el('div', { class: 'grp' });
    [['pen', '✏️ 펜'], ['rect', '▭ 영역'], ['arrow', '➜ 화살표']].forEach(([t, label]) => tools.append(mk({ dataset: { tool: t }, class: t === tool ? 'on' : '', text: label }, () => { tool = t; tools.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); })));
    const sw = U.el('div', { class: 'grp', id: 'pen-swatches' });
    COLORS.forEach(c => sw.append(mk({ class: 'sw' + (c === color ? ' on' : ''), dataset: { color: c }, style: 'background:' + c, title: c }, () => { color = c; sw.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.color === c)); })));
    const ops = U.el('div', { class: 'grp' }, [mk({ class: 'clear', id: 'pen-undo', text: '↩ 마지막' }, undoLast), mk({ class: 'clear', id: 'pen-clear', text: '전체 지우기' }, clearAll), mk({ class: 'done', id: 'pen-done', text: '완료 (Esc)' }, exit)]);
    toolbar = U.el('div', { id: 'pen-toolbar', 'data-ui': '' }, [U.el('span', { class: 'lbl', text: 'SLIDE' }), tools, sw, ops]);
    noteTxt = U.el('textarea', { id: 'pen-note-text', placeholder: '예) 이 영역의 도표를 최신 수치로 교체, 색상은 브랜드 톤으로' });
    noteTxt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitNote(); } });
    noteBox = U.el('div', { id: 'pen-note', 'data-ui': '' }, [U.el('b', { text: '이 표시에 대한 수정 요청' }), noteTxt,
      U.el('div', { class: 'pn-row' }, [mk({ class: 'del', id: 'pen-note-del', text: '삭제', hidden: true }, deleteEditing),
        mk({ class: 'no', id: 'pen-note-cancel', text: '취소' }, cancelNote), mk({ class: 'ok', id: 'pen-note-ok', text: '저장 (Enter)' }, commitNote)])]);
    ['pointerdown', 'mousedown', 'click'].forEach(t => { toolbar.addEventListener(t, e => e.stopPropagation()); noteBox.addEventListener(t, e => e.stopPropagation()); });
    document.body.append(toolbar, noteBox);
  }
  function renderSection(host, id) {
    host.innerHTML = '';
    const arr = S.data.pen[id] || [];
    // 진입은 메뉴의 menu-pen 한 곳이다 — 여기 버튼과 안내문은 그것과 겹쳐서 걷었다(사용자 요청).
    // 목록은 남는다: 모드 밖에서는 마크가 클릭을 안 받으므로 이 절이 고치고 지우는 유일한 길이다.
    // 비었을 때는 아무것도 그리지 않는다 — 제목의 개수 뱃지 0 이 «없다» 를 말한다.
    const list = U.el('div', { class: 'pen-list' });
    arr.forEach(p => {
      const del = U.el('button', { type: 'button', title: '삭제', dataset: { del: String(p.n) }, text: '×' }); del.addEventListener('click', () => remove(id, p.n));
      // 모드 밖에서는 마크가 클릭을 안 받는다(.pen-layer 가 pointer-events:none) — 패널이 유일한 진입로다.
      const txt = U.el('p', { title: '눌러서 문구 고치기', text: (p.note || '(내용 없음)') + ' · ' + ({ pen: '펜', rect: '영역', arrow: '화살표' }[p.tool] || p.tool) });
      txt.addEventListener('click', () => jumpAndEdit(id, p.n));
      list.append(U.el('div', { class: 'pnl-i' }, [U.el('span', { class: 'n', text: String(p.n) }), txt, del]));
    });
    host.append(U.el('div', { class: 'sec-h' }, ['✏️ 영역지정 수정', U.el('span', { class: 'cnt', text: String(arr.length) })]), list);
  }
  function jumpAndEdit(id, n) {
    const s = Deck.structure.byId(id); if (!s) return;
    const i = Deck.nav.slides().indexOf(s);
    if (i >= 0 && i !== Deck.nav.index()) Deck.nav.show(i);
    enter();                                   // 이미 켜져 있으면 그대로 둔다
    const p = (S.data.pen[id] || []).find(x => String(x.n) === String(n));
    if (p) openEdit(id, p, window.innerWidth / 2, window.innerHeight / 2);
  }

  function init() {
    buildUi();
    UI.registerMenu('review', { order: 20, id: 'menu-pen', label: '영역지정 수정', badge: () => { const n = (S.data.pen[Deck.nav.current().dataset.slideId] || []).length; return n ? String(n) : false; }, onClick: enter });
    if (Deck.review) Deck.review.addSection('pen', renderSection);
  }
  return { init, enter, exit, render, renderAll, remove, clear, isActive: () => active };
})();

/* ==== 85-sheetio.js ==== */
/* 85-sheetio.js — 발표 메모·대본 엑셀 내보내기/가져오기.
 *
 * 목적: 슬라이드를 한 장씩 오가며 메모를 치는 대신, 전체를 엑셀에서 한꺼번에 쓰고 되돌려 넣는다.
 *
 * 의존성 0 으로 만든 이유: 이 덱은 단일 HTML 로 file:// 에서 오프라인으로 돈다.
 *   SheetJS 같은 라이브러리를 CDN 으로 부르면 발표 현장에서 네트워크가 없을 때 죽고,
 *   인라인으로 넣으면 파일이 1MB 넘게 불어난다. 그래서 직접 만든다.
 *   - 쓰기: xlsx 는 ZIP 이다. 전부 STORED(무압축) 로 넣으면 CRC32 만 있으면 되고 Excel 도 그대로 연다.
 *   - 읽기: Excel 이 저장한 파일은 DEFLATE 라 DecompressionStream('deflate-raw') 로 푼다
 *     (Chrome 103+ / Safari 16.4+ / Firefox 113+). 없는 브라우저에서는 CSV 로 안내한다.
 *   - Excel 은 다시 저장할 때 문자열을 sharedStrings 로 바꾼다. 그래서 읽기는 inlineStr 과
 *     sharedStrings 를 모두 처리해야 한다 — 내보낸 파일만 가정하면 왕복이 깨진다.
 *
 * 매칭 키는 슬라이드ID 다. 순번이나 제목으로 맞추면 엑셀에서 행을 정렬하거나 제목을 고친 순간
 * 엉뚱한 장에 대본이 들어간다. ID 열은 손대지 말라고 시트에도 적어 둔다.
 */
Deck.sheetio = (() => {
  const U = Deck.util, UI = Deck.ui, S = Deck.state;
  const H_ID = '슬라이드ID', H_TEXT = '발표 메모·대본', H_NO = '#', H_TITLE = '제목';
  const enc = new TextEncoder();

  const slideRows = () => Deck.nav.slides().map((s, i) => ({
    no: i + 1, id: s.dataset.slideId,
    title: (Deck.structure && Deck.structure.title ? Deck.structure.title(s) : s.dataset.slideId),
    text: S.speaker(s.dataset.slideId) || '',
  }));

  /* ZIP(STORED) 은 `Deck.util.zipStore` 한 벌이다 — 작업자료 내려받기도 같은 것을 쓴다. */
  const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const zipStore = files => U.zipStore(files, XLSX_MIME);

  /* ---------- ZIP 읽기 ---------- */
  async function inflateRaw(u8) {
    if (typeof DecompressionStream !== 'function') throw new Error('이 브라우저는 xlsx 압축 해제를 지원하지 않습니다');
    const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  /* 중앙 디렉터리로 읽는다. 로컬 헤더만 훑으면 데이터 디스크립터(크기 0)를 쓰는 파일에서 어긋난다. */
  async function unzip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('xlsx 파일이 아닙니다 (ZIP 구조를 찾지 못했습니다)');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = new Map();
    const dec = new TextDecoder('utf-8');
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nLen = dv.getUint16(p + 28, true), eLen = dv.getUint16(p + 30, true), cLen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nLen));
      const lNameLen = dv.getUint16(lho + 26, true), lExtraLen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lNameLen + lExtraLen;
      const raw = u8.subarray(start, start + csize);
      out.set(name, method === 0 ? raw : await inflateRaw(raw));
      p += 46 + nLen + eLen + cLen;
    }
    return out;
  }

  /* ---------- xlsx 만들기 ---------- */
  const xEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');            // XML 1.0 이 금지하는 제어문자는 버린다
  const colName = n => { let s = ''; n++; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; } return s; };
  const cellStr = (col, row, v, style) => '<c r="' + col + row + '"' + (style ? ' s="' + style + '"' : '') + ' t="inlineStr"><is><t xml:space="preserve">' + xEsc(v) + '</t></is></c>';
  const cellNum = (col, row, v, style) => '<c r="' + col + row + '"' + (style ? ' s="' + style + '"' : '') + '><v>' + v + '</v></c>';

  function sheetXml(rows) {
    const head = [H_NO, H_ID, H_TITLE, H_TEXT];
    let body = '<row r="1" ht="26" customHeight="1">' + head.map((h, i) => cellStr(colName(i), 1, h, 1)).join('') + '</row>';
    rows.forEach((r, i) => {
      const n = i + 2;
      const lines = (r.text.match(/\n/g) || []).length + 1;
      const h = Math.min(400, Math.max(38, lines * 17 + 14));
      body += '<row r="' + n + '" ht="' + h + '" customHeight="1">'
        + cellNum('A', n, r.no, 2) + cellStr('B', n, r.id, 3) + cellStr('C', n, r.title, 2) + cellStr('D', n, r.text, 2)
        + '</row>';
    });
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + '<sheetFormatPr defaultRowHeight="15"/>'
      + '<cols><col min="1" max="1" width="5" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/>'
      + '<col min="3" max="3" width="34" customWidth="1"/><col min="4" max="4" width="96" customWidth="1"/></cols>'
      + '<sheetData>' + body + '</sheetData></worksheet>';
  }

  const STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="3"><font><sz val="11"/><name val="맑은 고딕"/></font>'
    + '<font><b/><sz val="11"/><color rgb="FF1B2740"/><name val="맑은 고딕"/></font>'
    + '<font><sz val="10"/><color rgb="FF7F7F7F"/><name val="Consolas"/></font></fonts>'
    + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
    + '<fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F1"/><bgColor indexed="64"/></patternFill></fill></fills>'
    + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="4">'
    + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>'
    + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'
    + '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="top"/></xf>'
    + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function buildXlsx(rows) {
    const f = (name, text) => ({ name, data: enc.encode(text) });
    return zipStore([
      f('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + '</Types>'),
      f('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>'),
      f('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
        + '<sheets><sheet name="발표대본" sheetId="1" r:id="rId1"/></sheets></workbook>'),
      f('xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
        + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
        + '</Relationships>'),
      f('xl/styles.xml', STYLES),
      f('xl/worksheets/sheet1.xml', sheetXml(rows)),
    ]);
  }

  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function exportXlsx() {
    UI.menu.close();
    const rows = slideRows();
    const base = (document.title || '발표덱').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
    try {
      download(buildXlsx(rows), base + '_발표대본_' + stamp() + '.xlsx');
      U.toast('발표 메모·대본 ' + rows.length + '장을 내보냈습니다 · 다운로드 폴더의 엑셀 파일', 3600);
    } catch (e) {
      console.error(e); U.toast('엑셀 내보내기 실패: ' + (e && e.message), 4000);
    }
  }

  /* ---------- 읽기: xlsx / csv 공통으로 [머리글행, ...행] 표를 만든다 ---------- */
  const richText = node => [...node.getElementsByTagName('t')].map(t => t.textContent).join('');

  function tableFromSheet(sheetXmlText, sharedXmlText) {
    const P = new DOMParser();
    let shared = [];
    if (sharedXmlText) {
      const sd = P.parseFromString(sharedXmlText, 'application/xml');
      shared = [...sd.getElementsByTagName('si')].map(richText);
    }
    const doc = P.parseFromString(sheetXmlText, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('시트 XML 을 읽지 못했습니다');
    /* 좌표대로 읽는다 — 엑셀은 **내용이 없는 행·셀을 아예 쓰지 않는다.**
     * 나온 순서대로 쌓으면 표 중간을 비워 둔 시트에서 그 아래가 통째로 한 칸씩 올라붙어
     * 대본이 엉뚱한 슬라이드에 붙는다(슬라이드ID 열이 있으면 ID 로 제자리를 찾지만,
     * 밖에서 만든 대본 파일에는 그 열이 없다 — 매칭이 #·행 순서로 물러서는 바로 그 경우다).
     * `r` 은 **선택 속성**이라 손으로 만든 시트에는 없을 수 있다. 그때는 좌표를 지어내지 않고
     * 나온 순서를 쓴다 — 0 으로 떨어뜨리면 한 행의 모든 셀이 A열에 겹쳐 마지막만 남는다. */
    const table = [];
    let rowCursor = 0;
    for (const r of doc.getElementsByTagName('row')) {
      const rNum = parseInt(r.getAttribute('r'), 10);
      const rowIdx = Number.isFinite(rNum) && rNum > 0 ? rNum - 1 : rowCursor;
      rowCursor = rowIdx + 1;
      const cells = [];
      let colCursor = 0;
      for (const c of r.getElementsByTagName('c')) {
        const letters = (c.getAttribute('r') || '').replace(/[^A-Z]/g, '');
        let idx;
        if (letters) {
          idx = 0; for (const ch of letters) idx = idx * 26 + (ch.charCodeAt(0) - 64);
          idx -= 1;
        } else {
          idx = colCursor;
        }
        colCursor = idx + 1;
        const t = c.getAttribute('t');
        const v = c.getElementsByTagName('v')[0];
        let val = '';
        if (t === 'inlineStr') { const is = c.getElementsByTagName('is')[0]; val = is ? richText(is) : ''; }
        else if (t === 's') val = v ? (shared[Number(v.textContent)] || '') : '';
        else val = v ? v.textContent : '';
        cells[idx] = val;
      }
      table[rowIdx] = [...cells].map(x => (x == null ? '' : x));
    }
    // 빈 행은 빈 배열로 채운다 — 구멍(undefined)이 뒤 코드에서 다시 밀림을 만든다.
    for (let i = 0; i < table.length; i++) if (!table[i]) table[i] = [];
    return table;
  }

  /* CSV: 따옴표 안의 쉼표·줄바꿈·이중따옴표를 처리하는 최소 파서 */
  function tableFromCsv(text) {
    const t = text.replace(/^﻿/, '');
    const table = []; let row = [], cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); table.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); table.push(row); }
    return table;
  }

  /* 열 위치는 머리글로 찾는다 — 엑셀에서 열을 옮기거나 끼워 넣어도 왕복이 살아 있게.
   *
   * 매칭 키는 세 단계로 물러선다(2026-09-08, 실제 사용에서 드러난 문제):
   *   1) 슬라이드ID — 우리가 내보낸 파일. 행을 정렬하거나 제목을 고쳐도 정확하다.
   *   2) 순번(#)   — 밖에서 만든 대본 파일에는 ID 열이 없다. 순서가 덱과 같으면 그대로 맞는다.
   *   3) 행 순서   — 번호 열조차 없을 때. 머리글 다음 행부터 1장씩 차례로.
   * 2·3 은 순서에 기대므로 반드시 확인 창에서 "몇 번 장에 무엇이 들어가는지" 미리 보여 준다.
   * 제목 매칭은 넣지 않았다 — 실측해 보니 덱 제목과 대본 파일 제목이 18장 중 7장만 같았다.
   */
  function pairsFrom(table) {
    const norm = s => String(s == null ? '' : s).replace(/\s|·|\.|\(.*?\)/g, '').toLowerCase();
    let h = null;
    for (let r = 0; r < Math.min(table.length, 12); r++) {
      const cells = table[r] || [];
      const tx = cells.findIndex(c => /메모|대본|스크립트|script|note/i.test(String(c || '')));
      if (tx < 0) continue;
      h = { row: r,
        id: cells.findIndex(c => norm(c) === norm(H_ID)),
        no: cells.findIndex(c => ['#', '순번', 'no', '번호'].includes(norm(c))),
        ti: cells.findIndex(c => ['제목', '슬라이드', '슬라이드명', 'title'].includes(norm(c))),
        tx };
      break;
    }
    if (!h) {
      const seen = (table[0] || []).filter(Boolean).map(String).join(' · ').slice(0, 120);
      throw new Error('대본이 담긴 열을 찾지 못했습니다. 머리글에 "대본" 또는 "메모" 가 들어간 열이 필요합니다.'
        + (seen ? ' (첫 행에서 찾은 머리글: ' + seen + ')' : ''));
    }
    const mode = h.id >= 0 ? 'id' : (h.no >= 0 ? 'no' : 'order');
    const rows = [];
    let seq = 0;
    for (let r = h.row + 1; r < table.length; r++) {
      const cells = table[r] || [];
      const text = String(cells[h.tx] == null ? '' : cells[h.tx]).replace(/\r\n?/g, '\n').trim();
      const label = h.ti >= 0 ? String(cells[h.ti] || '').trim() : '';
      if (mode === 'id') {
        const id = String(cells[h.id] || '').trim();
        if (!id) continue;
        rows.push({ id, text, label });
      } else if (mode === 'no') {
        const n = parseInt(String(cells[h.no] || '').trim(), 10);
        if (!(n > 0)) continue;                       // 빈 줄·꼬리말 주석은 번호가 없다
        rows.push({ no: n, text, label });
      } else {
        seq++;                                        // 빈 행도 한 장으로 세야 뒤 행이 밀리지 않는다
        if (!text && !label) continue;
        rows.push({ no: seq, text, label });
      }
    }
    if (!rows.length) throw new Error('읽을 행이 없습니다 — 머리글 아래에 내용이 없습니다');
    return { mode, rows };
  }

  async function readFile(file) {
    if (/\.csv$/i.test(file.name)) return pairsFrom(tableFromCsv(await file.text()));
    const zip = await unzip(await file.arrayBuffer());
    const dec = new TextDecoder('utf-8');
    const pick = re => { for (const [k, v] of zip) if (re.test(k)) return dec.decode(v); return null; };
    const sheet = pick(/^xl\/worksheets\/sheet1\.xml$/) || pick(/^xl\/worksheets\/.*\.xml$/);
    if (!sheet) throw new Error('워크시트를 찾지 못했습니다');
    return pairsFrom(tableFromSheet(sheet, pick(/^xl\/sharedStrings\.xml$/)));
  }

  const MODE_NOTE = {
    id: '슬라이드ID 로 맞췄습니다.',
    no: '파일의 순번(#)으로 맞췄습니다 — 아래 대응이 맞는지 확인해 주세요.',
    order: '파일의 행 순서로 맞췄습니다 — 아래 대응이 맞는지 확인해 주세요.',
  };
  const cut = (t, n) => (t.length > n ? t.slice(0, n) + '…' : t);

  /* hostWin: 가져오기를 시작한 창. 발표자 뷰(별창)에서 눌렀다면 확인·오류를 그 창에 띄운다.
   * 본 창에만 띄우면 별창을 보고 있는 발표자에게는 아무 일도 안 일어난 것처럼 보인다(실제 결함). */
  async function applyPairs(parsed, hostWin) {
    const list = Deck.nav.slides();
    const byId = new Map(list.map(s => [s.dataset.slideId, s]));
    const input = Array.isArray(parsed) ? { mode: 'id', rows: parsed } : parsed;
    const away = hostWin && hostWin !== window && !hostWin.closed ? hostWin : null;

    const change = [], missed = [];
    let same = 0;
    input.rows.forEach((r, i) => {
      const slide = input.mode === 'id' ? byId.get(r.id) : list[r.no - 1];
      if (!slide) { missed.push(input.mode === 'id' ? r.id : ('#' + r.no)); return; }
      const id = slide.dataset.slideId;
      const item = { id, text: r.text, label: r.label,
        no: list.indexOf(slide) + 1, title: Deck.structure.title(slide) };
      if ((S.speaker(id) || '') === r.text) { same++; return; }
      change.push(item);
    });

    if (!change.length) {
      const msg = missed.length
        ? '반영할 변경이 없습니다 · 덱에 없는 항목 ' + missed.length + '건 (' + missed.slice(0, 5).join(', ') + ')'
        : '반영할 변경이 없습니다 — ' + same + '장이 이미 파일과 같습니다';
      if (away) away.alert(msg); else U.toast(msg, 4000);
      return 0;
    }

    const cleared = change.filter(p => !p.text).length;
    const preview = change.slice(0, 8);
    let ok;
    if (away) {
      ok = away.confirm(
        change.length + '장의 발표 메모·대본을 파일 내용으로 덮어씁니다.\n'
        + MODE_NOTE[input.mode] + '\n'
        + (cleared ? '이 중 ' + cleared + '장은 파일이 비어 있어 메모가 지워집니다.\n' : '')
        + (same ? '동일 ' + same + '장은 그대로 둡니다.\n' : '')
        + (missed.length ? '덱에 없는 항목 ' + missed.length + '건은 건너뜁니다.\n' : '')
        + '\n' + preview.map(p => '  ' + p.no + '. ' + p.title
            + (p.label && p.label !== p.title ? '  ← 파일: ' + p.label : '')
            + '\n      ' + (p.text ? cut(p.text.replace(/\n/g, ' '), 46) : '(비움)')).join('\n')
        + (change.length > preview.length ? '\n  … 외 ' + (change.length - preview.length) + '장' : ''));
    } else {
      const rowsHtml = preview.map(p => '<tr><td style="padding:2px 8px 2px 0;white-space:nowrap"><b>' + p.no + '. '
        + U.escapeHtml(cut(p.title, 18)) + '</b>' + (p.label && p.label !== p.title ? '<br><span class="muted">← ' + U.escapeHtml(cut(p.label, 18)) + '</span>' : '')
        + '</td><td style="padding:2px 0;color:#4a5c73">' + (p.text ? U.escapeHtml(cut(p.text.replace(/\n/g, ' '), 54)) : '<i>(비움)</i>') + '</td></tr>').join('');
      ok = await UI.confirm('발표 메모·대본 가져오기',
        '<p><b>' + change.length + '장</b>을 파일 내용으로 덮어씁니다. ' + MODE_NOTE[input.mode]
        + (cleared ? ' 이 중 <b>' + cleared + '장</b>은 파일이 비어 있어 메모가 지워집니다.' : '') + '</p>'
        + '<table style="font-size:12px;line-height:1.45;border-collapse:collapse;margin:6px 0">' + rowsHtml + '</table>'
        + (change.length > preview.length ? '<p class="muted">… 외 ' + (change.length - preview.length) + '장</p>' : '')
        + '<p class="muted">동일 ' + same + '장은 그대로 둡니다.'
        + (missed.length ? ' · 덱에 없는 항목 ' + missed.length + '건은 건너뜁니다 (' + U.escapeHtml(missed.slice(0, 4).join(', ')) + (missed.length > 4 ? ' 외' : '') + ')' : '')
        + '</p>', '덮어쓰기', true);
    }
    if (!ok) return 0;

    for (const p of change) S.setSpeaker(p.id, p.text);
    S.addLog('발표 메모·대본 가져오기(' + input.mode + '): ' + change.length + '장 반영');
    S.commit();
    if (Deck.review) Deck.review.render();
    if (Deck.presenter) Deck.presenter.refresh();
    const done = change.length + '장의 발표 메모·대본을 반영했습니다';
    U.toast(done, 3200);
    if (away && Deck.presenter && Deck.presenter.notice) Deck.presenter.notice(done);
    return change.length;
  }

  /* hostDoc: 버튼을 누른 창의 document. 파일 선택창은 사용자 조작(user activation)이 있는 창에서만
   * 열린다 — 발표자 뷰에서 눌렀는데 본 창에 <input> 을 만들면 브라우저가 조용히 무시한다. */
